template:
  metadata:
    labels:
      app.kubernetes.io/name: "cogs"
      app.kubernetes.io/instance: "stage4"
      app.kubernetes.io/managed-by: "Helm"
      app.kubernetes.io/part-of: "cogs"
      dev.cogs/stage: "4-preparation"
      dev.cogs/session: "static-test-session"
      dev.cogs/security-claim: "none"
      dev.cogs/qualification: "none"
      dev.cogs/production-ready: "false"
      dev.cogs/role: "trusted"
      dev.cogs/proxy: "true"
    annotations:
      dev.cogs/notice: "future-launcher-must-materialize-fresh-identities-and-configuration"
      dev.cogs/production-ready: "false"
  spec:
    serviceAccountName: stage4-cogs-trusted
    automountServiceAccountToken: false
    enableServiceLinks: false
    activeDeadlineSeconds: 28800
    terminationGracePeriodSeconds: 30
    nodeSelector:
      cogs.dev/node-domain: trusted
    tolerations:
      []
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: worker
        image: "registry.example.invalid/cogs/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 4Gi
        volumeMounts:
          - name: openbao-token
            mountPath: /run/cogs/openbao-token
            readOnly: true
          - name: preparation-contract
            mountPath: /etc/cogs/preparation
            readOnly: true
          - name: public-egress-ca
            mountPath: /etc/cogs/egress-ca
            readOnly: true
          - name: session-material
            mountPath: /run/cogs/session-material
          - name: worker-tmp
            mountPath: /tmp
          - name: session-state
            mountPath: /var/lib/cogs/session
      - name: envoy
        image: "envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb"
        imagePullPolicy: IfNotPresent
        ports:
          - name: proxy
            containerPort: 15001
            protocol: TCP
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
          - name: preparation-contract
            mountPath: /etc/cogs/preparation
            readOnly: true
          - name: public-egress-ca
            mountPath: /etc/cogs/egress-ca
            readOnly: true
          - name: proxy-material
            mountPath: /run/cogs/proxy-material
          - name: proxy-tmp
            mountPath: /tmp
    volumes:
      - name: openbao-token
        projected:
          defaultMode: 256
          sources:
            - serviceAccountToken:
                audience: "openbao.cogs.static-test"
                expirationSeconds: 600
                path: token
      - name: preparation-contract
        configMap:
          name: stage4-cogs-contract
          optional: false
      - name: public-egress-ca
        configMap:
          name: "synthetic-public-egress-ca"
          optional: false
      - name: session-material
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: proxy-material
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: worker-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: proxy-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: session-state
        persistentVolumeClaim:
          claimName: replace-per-session-state-pvc
          readOnly: false
