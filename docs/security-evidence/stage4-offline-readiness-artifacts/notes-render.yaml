template:
  metadata:
    labels:
      app.kubernetes.io/name: "cogs"
      app.kubernetes.io/instance: "stage4"
      app.kubernetes.io/managed-by: "Helm"
      app.kubernetes.io/part-of: "cogs"
      dev.cogs/stage: "4-preparation"
      dev.cogs/session: "static-test-session"
      dev.cogs/security-claim: "none"
      dev.cogs/qualification: "none"
      dev.cogs/production-ready: "false"
      dev.cogs/role: "sandbox"
    annotations:
      dev.cogs/notice: "guest-uid-0-is-untrusted-vm-root-future-trusted-launcher-material-absent"
      dev.cogs/production-ready: "false"
  spec:
    serviceAccountName: cogs-sandbox-inert
    automountServiceAccountToken: false
    enableServiceLinks: false
    activeDeadlineSeconds: 28800
    terminationGracePeriodSeconds: 30
    runtimeClassName: "kata-qemu-cogs"
    nodeSelector:
      cogs.dev/nested-virtualization: enabled
      cogs.dev/node-domain: sandbox-kata
      cogs.dev/sandbox-runtime: kata-qemu-kvm
    tolerations:
      - effect: NoSchedule
        key: cogs.dev/sandbox
        operator: Equal
        value: kata
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: sandbox
        image: "registry.example.invalid/cogs/sandbox@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
        imagePullPolicy: IfNotPresent
        env:
          - name: HTTP_PROXY
            value: "http://stage4-cogs-proxy:15001"
          - name: HTTPS_PROXY
            value: "http://stage4-cogs-proxy:15001"
          - name: SSL_CERT_FILE
            value: /etc/cogs/egress-ca/egress-ca.crt
        ports:
          - name: ssh
            containerPort: 22
            protocol: TCP
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 8Gi
          limits:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 16Gi
        volumeMounts:
          - name: public-egress-ca
            mountPath: /etc/cogs/egress-ca
            readOnly: true
          - name: sandbox-tmp
            mountPath: /tmp
          - name: workspace
            mountPath: /workspace
    volumes:
      - name: public-egress-ca
        configMap:
          name: "synthetic-public-egress-ca"
          optional: false
      - name: sandbox-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: workspace
        persistentVolumeClaim:
          claimName: replace-per-session-workspace-pvc
          readOnly: false
