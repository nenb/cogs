name: Stage 2 local Kata qualification
run-name: Stage 2 local Kata qualification H=${{ inputs.reviewed_implementation_head }} G=${{ inputs.reviewed_control_head }}

on:
  workflow_dispatch:
    inputs:
      reviewed_implementation_head:
        description: Exact reviewed implementation revision H
        required: true
        type: string
      reviewed_control_head:
        description: Exact reviewed control revision G containing this unchanged workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stage2-local-kata-qualification
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_id: ${{ steps.pre_admission.outputs.run_id }}
    env:
      EXACT_IMPLEMENTATION_HEAD: ${{ inputs.reviewed_implementation_head }}
      EXACT_CONTROL_HEAD: ${{ inputs.reviewed_control_head }}
    steps:
      - name: Admit the stable first-created dispatch before every source effect
        id: pre_admission
        timeout-minutes: 1
        env:
          ACTIONS_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED_IMPLEMENTATION_HEAD: ${{ vars.STAGE2_LOCAL_IMPLEMENTATION_HEAD }}
          CONFIGURED_CONTROL_HEAD: ${{ vars.STAGE2_LOCAL_CONTROL_HEAD }}
          CONFIGURED_AUTHORIZED_ACTOR: ${{ vars.STAGE2_LOCAL_AUTHORIZED_ACTOR }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 50s \
            /usr/bin/python3 -I -B - <<'PY' >>"$GITHUB_OUTPUT"
          import json, os, stat, time, urllib.parse, urllib.request
          def need(value):
              if not value: raise SystemExit(2)
          denied = {"AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_PROFILE",
                    "AWS_WEB_IDENTITY_TOKEN_FILE", "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
                    "ACTIONS_ID_TOKEN_REQUEST_URL", "GITHUB_TOKEN", "GH_TOKEN", "PYTHONPATH",
                    "PYTHONHOME", "PYTHONOPTIMIZE", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY",
                    "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"}
          need(not denied.intersection(os.environ))
          get = lambda name: os.environ.get(name, "")
          run_id = get("GITHUB_RUN_ID")
          need(get("GITHUB_EVENT_NAME") == "workflow_dispatch" and run_id.isdigit()
               and int(run_id) > 0 and get("GITHUB_RUN_ATTEMPT") == "1")
          need(get("GITHUB_REPOSITORY") == "nenb/cogs" and get("GITHUB_REF") == "refs/heads/main"
               and get("GITHUB_REF_PROTECTED") == "true")
          need(get("EXACT_IMPLEMENTATION_HEAD") == get("CONFIGURED_IMPLEMENTATION_HEAD")
               and get("EXACT_CONTROL_HEAD") == get("CONFIGURED_CONTROL_HEAD")
               and get("EXACT_CONTROL_HEAD") == get("GITHUB_SHA"))
          need(get("GITHUB_ACTOR") == get("CONFIGURED_AUTHORIZED_ACTOR"))
          token = get("ACTIONS_READ_TOKEN")
          try: token_bytes = token.encode("ascii")
          except UnicodeEncodeError: raise SystemExit(2) from None
          need(1 <= len(token_bytes) <= 1024 and all(0x21 <= byte <= 0x7e for byte in token_bytes))
          descriptor = os.open(get("GITHUB_EVENT_PATH"), os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              before = os.fstat(descriptor); need(stat.S_ISREG(before.st_mode) and 0 < before.st_size <= 1048576)
              raw = os.read(descriptor, before.st_size + 1); after = os.fstat(descriptor)
              need(len(raw) == before.st_size and (before.st_dev, before.st_ino, before.st_size,
                   before.st_mtime_ns, before.st_ctime_ns) == (after.st_dev, after.st_ino,
                   after.st_size, after.st_mtime_ns, after.st_ctime_ns))
          finally: os.close(descriptor)
          try: event = json.loads(raw)
          except (UnicodeError, json.JSONDecodeError): raise SystemExit(2) from None
          need(event.get("repository", {}).get("full_name") == "nenb/cogs")
          inputs = event.get("inputs", {})
          need(inputs.get("reviewed_implementation_head") == get("EXACT_IMPLEMENTATION_HEAD")
               and inputs.get("reviewed_control_head") == get("EXACT_CONTROL_HEAD"))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_args): raise SystemExit(2)
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          query = urllib.parse.urlencode({"event":"workflow_dispatch", "per_page":100, "page":1})
          url = "https://api.github.com/repos/nenb/cogs/actions/workflows/stage2-local-kata-qualification.yml/runs?" + query
          previous = None
          for observation in range(6):
              request = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}", "User-Agent":"cogs-stage2-local-pre-admission",
                  "X-GitHub-Api-Version":"2022-11-28"})
              try:
                  with opener.open(request, timeout=20) as response:
                      body = response.read(4194305); need(response.status == 200 and 0 < len(body) <= 4194304)
                  value = json.loads(body)
              except Exception: raise SystemExit(2) from None
              runs = value.get("workflow_runs"); need(type(runs) is list and value.get("total_count") == len(runs)
                  and len(runs) == 9)
              rows = []
              current_title = ("Stage 2 local Kata qualification H=" + get("EXACT_IMPLEMENTATION_HEAD")
                  + " G=" + get("EXACT_CONTROL_HEAD"))
              predecessor_title = ("Stage 2 local Kata qualification H=59d992b305cfd243f2d7b9c770fe24b0a36cc053"
                  " G=a9e02f1269684db98a42bfdaed6e2f193ba1c631")
              second_predecessor_title = ("Stage 2 local Kata qualification H=59d992b305cfd243f2d7b9c770fe24b0a36cc053"
                  " G=223d1ddddb59391010950c1880b1ef36115f8472")
              third_predecessor_title = ("Stage 2 local Kata qualification H=a2c25f34c35d778965ab7b125fd3b8b4460b0617"
                  " G=06a1d5124c68a34f80b932ed02173afa1bad365c")
              fourth_predecessor_title = ("Stage 2 local Kata qualification H=1eaec52dd4e2f1222548362e92adc780a2169025"
                  " G=83ed917ea7df3df7d7af66f7a810b26b4e27667a")
              fifth_predecessor_title = ("Stage 2 local Kata qualification H=1eaec52dd4e2f1222548362e92adc780a2169025"
                  " G=e733f8c0d02225bcbff30d5484e1276421ce22b6")
              sixth_predecessor_title = ("Stage 2 local Kata qualification H=1eaec52dd4e2f1222548362e92adc780a2169025"
                  " G=2910f0fdd6bbcbfe67e56bfe4d28c321b2833171")
              seventh_predecessor_title = ("Stage 2 local Kata qualification H=4bced3fb4b768f5dc67f919ae8d579059739b126"
                  " G=e0bc91c1856b808d1e03850701f535ceb5f5598c")
              eighth_predecessor_title = ("Stage 2 local Kata qualification H=e2854b30549ade94e34755dddc0fb2c83f4dacc0"
                  " G=5d16bc352e5efe42a711c07957bccb7efbd9bd4e")
              for item in runs:
                  need(type(item) is dict and item.get("event") == "workflow_dispatch"
                       and type(item.get("id")) is int and item["id"] > 0 and item.get("run_attempt") == 1)
                  row = (item["id"], item["run_attempt"], item.get("status"), item.get("conclusion"),
                         item.get("head_sha"), item.get("display_title")); rows.append(row)
                  if item["id"] == 32584575939:
                      need(row[2:] == ("completed", "failure", "a9e02f1269684db98a42bfdaed6e2f193ba1c631",
                                      predecessor_title))
                  elif item["id"] == 32586393441:
                      need(row[2:] == ("completed", "failure", "223d1ddddb59391010950c1880b1ef36115f8472",
                                      second_predecessor_title))
                  elif item["id"] == 32596053811:
                      need(row[2:] == ("completed", "failure", "06a1d5124c68a34f80b932ed02173afa1bad365c",
                                      third_predecessor_title))
                  elif item["id"] == 32602439014:
                      need(row[2:] == ("completed", "failure", "83ed917ea7df3df7d7af66f7a810b26b4e27667a",
                                      fourth_predecessor_title))
                  elif item["id"] == 32613383776:
                      need(row[2:] == ("completed", "failure", "e733f8c0d02225bcbff30d5484e1276421ce22b6",
                                      fifth_predecessor_title))
                  elif item["id"] == 32614828572:
                      need(row[2:] == ("completed", "failure", "2910f0fdd6bbcbfe67e56bfe4d28c321b2833171",
                                      sixth_predecessor_title))
                  elif item["id"] == 32622048772:
                      need(row[2:] == ("completed", "failure", "e0bc91c1856b808d1e03850701f535ceb5f5598c",
                                      seventh_predecessor_title))
                  elif item["id"] == 32628930290:
                      need(row[2:] == ("completed", "failure", "5d16bc352e5efe42a711c07957bccb7efbd9bd4e",
                                      eighth_predecessor_title))
                  elif item["id"] == int(run_id):
                      need(row[2] in ("queued", "in_progress") and row[3] is None
                           and row[4:] == (get("EXACT_CONTROL_HEAD"), current_title))
                  else: raise SystemExit(2)
              rows = tuple(sorted(rows)); need(len(rows) == len(set(rows)))
              need({row[0] for row in rows} == {
                  32584575939, 32586393441, 32596053811, 32602439014, 32613383776,
                  32614828572, 32622048772, 32628930290, int(run_id)})
              if rows == previous:
                  print(f"run_id={run_id}"); break
              previous = rows
              if observation == 5: raise SystemExit(2)
              time.sleep(2)
          PY

  local-kata:
    needs: admission
    runs-on: ubuntu-24.04
    # Fixed local-job post-admission bounds total 122 minutes inside one 7,620-second envelope.
    # Immutable acquisition has its own bound and completes before custody.
    # Recovery, cleanup, residue, and publication retain a non-borrowing
    # 21-minute reserve after the sole mutable entry bound.
    timeout-minutes: 127
    env:
      EXACT_IMPLEMENTATION_HEAD: ${{ inputs.reviewed_implementation_head }}
      EXACT_CONTROL_HEAD: ${{ inputs.reviewed_control_head }}
      REPORT_STAGING: /var/tmp/cogs-stage2-local-result-${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_READBACK_STAGING: /var/tmp/cogs-stage2-local-result-upload-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_READBACK_STAGING: /var/tmp/cogs-stage2-local-receipt-upload-${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_ARTIFACT_NAME: stage2-local-kata-report-${{ inputs.reviewed_implementation_head }}-${{ inputs.reviewed_control_head }}-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_ARTIFACT_NAME: stage2-local-kata-upload-receipt-${{ inputs.reviewed_implementation_head }}-${{ inputs.reviewed_control_head }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Acquire exact control revision G without credentials
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -z "$(/usr/bin/find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" /usr/bin/git init --quiet "$GITHUB_WORKSPACE"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags --depth=1 \
            origin "$EXACT_CONTROL_HEAD"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD

      - name: Gate reviewed H and G after unauthenticated exact-G acquisition
        id: gate
        timeout-minutes: 1
        env:
          CONFIGURED_IMPLEMENTATION_HEAD: ${{ vars.STAGE2_LOCAL_IMPLEMENTATION_HEAD }}
          CONFIGURED_CONTROL_HEAD: ${{ vars.STAGE2_LOCAL_CONTROL_HEAD }}
          CONFIGURED_AUTHORIZED_ACTOR: ${{ vars.STAGE2_LOCAL_AUTHORIZED_ACTOR }}
          PRE_EFFECT_ADMITTED_RUN_ID: ${{ needs.admission.outputs.run_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$EXACT_CONTROL_HEAD" = "$GITHUB_SHA"
          test "$EXACT_CONTROL_HEAD" = "$(/usr/bin/git rev-parse HEAD)"
          test -z "$(/usr/bin/git status --porcelain)"
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-local-qualification-guard.py" \
            >>"$GITHUB_OUTPUT"

      - name: Acquire exact reviewed implementation revision H separately without credentials
        timeout-minutes: 1
        run: |
          set -euo pipefail
          destination=$GITHUB_WORKSPACE/stage2-implementation-H
          test ! -e "$destination"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" /usr/bin/git init --quiet "$destination"
          "${clean[@]}" /usr/bin/git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" /usr/bin/git -C "$destination" fetch --quiet --no-tags --depth=1 \
            origin "${{ steps.gate.outputs.implementation_head }}"
          "${clean[@]}" /usr/bin/git -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(/usr/bin/git -C "$destination" rev-parse HEAD)" = "${{ steps.gate.outputs.implementation_head }}"
          test -z "$(/usr/bin/git -C "$destination" status --porcelain)"

      - name: Complete exact immutable preparation before KVM eligibility and role custody
        id: preparation
        timeout-minutes: 32
        env:
          EXPECTED_MANIFEST: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
        run: |
          set -euo pipefail
          phase() { /usr/bin/printf 'COGS_PREKVM_PHASE:%s\n' "$1"; }
          phase baseline
          test ! -e /var/lib/cogs
          test ! -e /opt/kata
          phase source
          prepared=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 75s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/stage2-implementation-H/scripts/prepare-stage2-fixed-source.py")
          /usr/bin/python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read())
          assert value["revision"] == sys.argv[1] and value["manifest_sha256"] == sys.argv[2]
          ' "${{ steps.gate.outputs.implementation_head }}" "$EXPECTED_MANIFEST" <<<"$prepared"
          phase control
          staged=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 75s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-stage-reviewed-control.py")
          test "$staged" = "control_sha256=$EXPECTED_CONTROL_SHA256"
          observed=$(sudo -n /usr/bin/sha256sum \
            /var/lib/cogs/stage2-completion-v1/control/stage2-local-static-control-v1.json \
            | /usr/bin/cut -d' ' -f1)
          test "$observed" = "$EXPECTED_CONTROL_SHA256"
          phase immutable
          immutable=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 1770s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_kata_immutable_preparation.py)
          /usr/bin/python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read())
          assert value == {"version":"cogs.stage2-local-immutable-preparation/v1",
            "rootfs_artifact_count":16,"runtime_archive_count":2,
            "receipt_sha256":value["receipt_sha256"],"control_verified":True,
            "authority":"immutable-public-input-preparation-only"}
          assert len(value["receipt_sha256"]) == 64
          ' <<<"$immutable"
          phase installed
          sudo -n /usr/bin/test -x /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/.state/completion-v1/kata-runtime-v1/bin/containerd
          sudo -n /usr/bin/test -x /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/.state/completion-v1/kata-runtime-v1/bin/ctr
          sudo -n /usr/bin/test -x /opt/kata/bin/containerd-shim-kata-v2
          test ! -e /run/cogs-stage2-local-private-v2

      - name: Execute the sole zero-argument local qualification entry
        id: local_entry
        continue-on-error: true
        timeout-minutes: 59
        run: |
          set -euo pipefail
          test "${{ steps.preparation.outcome }}" = success
          test ! -e "$REPORT_STAGING"
          /bin/mkdir -m 0700 -- "$REPORT_STAGING"
          umask 077
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 3470s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C \
            PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            /usr/bin/python3 -I -B -c \
            'import sys; sys.path.insert(0,"/var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote"); import runpy; runpy.run_path("/var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_local_full.py",run_name="__main__")' \
            >"$REPORT_STAGING/report.partial"

      - name: Invoke cleanup-only recovery after every local entry outcome
        id: recovery
        if: always()
        continue-on-error: true
        timeout-minutes: 13
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 720s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C \
            PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/recover-stage2-completion-remote.sh

      - name: Settle and remove fixed source and control roots only after recovery
        id: fixed_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-local-settlement.py" supervise-cleanup <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          $RECOVERY_OUTCOME
          EOF

      - name: Independently prove zero lifecycle residue after cleanup
        id: independent_residue
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-local-settlement.py" supervise-residue <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          EOF

      - name: Validate semantics and reviewed schema then freeze the private-receipt report
        id: publication
        if: always() && steps.recovery.outcome == 'success' && steps.fixed_cleanup.outcome == 'success' && steps.independent_residue.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
        run: |
          set -euo pipefail
          test ! -e "$REPORT_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 50s \
            env -i PATH=/usr/bin:/bin GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" REPORT_STAGING="$REPORT_STAGING" \
            TRUSTED_RUNNER_UID="$(/usr/bin/id -u)" \
            EXPECTED_IMPLEMENTATION_HEAD="$EXPECTED_IMPLEMENTATION_HEAD" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" \
            EXPECTED_RESULT_SCHEMA_SHA256="$EXPECTED_RESULT_SCHEMA_SHA256" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-local-publication.py" publish \
            >>"$GITHUB_OUTPUT"

      - name: Upload the sole canonical local report member
        id: report_upload
        if: always() && steps.publication.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REPORT_ARTIFACT_NAME }}
          path: ${{ env.REPORT_STAGING }}/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Download report by exact numeric artifact ID with fatal digest mismatch
        id: report_download
        if: always() && steps.report_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.report_upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ env.REPORT_READBACK_STAGING }}
          digest-mismatch: error

      - name: Byte-compare sole exact-ID report readback
        id: report_readback
        if: always() && steps.report_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          REPORT_ARTIFACT_ID: ${{ steps.report_upload.outputs.artifact-id }}
          REPORT_ARTIFACT_DIGEST: ${{ steps.report_upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.publication.outputs.report_sha256 }}
          REPORT_BYTES: ${{ steps.publication.outputs.report_bytes }}
          REPORT_RESULT: ${{ steps.publication.outputs.report_result }}
          FAILURE_CODE: ${{ steps.publication.outputs.failure_code }}
          ENTRY_OUTCOME: ${{ steps.local_entry.outcome }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-local-upload-receipt.py" readback

      - name: Create separate canonical upload-binding receipt after exact report readback
        id: receipt_create
        if: always() && steps.report_readback.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          REPORT_ARTIFACT_ID: ${{ steps.report_upload.outputs.artifact-id }}
          REPORT_ARTIFACT_DIGEST: ${{ steps.report_upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.publication.outputs.report_sha256 }}
          REPORT_BYTES: ${{ steps.publication.outputs.report_bytes }}
          REPORT_RESULT: ${{ steps.publication.outputs.report_result }}
          FAILURE_CODE: ${{ steps.publication.outputs.failure_code }}
          ENTRY_OUTCOME: ${{ steps.local_entry.outcome }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i PATH=/usr/bin:/bin GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" REPORT_STAGING="$REPORT_STAGING" \
            REPORT_READBACK_STAGING="$REPORT_READBACK_STAGING" \
            REPORT_ARTIFACT_NAME="$REPORT_ARTIFACT_NAME" RECEIPT_ARTIFACT_NAME="$RECEIPT_ARTIFACT_NAME" \
            EXPECTED_IMPLEMENTATION_HEAD="$EXPECTED_IMPLEMENTATION_HEAD" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" \
            EXPECTED_CONTROL_HEAD="$EXPECTED_CONTROL_HEAD" EXPECTED_CONTROL_SHA256="$EXPECTED_CONTROL_SHA256" \
            EXPECTED_WORKFLOW_SHA256="$EXPECTED_WORKFLOW_SHA256" \
            EXPECTED_RESULT_SCHEMA_SHA256="$EXPECTED_RESULT_SCHEMA_SHA256" \
            REPORT_ARTIFACT_ID="$REPORT_ARTIFACT_ID" REPORT_ARTIFACT_DIGEST="$REPORT_ARTIFACT_DIGEST" \
            REPORT_SHA256="$REPORT_SHA256" REPORT_BYTES="$REPORT_BYTES" REPORT_RESULT="$REPORT_RESULT" \
            FAILURE_CODE="$FAILURE_CODE" ENTRY_OUTCOME="$ENTRY_OUTCOME" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-local-upload-receipt.py" create

      - name: Upload separate non-authoritative upload-binding receipt
        id: receipt_upload
        if: always() && steps.receipt_create.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RECEIPT_ARTIFACT_NAME }}
          path: ${{ env.REPORT_STAGING }}/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Download receipt by its exact numeric artifact ID
        id: receipt_download
        if: always() && steps.receipt_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.receipt_upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ env.RECEIPT_READBACK_STAGING }}
          digest-mismatch: error

      - name: Byte-compare sole exact-ID receipt readback
        id: receipt_readback
        if: always() && steps.receipt_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          REPORT_ARTIFACT_ID: ${{ steps.report_upload.outputs.artifact-id }}
          REPORT_ARTIFACT_DIGEST: ${{ steps.report_upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.publication.outputs.report_sha256 }}
          REPORT_BYTES: ${{ steps.publication.outputs.report_bytes }}
          REPORT_RESULT: ${{ steps.publication.outputs.report_result }}
          FAILURE_CODE: ${{ steps.publication.outputs.failure_code }}
          ENTRY_OUTCOME: ${{ steps.local_entry.outcome }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-local-upload-receipt.py" receipt-readback

      - name: Remove all local report and readback staging
        id: output_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /bin/rm -rf -- "$REPORT_STAGING" "$REPORT_READBACK_STAGING" "$RECEIPT_READBACK_STAGING"
          test ! -e "$REPORT_STAGING"
          test ! -e "$REPORT_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"

      - name: Enforce attempt 1 complete custody chain and final zero residue
        if: always()
        timeout-minutes: 1
        env:
          ENTRY: ${{ steps.local_entry.outcome }}
          REPORT_RESULT: ${{ steps.publication.outputs.report_result }}
          RECOVERY: ${{ steps.recovery.outcome }}
          FIXED_CLEANUP: ${{ steps.fixed_cleanup.outcome }}
          INDEPENDENT_RESIDUE: ${{ steps.independent_residue.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
          REPORT_UPLOAD: ${{ steps.report_upload.outcome }}
          REPORT_DOWNLOAD: ${{ steps.report_download.outcome }}
          REPORT_READBACK: ${{ steps.report_readback.outcome }}
          RECEIPT_CREATE: ${{ steps.receipt_create.outcome }}
          RECEIPT_UPLOAD: ${{ steps.receipt_upload.outcome }}
          RECEIPT_DOWNLOAD: ${{ steps.receipt_download.outcome }}
          RECEIPT_READBACK: ${{ steps.receipt_readback.outcome }}
          OUTPUT_CLEANUP: ${{ steps.output_cleanup.outcome }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          case "$REPORT_RESULT:$ENTRY" in
            pass:success|failure:failure) ;;
            *) exit 1 ;;
          esac
          for outcome in "$RECOVERY" "$FIXED_CLEANUP" "$INDEPENDENT_RESIDUE" \
            "$PUBLICATION" "$REPORT_UPLOAD" "$REPORT_DOWNLOAD" "$REPORT_READBACK" \
            "$RECEIPT_CREATE" "$RECEIPT_UPLOAD" "$RECEIPT_DOWNLOAD" "$RECEIPT_READBACK" \
            "$OUTPUT_CLEANUP"
          do
            test "$outcome" = success
          done
          sudo -n /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-local-settlement.py" supervise-final <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          EOF
          # Canonical certain failures are retained evidence, never a pass.
          test "$REPORT_RESULT" = pass
