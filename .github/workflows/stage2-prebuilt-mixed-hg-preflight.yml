name: Stage 2 exact mixed H-G-Q no-KVM preflight
run-name: Stage 2 prebuilt mixed H-G-Q preflight H=${{ inputs.implementation_head }} G=${{ inputs.control_head }} Q=${{ inputs.qualification_head }}

on:
  workflow_dispatch:
    inputs:
      implementation_head:
        description: Exact reviewed implementation H
        required: true
        type: string
      control_head:
        description: Exact protected-main control G
        required: true
        type: string
      qualification_head:
        description: Exact direct-child qualification package Q
        required: true
        type: string

permissions:
  actions: read

concurrency:
  group: stage2-mixed-hg-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BASH_ENV: /dev/null
      ENV: /dev/null
      EXACT_IMPLEMENTATION_HEAD: ${{ inputs.implementation_head }}
      EXACT_CONTROL_HEAD: ${{ inputs.control_head }}
      EXACT_QUALIFICATION_HEAD: ${{ inputs.qualification_head }}
    steps:
      - name: Admit sole exact protected-main H-G-Q preflight
        timeout-minutes: 1
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_IMPLEMENTATION_HEAD" "$EXACT_CONTROL_HEAD" "$EXACT_QUALIFICATION_HEAD" "$GITHUB_RUN_ID"; do
            case "$selected" in
              6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = nenb && test "$GITHUB_TRIGGERING_ACTOR" = nenb
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXACT_QUALIFICATION_HEAD" = "$GITHUB_SHA"
          test "$EXACT_IMPLEMENTATION_HEAD" != "$EXACT_CONTROL_HEAD"
          test "$EXACT_IMPLEMENTATION_HEAD" != "$EXACT_QUALIFICATION_HEAD"
          test "$EXACT_CONTROL_HEAD" != "$EXACT_QUALIFICATION_HEAD"
          gh api --paginate --slurp \
            'repos/nenb/cogs/actions/workflows/stage2-prebuilt-mixed-hg-preflight.yml/runs?event=workflow_dispatch&per_page=100' \
            >"$RUNNER_TEMP/preflight-runs.json"
          jq -e --arg q "$EXACT_QUALIFICATION_HEAD" --argjson current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[] | select(.head_sha == $q and
              .path == ".github/workflows/stage2-prebuilt-mixed-hg-preflight.yml")] |
             map(.id) == [$current]' "$RUNNER_TEMP/preflight-runs.json" >/dev/null

      - name: Acquire exact protected-main Q and prove H-G-Q ancestry without credentials
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$EXACT_QUALIFICATION_HEAD" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_REF_PROTECTED" = true
          test -z "$(/usr/bin/find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          exact_git() {
            path=$1 revision=$2
            "${clean[@]}" /usr/bin/git init --quiet "$path"
            "${clean[@]}" /usr/bin/git -C "$path" remote add origin https://github.com/nenb/cogs.git
            "${clean[@]}" /usr/bin/git -C "$path" fetch --quiet --no-tags --depth=3 origin "$revision"
            "${clean[@]}" /usr/bin/git -C "$path" checkout --quiet --detach FETCH_HEAD
            test "$(/usr/bin/git -C "$path" rev-parse HEAD)" = "$revision"
            test -z "$(/usr/bin/git -C "$path" status --porcelain)"
          }
          exact_git "$GITHUB_WORKSPACE/qualification" "$EXACT_QUALIFICATION_HEAD"
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/qualification" rev-parse HEAD^)" = "$EXACT_CONTROL_HEAD"
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/qualification" rev-parse HEAD^^)" = "$EXACT_IMPLEMENTATION_HEAD"
      - name: Normalize the exact hosted opt scaffold before immutable preparation
        timeout-minutes: 1
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/qualification/scripts/stage2-revision-retirement.py" "$GITHUB_SHA" "$EXACT_IMPLEMENTATION_HEAD" "$EXACT_CONTROL_HEAD" "$EXACT_QUALIFICATION_HEAD"
          test ! -e /opt/kata && test ! -L /opt/kata
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)" = root:root:777
          sudo -n /bin/chmod 0755 /opt
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)" = root:root:755
      - name: Execute exact mixed H-G preparation and mandatory settlement without KVM
        timeout-minutes: 46
        run: |
          env -i BASH_ENV=/dev/null ENV=/dev/null HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_REF_PROTECTED="$GITHUB_REF_PROTECTED" GITHUB_SHA="$GITHUB_SHA" \
            EXACT_IMPLEMENTATION_HEAD="$EXACT_IMPLEMENTATION_HEAD" EXACT_CONTROL_HEAD="$EXACT_CONTROL_HEAD" \
            EXACT_QUALIFICATION_HEAD="$EXACT_QUALIFICATION_HEAD" \
            /usr/bin/timeout --signal=TERM --kill-after=10s 2690s /bin/bash "$GITHUB_WORKSPACE/qualification/scripts/stage2-prebuilt-mixed-hg-preflight.sh" run
      - name: Independently repeat mandatory settlement after every outcome
        if: always()
        timeout-minutes: 11
        run: |
          env -i BASH_ENV=/dev/null ENV=/dev/null HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/timeout --signal=TERM --kill-after=10s 630s /bin/bash "$GITHUB_WORKSPACE/qualification/scripts/stage2-prebuilt-mixed-hg-preflight.sh" settle
      - name: Restore the exact hosted opt scaffold only after settlement
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test ! -e /opt/kata && test ! -L /opt/kata
          seen=$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)
          case "$seen" in root:root:755) sudo -n /bin/chmod 0777 /opt ;; root:root:777) ;; *) exit 1 ;; esac
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)" = root:root:777
