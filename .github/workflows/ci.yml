name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Pi embedding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - name: Verify exact same-repository pull request head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go for the static guest probe
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/egress-conformance/guest-probes/go.mod
          cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Format and lint
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, hostile-canary, fake-model, and JSONL tests
        env:
          PI_OFFLINE: "1"
          PI_TELEMETRY: "0"
          PI_SKIP_VERSION_CHECK: "1"
        run: npm test

      - name: Test and reproducibly build the static guest probe
        run: |
          cd test/egress-conformance/guest-probes
          python3 -c 'compile(open("black-box-probe.py", encoding="utf-8").read(), "black-box-probe.py", "exec")'
          bash -n run-black-box-case.sh run-kvm-black-box-case.sh
          go test ./...
          ./build.sh "$RUNNER_TEMP/probe-a"
          ./build.sh "$RUNNER_TEMP/probe-b"
          (cd "$RUNNER_TEMP/probe-a" && sha256sum --check cogs-net-probe-linux-amd64.sha256)
          (cd "$RUNNER_TEMP/probe-b" && sha256sum --check cogs-net-probe-linux-amd64.sha256)
          cmp "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64" "$RUNNER_TEMP/probe-b/cogs-net-probe-linux-amd64"
          cmp "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64.sha256" "$RUNNER_TEMP/probe-b/cogs-net-probe-linux-amd64.sha256"
          cmp "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64.build.json" "$RUNNER_TEMP/probe-b/cogs-net-probe-linux-amd64.build.json"
          file "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64" | grep -F 'statically linked'
          ! readelf --program-headers "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64" | grep -F INTERP
          ! readelf --dynamic "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64" | grep -F NEEDED
          canary='must-never-be-reflected-7f4d4a9f'
          output=$(printf '{"version":"cogs.guest-probe/v1alpha1","operation":"http","url":"https://127.0.0.1:1/private?value=%s","headers":{"Authorization":"Bearer %s"},"timeout_ms":100}' "$canary" "$canary" | "$RUNNER_TEMP/probe-a/cogs-net-probe-linux-amd64" 2>"$RUNNER_TEMP/probe-stderr")
          ! grep -F "$canary" <<<"$output"
          test ! -s "$RUNNER_TEMP/probe-stderr"

      - name: Validate schemas and report semantics
        run: npm run schemas

      - name: Regenerate and verify Envoy ext_authz descriptor
        run: npm run egress-bindings:regenerate-check

      - name: Verify base-image digest pins
        run: npm run images:check

      - name: Verify registry dependency integrity
        run: npm run lock:check

      - name: Enforce production dependency license policy
        run: npm run licenses

      - name: Audit dependencies
        run: npm run audit

      - name: Validate the non-deploying AWS feasibility fixture
        run: ./deploy/aws-feasibility/validate.sh

      - name: Lint and render the non-deploying Helm scaffold
        run: |
          helm lint deploy/helm/cogs
          test -z "$(helm template cogs deploy/helm/cogs)"

      - name: Upload validated guest probe, digest, and build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cogs-net-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-a/
          if-no-files-found: error
          retention-days: 7

  native-c1:
    name: Native C1
    needs: quality
    if: github.run_attempt == 1 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COGS_C1_EXPECTED_REPOSITORY: ${{ github.repository }}
      COGS_C1_EXPECTED_WORKFLOW_FILE: .github/workflows/ci.yml
      COGS_C1_EXPECTED_JOB: native-c1
      COGS_C1_EXPECTED_EVENT: pull_request
      COGS_C1_EXPECTED_ACTION: ${{ github.event.action }}
      COGS_C1_EXPECTED_RUN_ID: ${{ github.run_id }}
      COGS_C1_EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
      COGS_C1_EXPECTED_ENVELOPE_SHA: ${{ github.sha }}
      COGS_C1_EXPECTED_EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      COGS_C1_EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      COGS_C1_EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      COGS_C1_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      COGS_C1_EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
      COGS_C1_EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      COGS_C1_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COGS_C1_EXPECTED_CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact same-repository pull request head
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Invoke workflow-bound native C1 gate
        env:
          COGS_C1_EXPECTED_WORKFLOW_BLOB_DIGEST: ${{ hashFiles('.github/workflows/ci.yml') }}
        run: /usr/bin/python3 -I test/aws-stage2-completion-rootfs-builder-native.py --workflow-bound

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Images, vulnerabilities, and SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVOY_IMAGE: envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb
      OPENBAO_IMAGE: quay.io/openbao/openbao:2.6.0@sha256:900bb64d0671cd1d82b693c56206f7263b582445f3a3bb6ba6e5213f524a6653
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build worker scaffold
        run: docker build --pull=false --tag cogs-worker:ci --file images/worker/Dockerfile .

      - name: Build sandbox scaffold
        run: docker build --pull=false --tag cogs-sandbox:ci --file images/sandbox/Dockerfile .

      - name: Build insecure-container test driver
        run: docker build --pull=false --tag cogs-insecure-sandbox:ci --file dev/insecure-sandbox/Dockerfile .

      - name: Pull pinned selected proxy
        run: docker pull "$ENVOY_IMAGE"

      - name: Pull pinned OpenBao model-auth fixture
        run: docker pull "$OPENBAO_IMAGE"

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cogs-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan sandbox image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cogs-sandbox:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan insecure-container test driver
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cogs-insecure-sandbox:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan pinned Envoy candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ENVOY_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan pinned OpenBao model-auth fixture
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.OPENBAO_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore-openbao

      - name: Generate worker SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cogs-worker:ci
          format: spdx-json
          output-file: worker.spdx.json

      - name: Generate sandbox SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cogs-sandbox:ci
          format: spdx-json
          output-file: sandbox.spdx.json

      - name: Generate insecure-container test-driver SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: cogs-insecure-sandbox:ci
          format: spdx-json
          output-file: insecure-container.spdx.json

      - name: Generate Envoy candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.ENVOY_IMAGE }}
          format: spdx-json
          output-file: envoy-candidate.spdx.json

      - name: Generate OpenBao model-auth fixture SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.OPENBAO_IMAGE }}
          format: spdx-json
          output-file: openbao-model-auth.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sboms-${{ github.run_id }}
          path: |
            *.spdx.json
          if-no-files-found: error
          retention-days: 30
  native-runtime-preflight:
    name: Native runtime preflight
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run exact-head native runtime preflight in trusted sandbox
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$EXPECTED_HEAD_REPOSITORY" = "$EXPECTED_REPOSITORY"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          IFS= read -r actual_head < <(/usr/bin/git rev-parse --verify HEAD)
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          IFS= read -r checkout < <(/usr/bin/pwd -P)
          IFS= read -r checkout_root < <(/usr/bin/git rev-parse --show-toplevel)
          IFS= read -r -d '' trusted_sandbox_v1 <<'SANDBOX' || test "$?" = 1
          set -Eeuo pipefail
          umask 077
          checkout_dev=$1 checkout_ino=$2 checkout_uid=$3 checkout_gid=$4 test_path=$5
          IFS= read -r -d '' descriptor_observer <<'DESCRIPTOR' || test "$?" = 1
          import os, stat, sys
          expected = tuple(map(int, sys.argv[1:5]))
          parent = os.getppid()
          base = f"/proc/{parent}"
          if parent != 1 or sys.argv[5] not in ("before","after"): raise RuntimeError("descriptor observer authority")
          for name in ("uid_map","gid_map"):
              raw = open(base+"/"+name, encoding="ascii").read()
              if raw.count("\n") != 1 or raw.split() != ["0","0","1"]: raise RuntimeError("non-root-only identity map")
          names = set(os.listdir(base+"/fd"))
          if not {"0","1","2"}.issubset(names) or any(not name.isdigit() or str(int(name)) != name for name in names): raise RuntimeError("parent descriptor names")
          overflow = tuple(int(open("/proc/sys/kernel/overflow"+kind, encoding="ascii").read()) for kind in ("uid","gid"))
          identity = lambda row: (row.st_dev,row.st_ino,row.st_uid,row.st_gid,stat.S_IFMT(row.st_mode))
          namespaces = {(row.st_dev,row.st_ino) for name in os.listdir(base+"/ns") for row in (os.stat(base+"/ns/"+name),)}
          for name in names:
              number = int(name)
              if number < 3: continue
              before = os.stat(base+"/fd/"+name)
              values = [row[1] for line in open(base+"/fdinfo/"+name, encoding="ascii") for row in (line.split(),) if len(row)==2 and row[0]=="flags:"]
              if len(values) != 1: raise RuntimeError("parent descriptor fdinfo")
              flags = int(values[0],8)
              after = os.stat(base+"/fd/"+name)
              object_id = (before.st_dev,before.st_ino)
              if before != after or stat.S_ISSOCK(before.st_mode) or object_id in namespaces: raise RuntimeError("unsafe parent descriptor object")
              if number == 3 and sys.argv[5] == "before":
                  required = os.O_PATH|os.O_DIRECTORY|os.O_NOFOLLOW
                  if identity(before) != (*expected[:2],*overflow,stat.S_IFDIR) or flags & required != required or flags & os.O_CLOEXEC: raise RuntimeError("checkout descriptor authentication")
              elif object_id == expected[:2] or not flags & os.O_CLOEXEC:
                  raise RuntimeError("unsafe parent descriptor flags")
          if names != set(os.listdir(base+"/fd")): raise RuntimeError("unstable parent descriptor table")
          if (sys.argv[5] == "before") != ("3" in names): raise RuntimeError("checkout descriptor lifecycle")
          DESCRIPTOR
          /usr/bin/python3 -I -c "$descriptor_observer" "$checkout_dev" "$checkout_ino" "$checkout_uid" "$checkout_gid" before
          IFS= read -r old_tmp_device < <(/usr/bin/stat --printf='%d\n' /tmp)
          IFS= read -r old_tmp_mount_id < <(/usr/bin/findmnt --noheadings --raw --output ID --target /tmp)
          [[ "$old_tmp_device" =~ ^[0-9]+$ && "$old_tmp_mount_id" =~ ^[0-9]+$ ]]
          /usr/bin/mount --make-rprivate /
          /usr/bin/mount -t tmpfs -o size=32m,mode=0700,nosuid,nodev,noexec cogs-native-stage /tmp
          /usr/bin/mkdir -m 0700 /tmp/cogs-native-runtime-root
          /usr/bin/mount -t tmpfs -o size=16m,mode=0700,nosuid,nodev cogs-native-runtime-root /tmp/cogs-native-runtime-root
          root=/tmp/cogs-native-runtime-root
          /usr/bin/mkdir -m 0755 "$root/usr" "$root/src" "$root/dev" "$root/proc"
          /usr/bin/mkdir -m 1777 "$root/tmp"
          /usr/bin/python3 -I - > /tmp/cogs-native-source-identities <<'SOURCES'
          import json, os, stat
          for name in ("uid_map", "gid_map"):
              raw = open("/proc/self/" + name, encoding="ascii").read()
              if raw.count("\n") != 1 or raw.split() != ["0", "0", "1"]: raise RuntimeError("non-root-only identity map")
          tools = ("/usr/bin/python3", "/usr/bin/zstd", "/usr/bin/gzip", "/dev/null", "/dev/urandom")
          if any((value.st_uid,value.st_gid) != (0,0) for path in tools for value in (os.stat(path),)): raise RuntimeError("host tool ownership")
          paths = ["/usr", "/dev/null", "/dev/urandom", *(path for path in ("/lib", "/lib64") if os.path.exists(path))]
          print(json.dumps({os.path.realpath(path): [value.st_dev,value.st_ino,value.st_rdev,stat.S_IFMT(value.st_mode),value.st_uid,value.st_gid] for path in paths for value in (os.stat(path),)}, sort_keys=True))
          SOURCES
          /usr/bin/mount --bind /usr "$root/usr"
          /usr/bin/mount -o remount,bind,ro,nosuid,nodev "$root/usr"
          for library in /lib /lib64; do
            if test -e "$library"; then
              /usr/bin/mkdir -m 0755 "$root$library"
              /usr/bin/mount --bind "$library" "$root$library"
              /usr/bin/mount -o remount,bind,ro,nosuid,nodev "$root$library"
            fi
          done
          IFS= read -r -d '' verify_checkout_bind <<'BINDVERIFY' || test "$?" = 1
          import os, posixpath, re, stat, sys
          dev, ino, host_uid, host_gid = map(int, sys.argv[1:5])
          target, access = sys.argv[5], sys.argv[6]
          escapes = {r"\040":" ",r"\011":"\t",r"\012":"\n",r"\134":"\\"}
          def decode(value):
              if re.search(r"\\(?!040|011|012|134)", value): raise RuntimeError("mountinfo escape")
              for encoded, decoded in escapes.items(): value = value.replace(encoded, decoded)
              return value
          def options(value):
              rows = value.split(",")
              if not rows or any(not row or " " in row for row in rows) or len(rows) != len(set(rows)): raise RuntimeError("mountinfo options")
              return frozenset(rows)
          records = []
          for raw in open("/proc/self/mountinfo", encoding="ascii"):
              halves = raw.rstrip("\n").split(" - ")
              if len(halves) != 2: raise RuntimeError("mountinfo separator")
              left, right = halves[0].split(), halves[1].split()
              if len(left) < 6 or len(right) != 3 or not left[0].isdigit() or not left[1].isdigit() or not re.fullmatch(r"[0-9]+:[0-9]+", left[2]): raise RuntimeError("mountinfo record")
              optional = tuple(decode(item) for item in left[6:])
              if any(not re.fullmatch(r"(?:shared|master|propagate_from):[0-9]+|unbindable", item) for item in optional): raise RuntimeError("mountinfo optional")
              records.append({"id":int(left[0]),"parent":int(left[1]),"dev":left[2],"root":decode(left[3]),"target":decode(left[4]),"vfs":options(left[5]),"optional":optional,"type":decode(right[0]),"source":decode(right[1]),"super":options(right[2])})
          def one(predicate):
              found = [row for row in records if predicate(row)]
              if len(found) != 1: raise RuntimeError("checkout mount count")
              return found[0]
          rows = (line.split() for line in open("/proc/self/fdinfo/3", encoding="ascii"))
          info = {row[0][:-1]:row[1] for row in rows if len(row)==2 and row[0] in ("flags:","mnt_id:")}
          if set(info) != {"flags","mnt_id"} or not info["mnt_id"].isdigit(): raise RuntimeError("checkout fdinfo")
          source = one(lambda row: row["id"] == int(info["mnt_id"]))
          bound = one(lambda row: row["target"] == target)
          parent = one(lambda row: row["target"] == posixpath.dirname(target))
          descriptor = os.fstat(3)
          target_stat = os.stat(target, follow_symlinks=False)
          overflow = tuple(int(open("/proc/sys/kernel/overflow"+kind, encoding="ascii").read()) for kind in ("uid","gid"))
          identity = lambda row: (row.st_dev,row.st_ino,row.st_uid,row.st_gid,stat.S_IFMT(row.st_mode))
          wanted = (dev,ino,*overflow,stat.S_IFDIR)
          required = source["vfs"] if access == "rw" else (source["vfs"]-{"rw","ro"})|{"ro","nosuid","nodev","noexec"}
          device = f"{os.major(descriptor.st_dev)}:{os.minor(descriptor.st_dev)}"
          if host_uid == 0 or host_gid == 0 or identity(descriptor) != wanted or identity(target_stat) != wanted:
              raise RuntimeError("checkout target identity")
          source_mount = (source["type"],source["source"],source["super"],required)
          bound_mount = (bound["type"],bound["source"],bound["super"],bound["vfs"])
          if (source["dev"] != device or source["optional"] or bound["parent"] != parent["id"]
                  or bound["dev"] != device or bound["optional"] or bound_mount != source_mount
                  or not bound["root"].startswith("/") or posixpath.normpath(bound["root"]) != bound["root"]):
              raise RuntimeError("checkout mount identity")
          BINDVERIFY
          /usr/bin/mount --no-canonicalize --bind /proc/self/fd/3 "$root/src"
          /usr/bin/python3 -I -c "$verify_checkout_bind" "$checkout_dev" "$checkout_ino" "$checkout_uid" "$checkout_gid" "$root/src" rw
          /usr/bin/mount -o remount,bind,ro,nosuid,nodev,noexec "$root/src"
          /usr/bin/python3 -I -c "$verify_checkout_bind" "$checkout_dev" "$checkout_ino" "$checkout_uid" "$checkout_gid" "$root/src" ro
          /usr/bin/mount -t tmpfs -o size=16m,mode=1777,nosuid,nodev,noexec cogs-native-runtime-tmp "$root/tmp"
          /usr/bin/mount -t proc -o ro,nosuid,nodev,noexec proc "$root/proc"
          /usr/bin/touch "$root/dev/null" "$root/dev/urandom"
          for device in null urandom; do
            /usr/bin/mount --bind "/dev/$device" "$root/dev/$device"
