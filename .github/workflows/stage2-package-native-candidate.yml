name: Stage 2 native package candidate

on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact approved same-repository head; each dispatch is a distinct observation
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    # The 87-minute sum of step bounds leaves a three-minute job-lifecycle reserve.
    timeout-minutes: 90
    concurrency:
      group: stage2-native-package-${{ inputs.reviewed_head }}
      cancel-in-progress: false
    env:
      EXACT_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      CANDIDATE_STAGING: /var/tmp/cogs-stage2-native-package-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_ARTIFACT_NAME: stage2-native-package-candidate-${{ inputs.reviewed_head }}-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_ARTIFACT_NAME: stage2-native-package-candidate-receipt-${{ inputs.reviewed_head }}-${{ github.run_id }}-${{ github.run_attempt }}
      UPLOAD_READBACK_STAGING: /var/tmp/cogs-stage2-native-package-upload-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_READBACK_STAGING: /var/tmp/cogs-stage2-native-package-receipt-upload-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the dispatched repository head only
        timeout-minutes: 2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact reviewed head and first execution of this dispatch
        timeout-minutes: 1
        env:
          CONFIGURED_REVIEWED_HEAD: ${{ vars.STAGE2_PACKAGE_REVIEWED_HEAD }}
          DISPATCH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXACT_REVIEWED_HEAD" = "$CONFIGURED_REVIEWED_HEAD"
          test "$EXACT_REVIEWED_HEAD" = "$DISPATCH_HEAD"
          test "$EXACT_REVIEWED_HEAD" = "$(/usr/bin/git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test -z "$(/usr/bin/git status --porcelain)"

      - name: Run the required bounded privileged double-fork integration
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 300s \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            COGS_REQUIRE_DOUBLEFORK_NATIVE_TEST=1 \
            COGS_DOUBLEFORK_NATIVE_TEST=1 \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/test/stage2-package-native-doublefork.py"

      - name: Materialize and bind the exact fixed source manifest
        id: fixed_source
        timeout-minutes: 6
        run: |
          set -euo pipefail
          result=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 300s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I \
            "$GITHUB_WORKSPACE/scripts/prepare-stage2-fixed-source.py")
          manifest_sha256=$(/usr/bin/python3 -I -c 'import json,re,sys
          value=json.loads(sys.stdin.buffer.read())
          if (set(value)!={"version","revision","manifest_sha256","entries","authority"}
                  or value["revision"]!=sys.argv[1]
                  or value["authority"]!="qualification-only-fixed-source"
                  or re.fullmatch(r"[0-9a-f]{64}",value["manifest_sha256"]) is None
                  or type(value["entries"]) is not int or value["entries"] < 1):
              raise SystemExit(2)
          print(value["manifest_sha256"])' "$EXACT_REVIEWED_HEAD" <<<"$result")
          printf 'revision=%s\nmanifest_sha256=%s\n' \
            "$EXACT_REVIEWED_HEAD" "$manifest_sha256" >>"$GITHUB_OUTPUT"

      - name: Execute the single native package candidate attempt in this workflow run
        id: candidate_attempt
        continue-on-error: true
        timeout-minutes: 51
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_STAGING"
          test ! -e "$UPLOAD_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"
          /bin/mkdir -m 700 -- "$CANDIDATE_STAGING"
          umask 077
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 3000s \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            COGS_PACKAGE_REVIEWED_HEAD="$EXACT_REVIEWED_HEAD" \
            COGS_STAGE2_ARTIFACT_ACQUISITION_APPROVED=download-16-fixed-public-stage2-artifacts \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/scripts/run-stage2-package-native-candidate.py \
            >"$CANDIDATE_STAGING/candidate.partial"

      - name: Remove native candidate source and runtime residue after proven settlement
        id: cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 11
        env:
          CANDIDATE_ATTEMPT_OUTCOME: ${{ steps.candidate_attempt.outcome }}
        run: |
          set -euo pipefail
          # A failed, skipped, cancelled, or timed-out producer has uncertain settlement.
          # Fail closed before unmounting or deleting any retained/runtime root name.
          test "$CANDIDATE_ATTEMPT_OUTCOME" = success

          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
            env -i PATH=/usr/bin:/bin CANDIDATE_STAGING="$CANDIDATE_STAGING" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-settlement.py" scan before-unmount
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 130s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-native-settlement.py" unmount
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
            env -i PATH=/usr/bin:/bin CANDIDATE_STAGING="$CANDIDATE_STAGING" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-settlement.py" scan after-unmount
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 300s \
            /bin/rm -rf --one-file-system -- \
            /var/lib/cogs /run/cogs-stage2-native-preflight-source-v1 \
            /run/cogs-stage2-native-private-v1
          test ! -e /var/lib/cogs
          test ! -e /run/cogs-stage2-native-preflight-source-v1
          test ! -e /run/cogs-stage2-native-private-v1
          test ! -e /tmp/cogs-stage2-workload-candidate-v2
          test ! -e /tmp/cogs-stage2-workload-post-pin-v1
          ! /usr/bin/grep -Eq '/var/lib/cogs|/run/cogs-stage2-native-(preflight-source|private)-v1' /proc/self/mountinfo

      - name: Validate and atomically publish the single non-authoritative output from this workflow run
        id: validate
        if: always() && steps.candidate_attempt.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.fixed_source.outputs.revision }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.fixed_source.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test ! -e "$UPLOAD_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"
          identity=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i PATH=/usr/bin:/bin GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" CANDIDATE_STAGING="$CANDIDATE_STAGING" \
            TRUSTED_RUNNER_UID="$(/usr/bin/id -u)" \
            EXPECTED_SOURCE_REVISION="$EXPECTED_SOURCE_REVISION" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-publication.py" publish)
          printf '%s\n' "$identity" >>"$GITHUB_OUTPUT"

      - name: Upload this run's candidate JSON for manual final-pin review only
        id: upload
        if: always() && steps.validate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_STAGING }}/candidate.json
          if-no-files-found: error
          retention-days: 7

      - name: Download the exact uploaded candidate artifact into this run's readback staging
        id: download_upload
        if: always() && steps.upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ env.UPLOAD_READBACK_STAGING }}
          digest-mismatch: error

      - name: Validate the sole uploaded candidate member against frozen source-bound bytes
        id: validate_upload_readback
        if: always() && steps.download_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.fixed_source.outputs.revision }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.fixed_source.outputs.manifest_sha256 }}
          CANDIDATE_SHA256: ${{ steps.validate.outputs.candidate_sha256 }}
          CANDIDATE_BYTES: ${{ steps.validate.outputs.candidate_bytes }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-upload-receipt.py" readback

      - name: Check post-upload readback identity and write a non-authoritative binding receipt
        id: bind_upload
        if: always() && steps.validate_upload_readback.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.fixed_source.outputs.revision }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.fixed_source.outputs.manifest_sha256 }}
          CANDIDATE_SHA256: ${{ steps.validate.outputs.candidate_sha256 }}
          CANDIDATE_BYTES: ${{ steps.validate.outputs.candidate_bytes }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          UPLOAD_READBACK_OUTCOME: ${{ steps.validate_upload_readback.outcome }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i PATH=/usr/bin:/bin EXACT_REVIEWED_HEAD="$EXACT_REVIEWED_HEAD" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            CANDIDATE_STAGING="$CANDIDATE_STAGING" UPLOAD_READBACK_STAGING="$UPLOAD_READBACK_STAGING" \
            CANDIDATE_ARTIFACT_NAME="$CANDIDATE_ARTIFACT_NAME" RECEIPT_ARTIFACT_NAME="$RECEIPT_ARTIFACT_NAME" \
            EXPECTED_SOURCE_REVISION="$EXPECTED_SOURCE_REVISION" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" \
            CANDIDATE_SHA256="$CANDIDATE_SHA256" CANDIDATE_BYTES="$CANDIDATE_BYTES" \
            CANDIDATE_ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID" \
            CANDIDATE_ARTIFACT_DIGEST="$CANDIDATE_ARTIFACT_DIGEST" \
            UPLOAD_READBACK_OUTCOME="$UPLOAD_READBACK_OUTCOME" TRUSTED_RUNNER_UID="$(/usr/bin/id -u)" \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-upload-receipt.py" create

      - name: Upload the separate non-authoritative receipt for this run
        id: receipt_upload
        if: always() && steps.bind_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RECEIPT_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_STAGING }}/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Download the exact uploaded receipt artifact into run-unique readback staging
        id: receipt_download
        if: always() && steps.receipt_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.receipt_upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ env.RECEIPT_READBACK_STAGING }}
          digest-mismatch: error

      - name: Validate the sole receipt readback against candidate source and artifact identity
        id: validate_receipt_readback
        if: always() && steps.receipt_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.fixed_source.outputs.revision }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.fixed_source.outputs.manifest_sha256 }}
          CANDIDATE_SHA256: ${{ steps.validate.outputs.candidate_sha256 }}
          CANDIDATE_BYTES: ${{ steps.validate.outputs.candidate_bytes }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
          RECEIPT_UPLOAD_OUTCOME: ${{ steps.receipt_upload.outcome }}
        run: |
          set -euo pipefail
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/stage2-native-upload-receipt.py" receipt-readback

      - name: Remove this run's local staging bytes
        id: output_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$UPLOAD_READBACK_STAGING" = "/var/tmp/cogs-stage2-native-package-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$RECEIPT_READBACK_STAGING" = "/var/tmp/cogs-stage2-native-package-receipt-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /bin/rm -rf -- "$CANDIDATE_STAGING" "$UPLOAD_READBACK_STAGING" "$RECEIPT_READBACK_STAGING"
          test ! -e "$CANDIDATE_STAGING"
          test ! -e "$UPLOAD_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"

      - name: Enforce this run's attempt, cleanup, validation, uploads, and zero residue
        if: always()
        timeout-minutes: 1
        env:
          ATTEMPT: ${{ steps.candidate_attempt.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DOWNLOAD_UPLOAD: ${{ steps.download_upload.outcome }}
          VALIDATE_UPLOAD_READBACK: ${{ steps.validate_upload_readback.outcome }}
          BIND_UPLOAD: ${{ steps.bind_upload.outcome }}
          RECEIPT_UPLOAD: ${{ steps.receipt_upload.outcome }}
          RECEIPT_DOWNLOAD: ${{ steps.receipt_download.outcome }}
          VALIDATE_RECEIPT_READBACK: ${{ steps.validate_receipt_readback.outcome }}
          OUTPUT_CLEANUP: ${{ steps.output_cleanup.outcome }}
        run: |
          set -euo pipefail
          test "$ATTEMPT" = success
          test "$CLEANUP" = success
          test "$VALIDATE" = success
          test "$UPLOAD" = success
          test "$DOWNLOAD_UPLOAD" = success
          test "$VALIDATE_UPLOAD_READBACK" = success
          test "$BIND_UPLOAD" = success
          test "$RECEIPT_UPLOAD" = success
          test "$RECEIPT_DOWNLOAD" = success
          test "$VALIDATE_RECEIPT_READBACK" = success
          test "$OUTPUT_CLEANUP" = success
          test ! -e /var/lib/cogs
          test ! -e /run/cogs-stage2-native-preflight-source-v1
          test ! -e /run/cogs-stage2-native-private-v1
          test ! -e "$CANDIDATE_STAGING"
          test ! -e "$UPLOAD_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"
