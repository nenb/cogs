name: Stage 2 native package candidate

on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact approved same-repository head; each dispatch is a distinct observation
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: stage2-native-package-${{ inputs.reviewed_head }}
      cancel-in-progress: false
    env:
      EXACT_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      CANDIDATE_STAGING: /var/tmp/cogs-stage2-native-package-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_ARTIFACT_NAME: stage2-native-package-candidate-${{ inputs.reviewed_head }}-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_ARTIFACT_NAME: stage2-native-package-candidate-receipt-${{ inputs.reviewed_head }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the dispatched repository head only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact reviewed head and first execution of this dispatch
        env:
          CONFIGURED_REVIEWED_HEAD: ${{ vars.STAGE2_PACKAGE_REVIEWED_HEAD }}
          DISPATCH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXACT_REVIEWED_HEAD" = "$CONFIGURED_REVIEWED_HEAD"
          test "$EXACT_REVIEWED_HEAD" = "$DISPATCH_HEAD"
          test "$EXACT_REVIEWED_HEAD" = "$(/usr/bin/git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test -z "$(/usr/bin/git status --porcelain)"

      - name: Run the required bounded privileged double-fork integration
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 300s \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            COGS_REQUIRE_DOUBLEFORK_NATIVE_TEST=1 \
            COGS_DOUBLEFORK_NATIVE_TEST=1 \
            /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/test/stage2-package-native-doublefork.py"

      - name: Materialize and bind the exact fixed source manifest
        id: fixed_source
        run: |
          set -euo pipefail
          result=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 300s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I \
            "$GITHUB_WORKSPACE/scripts/prepare-stage2-fixed-source.py")
          manifest_sha256=$(/usr/bin/python3 -I -c 'import json,re,sys
          value=json.loads(sys.stdin.buffer.read())
          if (set(value)!={"version","revision","manifest_sha256","entries","authority"}
                  or value["revision"]!=sys.argv[1]
                  or value["authority"]!="qualification-only-fixed-source"
                  or re.fullmatch(r"[0-9a-f]{64}",value["manifest_sha256"]) is None
                  or type(value["entries"]) is not int or value["entries"] < 1):
              raise SystemExit(2)
          print(value["manifest_sha256"])' "$EXACT_REVIEWED_HEAD" <<<"$result")
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >>"$GITHUB_OUTPUT"

      - name: Execute the single native package candidate attempt in this workflow run
        id: candidate_attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_STAGING"
          /bin/mkdir -m 700 -- "$CANDIDATE_STAGING"
          umask 077
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 3000s \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            COGS_PACKAGE_REVIEWED_HEAD="$EXACT_REVIEWED_HEAD" \
            COGS_STAGE2_ARTIFACT_ACQUISITION_APPROVED=download-16-fixed-public-stage2-artifacts \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/scripts/run-stage2-package-native-candidate.py \
            >"$CANDIDATE_STAGING/candidate.partial"

      - name: Remove native candidate source and runtime residue after proven settlement
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          CANDIDATE_ATTEMPT_OUTCOME: ${{ steps.candidate_attempt.outcome }}
        run: |
          set -euo pipefail
          # A failed, skipped, cancelled, or timed-out producer has uncertain settlement.
          # Fail closed before unmounting or deleting any retained/runtime root name.
          test "$CANDIDATE_ATTEMPT_OUTCOME" = success

          check_settlement() {
            local phase=$1
            sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
              env -i PATH=/usr/bin:/bin SETTLEMENT_PHASE="$phase" \
              /usr/bin/python3 -I -B - <<'PY'
          import errno
          import os
          import re
          import sys

          targets = (
              "/var/lib/cogs",
              "/run/cogs-stage2-native-preflight-source-v1",
              "/run/cogs-stage2-native-private-v1",
          )
          marker = b"run-stage2-package-native-candidate.py"
          phase = os.environ.get("SETTLEMENT_PHASE")
          if phase not in {"before-unmount", "after-unmount"}:
              raise SystemExit(2)

          def vanished(error):
              return error.errno in {errno.ENOENT, errno.ESRCH}

          def read(path):
              try:
                  with open(path, "rb", buffering=0) as source:
                      return source.read()
              except OSError as error:
                  if vanished(error):
                      return None
                  raise

          def link(path):
              try:
                  return os.readlink(path)
              except OSError as error:
                  if vanished(error):
                      return None
                  raise

          def identity(path):
              try:
                  value = os.stat(path)
                  return value.st_dev, value.st_ino
              except OSError as error:
                  if vanished(error):
                      return None
                  raise

          def refers(value):
              if value is None:
                  return False
              value = value.removesuffix(" (deleted)")
              return any(value == target or value.startswith(target + "/") for target in targets)

          def decoded_mount_fields(raw):
              def replace(match):
                  return bytes((int(match.group(1), 8),))
              return re.sub(rb"\\([0-7]{3})", replace, raw).decode("utf-8", "surrogateescape").split()

          own_namespace = identity("/proc/self/ns/mnt")
          if own_namespace is None:
              raise SystemExit(2)
          try:
              pids = sorted(name for name in os.listdir("/proc") if name.isdecimal())
          except OSError:
              raise SystemExit(2)
          for name in pids:
              base = f"/proc/{name}"
              command = read(base + "/cmdline")
              if command is not None and marker in command:
                  raise SystemExit(f"unsettled candidate process: {name}")
              mounts = read(base + "/mountinfo")
              if mounts is None:
                  continue
              has_target_mount = any(refers(field) for field in decoded_mount_fields(mounts))
              if has_target_mount:
                  namespace = identity(base + "/ns/mnt")
                  if namespace is None:
                      continue
                  if phase == "after-unmount" or namespace != own_namespace:
                      raise SystemExit(f"unsettled target mount namespace: {name}")
              for entry in ("root", "cwd", "exe"):
                  if refers(link(base + "/" + entry)):
                      raise SystemExit(f"unsettled process path: {name}/{entry}")
              try:
                  descriptors = os.listdir(base + "/fd")
              except OSError as error:
                  if vanished(error):
                      continue
                  raise
              for descriptor in descriptors:
                  if refers(link(base + "/fd/" + descriptor)):
                      raise SystemExit(f"unsettled process descriptor: {name}/{descriptor}")
          PY
          }

          check_settlement before-unmount
          for path in /run/cogs-stage2-native-preflight-source-v1 /run/cogs-stage2-native-private-v1; do
            if /usr/bin/mountpoint -q "$path"; then
              sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
                /bin/umount -- "$path"
            fi
          done
          check_settlement after-unmount
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 300s \
            /bin/rm -rf --one-file-system -- \
            /var/lib/cogs /run/cogs-stage2-native-preflight-source-v1 \
            /run/cogs-stage2-native-private-v1
          test ! -e /var/lib/cogs
          test ! -e /run/cogs-stage2-native-preflight-source-v1
          test ! -e /run/cogs-stage2-native-private-v1
          test ! -e /tmp/cogs-stage2-workload-candidate-v2
          test ! -e /tmp/cogs-stage2-workload-post-pin-v1
          ! /usr/bin/grep -Eq '/var/lib/cogs|/run/cogs-stage2-native-(preflight-source|private)-v1' /proc/self/mountinfo

      - name: Validate and atomically publish the single non-authoritative output from this workflow run
        id: validate
        if: always() && steps.candidate_attempt.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(/usr/bin/find "$CANDIDATE_STAGING" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = candidate.partial
          identity=$(/usr/bin/python3 -I - "$CANDIDATE_STAGING/candidate.partial" \
            "$CANDIDATE_STAGING/candidate.json" "$GITHUB_WORKSPACE/deploy/aws-feasibility/remote" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import sys

          partial, final, contracts = map(pathlib.Path, sys.argv[1:])
          sys.path.insert(0, str(contracts))
          from completion_runtime_contract import canonical_json, validate_native_candidate_result

          with partial.open("rb") as source:
              before = os.fstat(source.fileno())
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1:
                  raise SystemExit(2)
              raw = source.read(4097)
              if not 0 < len(raw) <= 4096 or source.read(1):
                  raise SystemExit(2)
              observed = os.stat(partial, follow_symlinks=False)
              if (observed.st_dev, observed.st_ino) != (before.st_dev, before.st_ino):
                  raise SystemExit(2)
              value = json.loads(raw)
              validate_native_candidate_result(value)
              launcher = pathlib.Path("scripts/run-stage2-package-native-candidate.py").read_bytes()
              if value["execution_binding"]["launcher_implementation_sha256"] != hashlib.sha256(launcher).hexdigest():
                  raise SystemExit(2)
              if raw != canonical_json(value):
                  raise SystemExit(2)
              identity = value["package_identity"]
              if set(identity) != {"deb_sha256", "deb_bytes", "installed_tree_sha256", "installed_entries", "installed_bytes", "package", "version", "architecture"}:
                  raise SystemExit(2)
              os.fsync(source.fileno())
          os.replace(partial, final)
          directory = os.open(final.parent, os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(directory)
          finally:
              os.close(directory)
          print("candidate_sha256=" + hashlib.sha256(raw).hexdigest())
          print("candidate_bytes=" + str(len(raw)))
          PY
          )
          printf '%s\n' "$identity" >>"$GITHUB_OUTPUT"

      - name: Upload this run's candidate JSON for manual final-pin review only
        id: upload
        if: always() && steps.validate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_STAGING }}/candidate.json
          if-no-files-found: error
          retention-days: 7

      - name: Check post-upload local identity and write a non-authoritative binding receipt
        id: bind_upload
        if: always() && steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_MANIFEST_SHA256: ${{ steps.fixed_source.outputs.manifest_sha256 }}
          CANDIDATE_SHA256: ${{ steps.validate.outputs.candidate_sha256 }}
          CANDIDATE_BYTES: ${{ steps.validate.outputs.candidate_bytes }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat

          staging = pathlib.Path(os.environ["CANDIDATE_STAGING"])
          candidate = staging / "candidate.json"
          raw = candidate.read_bytes()
          observed = candidate.stat(follow_symlinks=False)
          if not stat.S_ISREG(observed.st_mode) or observed.st_nlink != 1:
              raise SystemExit(2)
          candidate_sha256 = hashlib.sha256(raw).hexdigest()
          candidate_bytes = len(raw)
          if candidate_sha256 != os.environ["CANDIDATE_SHA256"] or str(candidate_bytes) != os.environ["CANDIDATE_BYTES"]:
              raise SystemExit(2)
          artifact_id = os.environ["CANDIDATE_ARTIFACT_ID"]
          artifact_digest = os.environ["CANDIDATE_ARTIFACT_DIGEST"]
          source_manifest = os.environ["SOURCE_MANIFEST_SHA256"]
          if re.fullmatch(r"[1-9][0-9]*", artifact_id) is None:
              raise SystemExit(2)
          if re.fullmatch(r"[0-9a-f]{64}", artifact_digest) is None:
              raise SystemExit(2)
          if re.fullmatch(r"[0-9a-f]{64}", source_manifest) is None:
              raise SystemExit(2)
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None or re.fullmatch(r"[1-9][0-9]*", run_attempt) is None:
              raise SystemExit(2)
          receipt = {
              "artifact": {
                  "digest": artifact_digest,
                  "id": int(artifact_id),
                  "name": os.environ["CANDIDATE_ARTIFACT_NAME"],
              },
              "authority": "non-authoritative-upload-binding-only",
              "candidate": {"bytes": candidate_bytes, "sha256": candidate_sha256},
              "outcomes": {
                  "candidate_attempt": "success",
                  "candidate_upload": "success",
                  "candidate_validation": "success",
                  "post_upload_local_identity": "success",
                  "runtime_cleanup": "success",
              },
              "promotion_authorized": False,
              "repeat_dispatch_policy": "each-dispatch-is-a-distinct-observation-and-must-not-be-merged",
              "reviewed_head": os.environ["EXACT_REVIEWED_HEAD"],
              "run": {"attempt": int(run_attempt), "id": int(run_id)},
              "source": {
                  "manifest_sha256": source_manifest,
                  "revision": os.environ["EXACT_REVIEWED_HEAD"],
              },
              "version": "cogs.stage2-native-package-upload-receipt/v1",
          }
          encoded = json.dumps(receipt, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode() + b"\n"
          partial = staging / "receipt.partial"
          final = staging / "receipt.json"
          descriptor = os.open(partial, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try:
              view = memoryview(encoded)
              while view:
                  written = os.write(descriptor, view)
                  if written <= 0:
                      raise SystemExit(2)
                  view = view[written:]
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          os.replace(partial, final)
          directory = os.open(staging, os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(directory)
          finally:
              os.close(directory)
          PY

      - name: Upload the separate non-authoritative receipt for this run
        id: receipt_upload
        if: always() && steps.bind_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RECEIPT_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_STAGING }}/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove this run's local staging bytes
        id: output_cleanup
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          /bin/rm -rf -- "$CANDIDATE_STAGING"
          test ! -e "$CANDIDATE_STAGING"

      - name: Enforce this run's attempt, cleanup, validation, uploads, and zero residue
        if: always()
        env:
          ATTEMPT: ${{ steps.candidate_attempt.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          BIND_UPLOAD: ${{ steps.bind_upload.outcome }}
          RECEIPT_UPLOAD: ${{ steps.receipt_upload.outcome }}
          OUTPUT_CLEANUP: ${{ steps.output_cleanup.outcome }}
        run: |
          set -euo pipefail
          test "$ATTEMPT" = success
          test "$CLEANUP" = success
          test "$VALIDATE" = success
          test "$UPLOAD" = success
          test "$BIND_UPLOAD" = success
          test "$RECEIPT_UPLOAD" = success
          test "$OUTPUT_CLEANUP" = success
          test ! -e /var/lib/cogs
          test ! -e /run/cogs-stage2-native-preflight-source-v1
          test ! -e /run/cogs-stage2-native-private-v1
          test ! -e "$CANDIDATE_STAGING"
