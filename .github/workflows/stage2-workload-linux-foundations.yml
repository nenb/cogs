name: Stage 2 workload Linux foundations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stage2-workload-foundations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-shards:
    name: Root lifecycle (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        shard:
          - baseline
          - native-wrapper
          - network-runtime
          - input-intent
          - input-cgroup-create
          - input-fork
          - input-preexec
          - input-release
          - input-drain
          - input-output
          - input-effect
          - input-fsync
          - input-settlement
          - input-quarantine
          - input-removal
          - ssh-intent
          - ssh-cgroup-create
          - ssh-fork
          - ssh-preexec
          - ssh-release
          - ssh-drain
          - ssh-output
    env:
      COGS_STAGE2_KATA_NATIVE_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run Linux lifecycle foundations without provider access
        run: |
          set -euo pipefail
          fixture=/tmp/cogs-kata-process-s1-v1
          runtime_fixture=/tmp/cogs-stage2-containerd-2.2.1
          runtime_archive=/tmp/cogs-stage2-containerd-2.2.1.tar.gz
          cleanup_runtime_fixture() {
            if sudo -n test -e "$runtime_fixture" || sudo -n test -L "$runtime_fixture"; then
              sudo -n test ! -L "$runtime_fixture" && sudo -n test -d "$runtime_fixture" || return 1
              test "$(sudo -n find "$runtime_fixture" -mindepth 1 -maxdepth 2 -printf '%P\n' | sort)" = $'bin\nbin/containerd\nbin/ctr' || return 1
              sudo -n test "$(sudo -n stat -c '%u:%g:%a' -- "$runtime_fixture" "$runtime_fixture/bin")" = $'0:0:700\n0:0:700' || return 1
              for name in containerd ctr; do
                sudo -n test "$(sudo -n stat -c '%u:%g:%a' -- "$runtime_fixture/bin/$name")" = 0:0:500 || return 1
                sudo -n rm -- "$runtime_fixture/bin/$name" || return 1
              done
              sudo -n rmdir -- "$runtime_fixture/bin" "$runtime_fixture" || return 1
            fi
            if sudo -n test -e "$runtime_archive" || sudo -n test -L "$runtime_archive"; then
              sudo -n test ! -L "$runtime_archive" && sudo -n test -f "$runtime_archive" || return 1
              test "$(sudo -n sha256sum "$runtime_archive" | cut -d' ' -f1)" = af3e82bac6abed58d45956c653244aa2be583359a9753614278ef652012f2883 || return 1
              sudo -n rm -- "$runtime_archive" || return 1
            fi
          }
          cleanup_native_fixture() {
            if sudo -n test -e "$fixture" || sudo -n test -L "$fixture"; then
              sudo -n test ! -L "$fixture" || return 1
              sudo -n test -d "$fixture" || return 1
              sudo -n test "$(sudo -n stat -c '%u:%g:%a' -- "$fixture")" = 0:0:700 || return 1
              inventory=$(sudo -n find "$fixture" -mindepth 1 -maxdepth 1 -printf '%f\n') || return 1
              if [[ -n "$inventory" ]]; then
                while IFS= read -r name; do
                  case "$name" in helper|helper.c) ;; *) return 1 ;; esac
                done <<< "$inventory"
              fi
              for name in helper helper.c; do
                if sudo -n test -e "$fixture/$name" || sudo -n test -L "$fixture/$name"; then
                  sudo -n test ! -L "$fixture/$name" || return 1
                  sudo -n test -f "$fixture/$name" || return 1
                  sudo -n test "$(sudo -n stat -c '%u:%g' -- "$fixture/$name")" = 0:0 || return 1
                  sudo -n rm -- "$fixture/$name" || return 1
                fi
              done
              sudo -n rmdir -- "$fixture" || return 1
            fi
          }
          cleanup_ssh_fixture() {
            for pair in \
              'cogs-stage2-attested-static-v1.elf -' \
              'cogs-stage2-attested-ssh-contract-v1.json attested-ssh-contract-v1.json' \
              'cogs-stage2-attested-ssh-keygen-contract-v1.json attested-ssh-keygen-contract-v1.json'; do
              set -- $pair
              target="/tmp/$1"
              source="test/fixtures/stage2-completion/$2"
              if sudo -n test -e "$target" || sudo -n test -L "$target"; then
                sudo -n test ! -L "$target" || return 1
                sudo -n test -f "$target" || return 1
                sudo -n test "$(sudo -n stat -c '%u:%g' -- "$target")" = 0:0 || return 1
                if [[ "$2" = - ]]; then
                  sudo -n test "$(sudo -n stat -c '%s' -- "$target")" = 13160 || return 1
                  sudo -n test "$(sudo -n sha256sum "$target" | cut -d' ' -f1)" = 6a4e31c3fe1bf1d593660b4a95fc9b21229f70abfbec00218294b47c9e3ae383 || return 1
                else
                  sudo -n cmp --silent "$target" "$source" || return 1
                fi
                sudo -n rm -- "$target" || return 1
              fi
            done
            sudo -n test ! -e /tmp/cogs-stage2-attested-static-v1.building || return 1
            sudo -n test ! -L /tmp/cogs-stage2-attested-static-v1.building || return 1
          }
          cleanup_netns_parent() {
            if sudo -n test -e /run/netns || sudo -n test -L /run/netns; then
              sudo -n test ! -L /run/netns && sudo -n test -d /run/netns || return 1
              sudo -n test "$(sudo -n stat -c '%u:%g:%a' /run/netns)" = 0:0:755 || return 1
              test -z "$(sudo -n find /run/netns -mindepth 1 -maxdepth 1 -print -quit)" || return 1
              sudo -n rmdir /run/netns || return 1
            fi
          }
          cleanup_on_exit() {
            primary=$?
            trap - EXIT
            set +e
            cleanup_native_fixture
            cleanup_status=$?
            cleanup_ssh_fixture
            ssh_cleanup_status=$?
            cleanup_runtime_fixture
            runtime_cleanup_status=$?
            cleanup_netns_parent
            netns_cleanup_status=$?
            if (( cleanup_status == 0 && ssh_cleanup_status != 0 )); then cleanup_status=$ssh_cleanup_status; fi
            if (( cleanup_status == 0 && runtime_cleanup_status != 0 )); then cleanup_status=$runtime_cleanup_status; fi
            if (( cleanup_status == 0 && netns_cleanup_status != 0 )); then cleanup_status=$netns_cleanup_status; fi
            if (( primary != 0 )); then exit "$primary"; fi
            exit "$cleanup_status"
          }
          trap cleanup_on_exit EXIT
          sudo -n test ! -e "$fixture"
          sudo -n test ! -L "$fixture"
          sudo -n test ! -e /tmp/cogs-stage2-attested-static-v1.building
          sudo -n test ! -L /tmp/cogs-stage2-attested-static-v1.building
          fixture_cc=/usr/bin/clang-18 fixture_ld=/usr/bin/ld
          sudo -n test -x "$fixture_cc" && sudo -n test -x "$fixture_ld"
          case "$COGS_STAGE2_KATA_NATIVE_TEST_SHARD" in
            baseline)
              sudo -n env -i \
                HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                PYTHONDONTWRITEBYTECODE=1 COGS_STAGE2_SYNTHETIC_CLANG="$fixture_cc" COGS_STAGE2_SYNTHETIC_LLD="$fixture_ld" \
                COGS_STAGE2_KATA_NATIVE_TEST_SHARD=baseline \
                COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
                COGS_REQUIRE_STAGE2_KATA_RUNTIME_FOUNDATIONS=1 \
                /usr/bin/python3 -I -B test/aws-stage2-completion-kata-operation.py
              sudo -n env -i \
                HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                PYTHONDONTWRITEBYTECODE=1 COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
                /usr/bin/python3 -I -B test/aws-stage2-completion-kata-process.py
              ;;
            native-wrapper)
              sudo -n env -i \
                HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                PYTHONDONTWRITEBYTECODE=1 COGS_STAGE2_SYNTHETIC_CLANG="$fixture_cc" COGS_STAGE2_SYNTHETIC_LLD="$fixture_ld" \
                COGS_STAGE2_KATA_NATIVE_TEST_SHARD=baseline \
                COGS_REQUIRE_STAGE2_KATA_NATIVE_SSH_INPUT=1 \
                /usr/bin/python3 -I -B test/aws-stage2-completion-kata-ssh-native.py
              exit 0
              ;;
            network-runtime) ;;
            input-*|ssh-*)
              sudo -n env -i \
                HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
                PYTHONDONTWRITEBYTECODE=1 COGS_STAGE2_SYNTHETIC_CLANG="$fixture_cc" COGS_STAGE2_SYNTHETIC_LLD="$fixture_ld" \
                COGS_STAGE2_KATA_NATIVE_TEST_SHARD="$COGS_STAGE2_KATA_NATIVE_TEST_SHARD" \
                COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
                /usr/bin/python3 -I -B test/aws-stage2-completion-kata-operation.py
              exit 0
              ;;
            *) exit 64 ;;
          esac
          if [[ "$COGS_STAGE2_KATA_NATIVE_TEST_SHARD" = baseline ]]; then
            sudo -n env -i \
              HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              PYTHONDONTWRITEBYTECODE=1 COGS_REQUIRE_STAGE2_WORKLOAD_LINUX_FOUNDATIONS=1 \
              /usr/bin/python3 -I -B test/aws-stage2-completion-workloads.py
            sudo -n env -i \
              HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              PYTHONDONTWRITEBYTECODE=1 COGS_REQUIRE_STAGE2_WORKLOAD_LINUX_FOUNDATIONS=1 \
              /usr/bin/python3 -I -B -O test/aws-stage2-completion-workloads.py
            test ! -e /tmp/cogs-stage2-workload-candidate-v1
            test ! -e /tmp/cogs-stage2-workload-post-pin-v1
            test -z "$(find /tmp -maxdepth 1 -name '.cogs-stage2-workload-*.recovery-*' -print -quit)"
            exit 0
          fi
          cleanup_ssh_fixture
          sudo -n test ! -e /sys/fs/cgroup/cogs-stage2-completion-v1
          test -z "$(/usr/bin/pgrep -f '[/]tmp/cogs-kata-process-s1-v1/helper' || true)"
          test -z "$(/usr/bin/pgrep -f '[/]tmp/tmp[^/]*/daemon' || true)"
          cleanup_native_fixture
          sudo -n test ! -e "$fixture"
          sudo -n test ! -L "$fixture"
          cleanup_runtime_fixture
          sudo -n /usr/bin/curl --fail --location --silent --show-error \
            https://github.com/containerd/containerd/releases/download/v2.2.1/containerd-static-2.2.1-linux-amd64.tar.gz \
            --output "$runtime_archive"
          test "$(sudo -n sha256sum "$runtime_archive" | cut -d' ' -f1)" = af3e82bac6abed58d45956c653244aa2be583359a9753614278ef652012f2883
          sudo -n mkdir -m 0700 "$runtime_fixture" "$runtime_fixture/bin"
          sudo -n tar -xzf "$runtime_archive" -C "$runtime_fixture" bin/containerd bin/ctr
          sudo -n chown 0:0 "$runtime_fixture/bin/containerd" "$runtime_fixture/bin/ctr"
          sudo -n chmod 0500 "$runtime_fixture/bin/containerd" "$runtime_fixture/bin/ctr"
          sudo -n test ! -e /run/netns
          sudo -n test ! -L /run/netns
          sudo -n mkdir -m 0755 /run/netns
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_HOST_NETWORK_STABILITY=1 \
            /usr/bin/python3 -I -B scripts/stabilize-stage2-host-network.py
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -I -B \
            deploy/aws-feasibility/remote/completion_kata_nft_owner.py
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
            COGS_REQUIRE_STAGE2_NETWORK_FOUNDATION=1 \
            COGS_STAGE2_KATA_NATIVE_TEST_SHARD="$COGS_STAGE2_KATA_NATIVE_TEST_SHARD" \
            COGS_STAGE2_CONTAINERD_FIXTURE="$runtime_fixture" \
            /usr/bin/python3 -I -B test/aws-stage2-completion-kata-operation.py
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_NETWORK_FOUNDATION=1 \
            /usr/bin/python3 -I -B test/aws-stage2-completion-kata-network-linux.py
          sudo -n test ! -e /sys/fs/cgroup/cogs-stage2-completion-v1
          test -z "$(/usr/bin/pgrep -f '[/]tmp/cogs-kata-process-s1-v1/helper' || true)"
          sudo -n test ! -e "$fixture"
          sudo -n test ! -L "$fixture"

  foundations:
    name: Root-owned lifecycle and recovery
    needs: foundation-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every foundation shard
        env:
          SHARD_RESULT: ${{ needs.foundation-shards.result }}
        run: |
          set -euo pipefail
          test "$SHARD_RESULT" = success
