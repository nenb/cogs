name: Stage 2 workload Linux foundations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stage2-workload-foundations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    name: Root-owned lifecycle and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/bin/git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run Linux lifecycle foundations without provider access
        run: |
          set -euo pipefail
          fixture=/tmp/cogs-kata-process-s1-v1
          cleanup_native_fixture() {
            if sudo -n test -e "$fixture"; then
              sudo -n test -d "$fixture"
              sudo -n test "$(sudo -n stat -c '%u:%g:%a' -- "$fixture")" = 0:0:700
              while IFS= read -r name; do
                case "$name" in helper|helper.c) ;; *) return 1 ;; esac
              done < <(sudo -n find "$fixture" -mindepth 1 -maxdepth 1 -printf '%f\n')
              for name in helper helper.c; do
                if sudo -n test -e "$fixture/$name"; then
                  sudo -n test -f "$fixture/$name"
                  sudo -n test "$(sudo -n stat -c '%u:%g' -- "$fixture/$name")" = 0:0
                  sudo -n rm -- "$fixture/$name"
                fi
              done
              sudo -n rmdir -- "$fixture"
            fi
          }
          cleanup_on_exit() {
            primary=$?
            trap - EXIT
            set +e
            cleanup_native_fixture
            cleanup_status=$?
            if (( primary != 0 )); then exit "$primary"; fi
            exit "$cleanup_status"
          }
          trap cleanup_on_exit EXIT
          sudo -n test ! -e "$fixture"
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
            /usr/bin/python3 -I -B test/aws-stage2-completion-kata-operation.py
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_KATA_NATIVE_FOUNDATIONS=1 \
            /usr/bin/python3 -I -B test/aws-stage2-completion-kata-process.py
          sudo -n test ! -e /sys/fs/cgroup/cogs-stage2-completion-v1
          test -z "$(/usr/bin/pgrep -f '[/]tmp/cogs-kata-process-s1-v1/helper' || true)"
          cleanup_native_fixture
          sudo -n test ! -e "$fixture"
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_WORKLOAD_LINUX_FOUNDATIONS=1 \
            /usr/bin/python3 -I -B test/aws-stage2-completion-workloads.py
          sudo -n env -i \
            HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            COGS_REQUIRE_STAGE2_WORKLOAD_LINUX_FOUNDATIONS=1 \
            /usr/bin/python3 -I -B -O test/aws-stage2-completion-workloads.py
          test ! -e /tmp/cogs-stage2-workload-candidate-v1
          test ! -e /tmp/cogs-stage2-workload-post-pin-v1
          test -z "$(find /tmp -maxdepth 1 -name '.cogs-stage2-workload-*.recovery-*' -print -quit)"
          sudo -n test ! -e /sys/fs/cgroup/cogs-stage2-completion-v1
          test -z "$(/usr/bin/pgrep -f '[/]tmp/cogs-kata-process-s1-v1/helper' || true)"
          sudo -n test ! -e "$fixture"
