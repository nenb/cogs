name: Stage 2 R non-authoritative diagnostic preparation
run-name: Stage 2 R diagnostic preparation candidate=${{ github.sha }} H=${{ inputs.implementation_head }} G=${{ inputs.control_head }} Q=${{ inputs.qualification_head }}

on:
  workflow_dispatch:
    inputs:
      authorization_phrase:
        {
          description: Fresh non-authoritative diagnostic planning authorization,
          required: true,
          type: string,
        }
      implementation_head:
        {
          description: Exact qualified implementation fixture H,
          required: true,
          type: string,
        }
      control_head:
        {
          description: Exact qualified control fixture G,
          required: true,
          type: string,
        }
      qualification_head:
        {
          description: Exact qualification fixture Q,
          required: true,
          type: string,
        }
      qualification_run_id:
        {
          description: Exact successful formal qualification run,
          required: true,
          type: string,
        }
      package_artifact_id:
        {
          description: Exact V6 qualification package artifact ID,
          required: true,
          type: string,
        }
      package_artifact_digest:
        {
          description: Exact qualification package archive digest,
          required: true,
          type: string,
        }

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: stage2-r-diagnostic-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      IMPLEMENTATION_HEAD: ${{ inputs.implementation_head }}
      CONTROL_HEAD: ${{ inputs.control_head }}
      QUALIFICATION_HEAD: ${{ inputs.qualification_head }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      COGS_STAGE2_CONTROL_REVISION: ${{ inputs.control_head }}
      PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      PACKAGE_ARTIFACT_DIGEST: ${{ inputs.package_artifact_digest }}
      AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
    steps:
      - name: Admit one protected non-authoritative diagnostic preparation
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          test "$AUTHORIZATION_PHRASE" = start-stage2-r-diagnostic-window
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/fix/issue42-r-convergence
          test "$GITHUB_REF_PROTECTED" = false
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          for value in "$GITHUB_SHA" "$IMPLEMENTATION_HEAD" "$CONTROL_HEAD" "$QUALIFICATION_HEAD"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$GITHUB_SHA" != "$IMPLEMENTATION_HEAD"
          test "$GITHUB_SHA" != "$CONTROL_HEAD"
          test "$GITHUB_SHA" != "$QUALIFICATION_HEAD"
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --paginate --slurp \
            "repos/nenb/cogs/actions/workflows/stage2-r-diagnostic-preparation.yml/runs?event=workflow_dispatch&per_page=100&head_sha=$GITHUB_SHA" \
            >"$RUNNER_TEMP/diagnostic-preparation-runs.json"
          jq -e --arg r "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" \
            '([.[].total_count] | unique) == [1] and
             ([.[].workflow_runs[] | select(.head_sha == $r and
               .path == ".github/workflows/stage2-r-diagnostic-preparation.yml")] |
              map(.id) == [$current])' "$RUNNER_TEMP/diagnostic-preparation-runs.json" >/dev/null
          for workflow in stage2-production-plan.yml stage2-production-approval.yml stage2-production-campaign.yml; do
            test "$(gh api "repos/nenb/cogs/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100&head_sha=$GITHUB_SHA" --jq .total_count)" = 0
          done

      - name: Authenticate exact qualification fixture without promoting it
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$QUALIFICATION_RUN_ID" >"$RUNNER_TEMP/qualification.json"
          jq -e --arg q "$QUALIFICATION_HEAD" \
            --arg title "Stage 2 prebuilt local Kata qualification H=$IMPLEMENTATION_HEAD G=$CONTROL_HEAD Q=$QUALIFICATION_HEAD" \
            '.path == ".github/workflows/stage2-prebuilt-local-kata-qualification.yml" and
             .head_sha == $q and .display_title == $title and .head_branch == "main" and
             .event == "workflow_dispatch" and .run_attempt == 1 and
             .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/qualification.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$PACKAGE_ARTIFACT_ID" >"$RUNNER_TEMP/package-artifact.json"
          jq -e --arg digest "$PACKAGE_ARTIFACT_DIGEST" --argjson run "$QUALIFICATION_RUN_ID" \
            --arg name "stage2-formal-non-aws-package-$IMPLEMENTATION_HEAD-$CONTROL_HEAD-$QUALIFICATION_RUN_ID-1" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/package-artifact.json" >/dev/null

      - name: Check out exact diagnostic candidate without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }

      - name: Download exact qualification fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Validate fixture and prepare exact planning inputs
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-production-planner.py eligibility \
            "$RUNNER_TEMP/qualification/pre-aws-package-v6.json" \
            "$IMPLEMENTATION_HEAD" "$CONTROL_HEAD" "$QUALIFICATION_HEAD"
          package=deploy/aws-feasibility/remote/stage2-completion-local-control-v7
          python3 -I -B - "$package/stage2-local-execution-envelope-v4.json" \
            "$RUNNER_TEMP/descriptor.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="ascii"))["rootfs"]["prebuilt_descriptor"]
          open(sys.argv[2],"w",encoding="ascii").write(json.dumps(
              value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)+"\n")
          PY
          tofu=$(COGS_TOFU_BIN="$RUNNER_TEMP/tofu" scripts/install-opentofu.sh)
          test "$(sha256sum "$tofu" | cut -d' ' -f1)" = \
            e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88

      - name: Acquire read-only planning identity
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.STAGE2_AWS_PRODUCTION_PLANNING_ROLE_ARN }}
          role-session-name: cogs-stage2-r-diagnostic-plan-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: 10800

      - name: Produce seven fresh diagnostic plans with production planner bytes
        env:
          COGS_STAGE2_AWS_PLAN_AUTHORIZATION: authorize-read-only-stage2-production-planning
          COGS_STAGE2_BUDGET_ALERT_EMAIL: ${{ vars.STAGE2_AWS_BUDGET_ALERT_EMAIL }}
          COGS_STAGE2_EXECUTOR_ROLE_NAME: ${{ vars.STAGE2_AWS_PRODUCTION_EXECUTOR_ROLE_NAME }}
          COGS_STAGE2_INVENTORY_OBSERVER_ROLE_NAME: ${{ vars.STAGE2_AWS_INVENTORY_OBSERVER_ROLE_NAME }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-production-planner.py \
            "$RUNNER_TEMP/qualification/pre-aws-package-v6.json" \
            deploy/aws-feasibility/remote/stage2-completion-local-control-v7/stage2-local-static-control-v2.json \
            "$RUNNER_TEMP/descriptor.json" "$RUNNER_TEMP/tofu" "$RUNNER_TEMP/planning"
          # The planner intentionally never stages its local provider bootstrap
          # cache. Remove that one disposable hidden tree before exact readback.
          bootstrap="$RUNNER_TEMP/planning/plans/.provider-tf-data"
          test -d "$bootstrap" && test ! -L "$bootstrap"
          rm -rf --one-file-system -- "$bootstrap"
          test ! -e "$bootstrap" && test ! -L "$bootstrap"
          test -z "$(find "$RUNNER_TEMP/planning" -mindepth 1 -name '.*' -print -quit)"
          python3 -I -B - <<'PY' >"$RUNNER_TEMP/planning/DIAGNOSTIC-NON-AUTHORITATIVE.json"
          import json,os
          value={"version":"cogs.stage2-r-diagnostic-marker/v1",
            "authority":"non-authoritative-diagnostic-only","result":"prepared",
            "candidate_revision":os.environ["GITHUB_SHA"],
            "fixture_implementation_revision":os.environ["IMPLEMENTATION_HEAD"],
            "fixture_control_revision":os.environ["CONTROL_HEAD"],
            "fixture_qualification_revision":os.environ["QUALIFICATION_HEAD"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_run_attempt":1,
            "production_evidence_eligible":False,"issue42_closure_eligible":False}
          print(json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False))
          PY

      - name: Retire planning credentials after every planner outcome
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/planning/.aws-credentials" "$RUNNER_TEMP/planning/.aws-config"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nAWS_PROFILE=\n' >>"$GITHUB_ENV"

      - name: Upload diagnostic planning bytes
        id: planning_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NON-AUTHORITATIVE-stage2-r-diagnostic-planning-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/planning
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Read back diagnostic plans by exact artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.planning_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/planning-readback
          digest-mismatch: error

      - name: Require byte-identical planning readback and issue diagnostic approval
        run: |
          set -euo pipefail
          diff -r --no-dereference "$RUNNER_TEMP/planning" "$RUNNER_TEMP/planning-readback"
          out="$RUNNER_TEMP/approval"; install -d -m 0700 "$out"
          /usr/bin/python3 -I -B scripts/stage2-production-approval.py issue \
            "$RUNNER_TEMP/planning-readback/approval-draft.json" >"$out/approval.json"
          install -m 0600 "$RUNNER_TEMP/planning-readback/pre-aws-package-v6.json" \
            "$out/pre-aws-package-v6.json"
          cp -R "$RUNNER_TEMP/planning-readback/plans" "$out/plans"
          install -m 0555 "$RUNNER_TEMP/planning-readback/tofu" "$out/tofu"
          for name in provider-package.json provider-package.tar provider-package.tar.sha256; do
            install -m 0600 "$RUNNER_TEMP/planning-readback/$name" "$out/$name"
          done
          executor=$(jq -er '.executor_principal_commitment | select(test("^[0-9a-f]{64}$"))' \
            "$out/approval.json")
          workflow_sha=$(sha256sum .github/workflows/stage2-r-diagnostic-preparation.yml | cut -d' ' -f1)
          COGS_STAGE2_APPROVAL_WORKFLOW_SHA256="$workflow_sha" \
          COGS_STAGE2_EXECUTOR_PRINCIPAL_COMMITMENT="$executor" \
            /usr/bin/python3 -I -B scripts/stage2-production-approval.py authenticate \
            "$out/approval.json" >"$out/approval-authentication.json"
          chmod 0600 "$out/approval-authentication.json"

      - name: Keyless sign diagnostic authentication with distinct identity
        run: |
          set -euo pipefail
          identity="https://github.com/nenb/cogs/.github/workflows/stage2-r-diagnostic-preparation.yml@$GITHUB_REF"
          scripts/stage2-cosign-keyless-sign.sh "$RUNNER_TEMP/approval" "$identity"
          sudo -n --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL \
            /usr/bin/python3 -I -B - "$GITHUB_WORKSPACE/scripts/stage2-production-approval.py" <<'PY'
          import os,runpy,sys
          issuer=runpy.run_path(sys.argv[1])
          try:
              issuer["_set_failure_phase"]("oidc-url")
              issuer["_approved_oidc_url"](os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", ""))
              issuer["_set_failure_phase"]("oidc-token")
              issuer["require"](len(os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")) >= 32)
          except BaseException:
              phase=issuer["_approved_oidc_url"].__globals__["_FAILURE_PHASE"]
              os.write(2,f"stage2-production-approval: {phase}.failed\n".encode("ascii"))
              raise SystemExit(2) from None
          PY
          python3 -I -B - <<'PY' >"$RUNNER_TEMP/approval/DIAGNOSTIC-NON-AUTHORITATIVE.json"
          import json,os
          value={"version":"cogs.stage2-r-diagnostic-marker/v1",
            "authority":"non-authoritative-diagnostic-only","result":"approved-for-diagnostic-only",
            "candidate_revision":os.environ["GITHUB_SHA"],
            "fixture_implementation_revision":os.environ["IMPLEMENTATION_HEAD"],
            "fixture_control_revision":os.environ["CONTROL_HEAD"],
            "fixture_qualification_revision":os.environ["QUALIFICATION_HEAD"],
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_run_attempt":1,
            "production_evidence_eligible":False,"issue42_closure_eligible":False}
          print(json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False))
          PY
          chmod 0400 "$RUNNER_TEMP/approval/DIAGNOSTIC-NON-AUTHORITATIVE.json"

      - name: Retire signing OIDC request environment
        if: always()
        run: printf 'ACTIONS_ID_TOKEN_REQUEST_TOKEN=\nACTIONS_ID_TOKEN_REQUEST_URL=\n' >>"$GITHUB_ENV"

      - name: Upload one diagnostic-only approval
        id: approval_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-approval-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/approval
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
