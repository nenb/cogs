name: Stage 2 pre-H diagnostic trusted prebuilt rootfs publisher
run-name: Pre-H diagnostic prebuilt rootfs publication H=${{ inputs.exact_implementation_head }} artifact=${{ inputs.producer_artifact_id }}

on:
  workflow_dispatch:
    inputs:
      exact_implementation_head: { description: Exact reviewed H that produced the candidate, required: true, type: string }
      producer_run_id: { description: Exact attempt-one producer run ID, required: true, type: string }
      producer_artifact_id: { description: Exact numeric candidate artifact ID, required: true, type: string }
      producer_artifact_digest: { description: Exact sha256-prefixed Actions archive digest, required: true, type: string }

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_manifest: ${{ steps.candidate.outputs.source_manifest_sha256 }}
      package_sha: ${{ steps.candidate.outputs.package_manifest_sha256 }}
      provenance_sha: ${{ steps.candidate.outputs.provenance_sha256 }}
      qualification_sha: ${{ steps.candidate.outputs.producer_receipt_sha256 }}
    env:
      EXACT_H: ${{ inputs.exact_implementation_head }}
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
      PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer_artifact_digest }}
    steps:
      - name: Admit protected directional publisher generation before checkout
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_H" "$GITHUB_RUN_ID" "$PRODUCER_RUN_ID" "$PRODUCER_ARTIFACT_ID"; do
            case "$selected" in
              6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXACT_H" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" != "$EXACT_H"

      - name: Authenticate only the diagnostic producer and first-created diagnostic publisher
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$PRODUCER_RUN_ID" >"$RUNNER_TEMP/producer-run.json"
          jq -e --arg h "$EXACT_H" --arg title "Pre-H diagnostic prebuilt rootfs producer H=$EXACT_H" \
            '.path == ".github/workflows/stage2-prebuilt-rootfs-diagnostic-producer.yml" and .head_sha == $h and
             .head_branch == "main" and .event == "workflow_dispatch" and .display_title == $title and
             .run_attempt == 1 and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/producer-run.json" >/dev/null
          gh api --paginate --slurp "repos/nenb/cogs/actions/runs/$PRODUCER_RUN_ID/jobs?per_page=100" \
            >"$RUNNER_TEMP/producer-jobs.json"
          jq -e '[.[].jobs[] | select(.name == "admit" or .name == "build" or .name == "readback") |
                    select(.status == "completed" and .conclusion == "success") | .name] | sort == ["admit","build","readback"]' \
            "$RUNNER_TEMP/producer-jobs.json" >/dev/null
          gh api --paginate --slurp \
            'repos/nenb/cogs/actions/workflows/stage2-prebuilt-rootfs-diagnostic-publisher.yml/runs?event=workflow_dispatch&branch=main&per_page=100' \
            >"$RUNNER_TEMP/publisher-runs.json"
          jq -e --arg h "$GITHUB_SHA" --arg title "Pre-H diagnostic prebuilt rootfs publication H=$EXACT_H artifact=$PRODUCER_ARTIFACT_ID" \
            --argjson current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[] | select(.head_sha == $h and
                             .path == ".github/workflows/stage2-prebuilt-rootfs-diagnostic-publisher.yml")] as $runs |
             ($runs | map(.id)) == [$current] and $runs[0].display_title == $title' \
            "$RUNNER_TEMP/publisher-runs.json" >/dev/null

      - name: Check out only trusted publisher G without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", fetch-depth: 2, persist-credentials: false }

      - name: Require H to be the direct reviewed implementation ancestor
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-revision-retirement.py "$GITHUB_SHA" "$EXACT_H"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXACT_H"

      - name: Authenticate exact diagnostic candidate artifact metadata
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/artifacts/$PRODUCER_ARTIFACT_ID" >"$RUNNER_TEMP/artifact.json"
          jq -e --arg digest "$PRODUCER_ARTIFACT_DIGEST" --argjson run "$PRODUCER_RUN_ID" \
            --arg name "stage2-prebuilt-rootfs-diagnostic-$EXACT_H" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/artifact.json" >/dev/null

      - name: Download only the numeric candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.producer_artifact_id }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: candidate
        name: Validate candidate package without publisher or OIDC credentials
        env: { COGS_PREBUILT_CANDIDATE_ROOT: "${{ runner.temp }}/candidate" }
        run: |
          set -euo pipefail
          result=$(/usr/bin/python3 -I -B scripts/stage2-prebuilt-rootfs-publisher.py validate-candidate)
          RESULT="$result" /usr/bin/python3 -I - <<'PY' >>"$GITHUB_OUTPUT"
          import json,os
          value=json.loads(os.environ['RESULT'])
          for key,item in value.items(): print(f'{key}={item}')
          PY
          test "$(RESULT="$result" python3 -c 'import json,os;print(json.loads(os.environ["RESULT"])["implementation_revision"])')" = "$EXACT_H"

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    env:
      ORAS_IMAGE: ghcr.io/oras-project/oras@sha256:6ce045ce069a89934d6666b8b49f9c4c0145201bd6de6dbe2aee267814c55468
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:be924970ba7438c22e18067dec5637946d6566eac711f5bedd1584e7137008fb
      REPOSITORY: ghcr.io/nenb/cogs/stage2-rootfs
      EXACT_H: ${{ inputs.exact_implementation_head }}
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
      PRODUCER_ARTIFACT_DIGEST: ${{ inputs.producer_artifact_digest }}
    steps:
      - name: Recheck retirement before publication checkout
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_H" "$GITHUB_RUN_ID" "$PRODUCER_RUN_ID" "$PRODUCER_ARTIFACT_ID"; do
            case "$selected" in
              6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
      - name: Check out the same exact publisher G without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", fetch-depth: 2, persist-credentials: false }

      - name: Reauthenticate immutable diagnostic artifact before credential-bearing work
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-revision-retirement.py "$GITHUB_SHA" "$EXACT_H"
          test "$(git rev-parse HEAD^)" = "$EXACT_H"
          gh api "repos/nenb/cogs/actions/artifacts/$PRODUCER_ARTIFACT_ID" >"$RUNNER_TEMP/artifact.json"
          jq -e --arg digest "$PRODUCER_ARTIFACT_DIGEST" --argjson run "$PRODUCER_RUN_ID" \
            --arg name "stage2-prebuilt-rootfs-diagnostic-$EXACT_H" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/artifact.json" >/dev/null

      - name: Download the same numeric candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.producer_artifact_id }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate candidate and exact validation-job commitments
        env:
          COGS_PREBUILT_CANDIDATE_ROOT: ${{ runner.temp }}/candidate
          SOURCE_MANIFEST: ${{ needs.validate.outputs.source_manifest }}
          PACKAGE_SHA: ${{ needs.validate.outputs.package_sha }}
          PROVENANCE_SHA: ${{ needs.validate.outputs.provenance_sha }}
          QUALIFICATION_SHA: ${{ needs.validate.outputs.qualification_sha }}
        run: |
          set -euo pipefail
          result=$(/usr/bin/python3 -I -B scripts/stage2-prebuilt-rootfs-publisher.py validate-candidate)
          RESULT="$result" /usr/bin/python3 -I - <<'PY'
          import json,os
          value=json.loads(os.environ['RESULT'])
          expected={"source_manifest_sha256":os.environ["SOURCE_MANIFEST"],
                    "package_manifest_sha256":os.environ["PACKAGE_SHA"],
                    "provenance_sha256":os.environ["PROVENANCE_SHA"],
                    "producer_receipt_sha256":os.environ["QUALIFICATION_SHA"]}
          if any(value[name] != item for name,item in expected.items()): raise SystemExit(2)
          PY

      - name: Authenticate trusted OCI publisher only after validation
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/docker-config"
          printf '%s' "$GHCR_TOKEN" | docker --config "$RUNNER_TEMP/docker-config" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - id: oci
        name: Publish one run-unique transport tag and resolve immutable digest
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          subject="$REPOSITORY:diagnostic-$EXACT_H-$GITHUB_RUN_ID"
          docker run --rm --network host \
            -v "$RUNNER_TEMP/docker-config:/root/.docker:ro" -v "$candidate:/work:ro" -w /work \
            "$ORAS_IMAGE" push "$subject" \
            --artifact-type application/vnd.cogs.stage2.rootfs.package.v1 \
            "accepted/rootfs.tar:application/vnd.cogs.stage2.rootfs.v1.tar" \
            "accepted/rootfs.manifest.json:application/vnd.cogs.stage2.rootfs.manifest.v1+json" \
            "accepted/rootfs.metadata.json:application/vnd.cogs.stage2.rootfs.metadata.v2+json" \
            "rootfs.package.json:application/vnd.cogs.stage2.rootfs.package.v1+json" \
            "rootfs.provenance.json:application/vnd.cogs.stage2.rootfs.provenance.v1+json"
          digest=$(docker run --rm --network host -v "$RUNNER_TEMP/docker-config:/root/.docker:ro" \
            "$ORAS_IMAGE" resolve "$subject")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'subject=%s@%s\ndigest=%s\n' "$REPOSITORY" "$digest" "${digest#sha256:}" >>"$GITHUB_OUTPUT"

      - name: Keyless sign and verify exact immutable subject
        env: { SUBJECT: "${{ steps.oci.outputs.subject }}" }
        run: |
          set -euo pipefail
          cosign_home="$RUNNER_TEMP/cosign-home"
          install -d -m 0700 "$cosign_home/.docker"
          install -m 0600 "$RUNNER_TEMP/docker-config/config.json" "$cosign_home/.docker/config.json"
          cosign() {
            docker run --rm --user "$(id -u):$(id -g)" --network host \
              -e HOME=/cosign-home -e COSIGN_EXPERIMENTAL=1 \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -v "$cosign_home:/cosign-home" "$COSIGN_IMAGE" "$@"
          }
          cosign sign --yes --new-bundle-format=true "$SUBJECT"
          identity="https://github.com/nenb/cogs/.github/workflows/stage2-prebuilt-rootfs-diagnostic-publisher.yml@refs/heads/main"
          cosign verify --new-bundle-format=true --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$SUBJECT" >"$RUNNER_TEMP/cosign-verification.json"
          test -s "$RUNNER_TEMP/cosign-verification.json"

      - name: Pull immutable subject and byte-compare all five members
        env: { SUBJECT: "${{ steps.oci.outputs.subject }}" }
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/readback"
          docker run --rm --network host -v "$RUNNER_TEMP/docker-config:/root/.docker:ro" \
            -v "$RUNNER_TEMP/readback:/out" "$ORAS_IMAGE" pull --output /out "$SUBJECT"
          for name in accepted/rootfs.tar accepted/rootfs.manifest.json accepted/rootfs.metadata.json rootfs.package.json rootfs.provenance.json; do
            cmp "$RUNNER_TEMP/candidate/$name" "$RUNNER_TEMP/readback/$name"
          done
          test "$(find "$RUNNER_TEMP/readback" -type f | wc -l)" = 5

      - name: Issue publication receipt, descriptor, and retained custody
        env:
          OCI_DIGEST: ${{ steps.oci.outputs.digest }}
          SOURCE_MANIFEST: ${{ needs.validate.outputs.source_manifest }}
          PACKAGE_SHA: ${{ needs.validate.outputs.package_sha }}
          PROVENANCE_SHA: ${{ needs.validate.outputs.provenance_sha }}
          QUALIFICATION_SHA: ${{ needs.validate.outputs.qualification_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/control-input"; install -d -m 0700 "$out"
          cosign_sha=$(sha256sum "$RUNNER_TEMP/cosign-verification.json" | cut -d' ' -f1)
          workflow_sha=$(sha256sum .github/workflows/stage2-prebuilt-rootfs-diagnostic-publisher.yml | cut -d' ' -f1)
          jq -cnS --arg h "$EXACT_H" --arg g "$GITHUB_SHA" --arg source "$SOURCE_MANIFEST" --arg manifest "$OCI_DIGEST" \
            --arg blob 41951eee6ee10211fa716962dd6e2641c319a816b89d0fc31fe114872addc397 \
            --arg package "$PACKAGE_SHA" --arg provenance "$PROVENANCE_SHA" --arg qualification "$QUALIFICATION_SHA" \
            --arg signature "$cosign_sha" --arg workflow "$workflow_sha" \
            --argjson publisher_run "$GITHUB_RUN_ID" --argjson producer_run "$PRODUCER_RUN_ID" \
            --argjson producer_artifact "$PRODUCER_ARTIFACT_ID" \
            '{version:"cogs.stage2-prebuilt-rootfs-publication-receipt/v1",result:"pass",implementation_revision:$h,control_revision:$g,source_manifest_sha256:$source,oci_manifest_sha256:$manifest,rootfs_ustar_sha256:$blob,package_manifest_sha256:$package,provenance_sha256:$provenance,qualification_receipt_sha256:$qualification,signature_verification_sha256:$signature,publisher_workflow_sha256:$workflow,publisher_run_id:$publisher_run,producer_run_id:$producer_run,producer_artifact_id:$producer_artifact,conditional_identity:"immutable-manifest-digest",readback:"byte-equal-all-five-members"}' \
            >"$out/publication-receipt.json"
          publication_sha=$(sha256sum "$out/publication-receipt.json" | cut -d' ' -f1)
          COGS_PREBUILT_H="$EXACT_H" \
          COGS_PREBUILT_SOURCE_MANIFEST_SHA256="$SOURCE_MANIFEST" \
          COGS_PREBUILT_PACKAGE_MANIFEST_SHA256="$PACKAGE_SHA" \
          COGS_PREBUILT_PROVENANCE_SHA256="$PROVENANCE_SHA" \
          COGS_PREBUILT_QUALIFICATION_RECEIPT_SHA256="$QUALIFICATION_SHA" \
          COGS_PREBUILT_PUBLICATION_RECEIPT_SHA256="$publication_sha" \
          COGS_PREBUILT_OCI_MANIFEST_DIGEST="$OCI_DIGEST" \
            /usr/bin/python3 -I -B scripts/stage2-prebuilt-rootfs-publisher.py issue-descriptor \
            >"$out/descriptor.json"
          install -m 0400 "$RUNNER_TEMP/candidate/rootfs.provenance.json" "$out/rootfs.provenance.json"
          install -m 0400 "$RUNNER_TEMP/candidate/rootfs.package.json" "$out/rootfs.package.json"
          install -m 0400 "$RUNNER_TEMP/candidate/producer-receipt.json" "$out/producer-receipt.json"
          install -m 0400 "$RUNNER_TEMP/cosign-verification.json" "$out/cosign-verification.json"
          test "$(find "$out" -type f | wc -l)" = 6

      - name: Upload exact descriptor and retained publication custody for G
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-prebuilt-rootfs-diagnostic-control-input-${{ inputs.exact_implementation_head }}-${{ github.sha }}
          path: ${{ runner.temp }}/control-input
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove publisher credentials
        if: always()
        run: |
          set -euo pipefail
          docker --config "$RUNNER_TEMP/docker-config" logout ghcr.io >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/docker-config" "$RUNNER_TEMP/cosign-home"
          test ! -e "$RUNNER_TEMP/docker-config"
          test ! -e "$RUNNER_TEMP/cosign-home"
