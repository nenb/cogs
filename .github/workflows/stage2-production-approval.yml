name: Stage 2 authenticated production approval
run-name: Stage 2 production approval G=${{ github.sha }} plan=${{ inputs.planning_run_id }}

on:
  workflow_dispatch:
    inputs:
      planning_run_id: { description: Exact separately authorized planning run, required: true, type: string }
      planning_artifact_id: { description: Exact planning package artifact ID, required: true, type: string }
      planning_artifact_digest: { description: Exact sha256-prefixed planning archive digest, required: true, type: string }

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: stage2-production-approval
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAN_RUN_ID: ${{ inputs.planning_run_id }}
      PLAN_ARTIFACT_ID: ${{ inputs.planning_artifact_id }}
      PLAN_ARTIFACT_DIGEST: ${{ inputs.planning_artifact_digest }}
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:be924970ba7438c22e18067dec5637946d6566eac711f5bedd1584e7137008fb
    steps:
      - name: Admit sole first-created protected approval before source effects
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --paginate --slurp \
            'repos/nenb/cogs/actions/workflows/stage2-production-approval.yml/runs?event=workflow_dispatch&branch=main&per_page=100' \
            >"$RUNNER_TEMP/approval-runs.json"
          jq -e --arg g "$GITHUB_SHA" --arg plan "$PLAN_RUN_ID" --argjson current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[] | select(.head_sha == $g and
              .display_title == ("Stage 2 production approval G=" + $g + " plan=" + $plan) and
              .path == ".github/workflows/stage2-production-approval.yml" and .run_attempt == 1)] |
             map(.id) == [$current]' "$RUNNER_TEMP/approval-runs.json" >/dev/null

      - name: Authenticate completed planning package without invoking AWS
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$PLAN_RUN_ID" >"$RUNNER_TEMP/plan-run.json"
          jq -e --arg g "$GITHUB_SHA" \
            '.path == ".github/workflows/stage2-production-plan.yml" and .head_sha == $g and
             .head_branch == "main" and .event == "workflow_dispatch" and .run_attempt == 1 and
             .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/plan-run.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$PLAN_ARTIFACT_ID" >"$RUNNER_TEMP/plan-artifact.json"
          jq -e --arg digest "$PLAN_ARTIFACT_DIGEST" --argjson run "$PLAN_RUN_ID" \
            --arg name "stage2-production-planning-$GITHUB_SHA-$PLAN_RUN_ID" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/plan-artifact.json" >/dev/null

      - name: Check out exact approval implementation without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }

      - name: Download exact numeric planning package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.planning_artifact_id }}
          path: ${{ runner.temp }}/planning
          run-id: ${{ inputs.planning_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Issue canonical batch approval without provider credentials
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/planning/approval-draft.json"
          test "$(find "$RUNNER_TEMP/planning/plans" -type f -name '*.tfplan' | wc -l)" = 7
          test "$(find "$RUNNER_TEMP/planning/plans" -type f -name '*.plan.json' | wc -l)" = 7
          test "$(sha256sum "$RUNNER_TEMP/planning/tofu" | cut -d' ' -f1)" = \
            e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88
          executor=$(jq -er '.executor_principal_commitment | select(test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/planning/approval-draft.json")
          printf 'COGS_STAGE2_EXECUTOR_PRINCIPAL_COMMITMENT=%s\n' "$executor" >>"$GITHUB_ENV"
          out="$RUNNER_TEMP/approval"; install -d -m 0700 "$out"
          /usr/bin/python3 -I -B scripts/stage2-production-approval.py issue \
            "$RUNNER_TEMP/planning/approval-draft.json" >"$out/approval.json"
          cp -R "$RUNNER_TEMP/planning/plans" "$out/plans"
          install -m 0555 "$RUNNER_TEMP/planning/tofu" "$out/tofu"
          test "$(sha256sum "$RUNNER_TEMP/planning/tofu-provider-aws" | cut -d' ' -f1)" = \
            "$(jq -er '.provider_binary_sha256' "$out/approval.json")"
          install -m 0555 "$RUNNER_TEMP/planning/tofu-provider-aws" "$out/tofu-provider-aws"

      - name: Bind authentication, signer, principals, and first-created run
        run: |
          set -euo pipefail
          workflow_sha=$(sha256sum .github/workflows/stage2-production-approval.yml | cut -d' ' -f1)
          COGS_STAGE2_APPROVAL_WORKFLOW_SHA256="$workflow_sha" \
          COGS_STAGE2_EXECUTOR_PRINCIPAL_COMMITMENT="$COGS_STAGE2_EXECUTOR_PRINCIPAL_COMMITMENT" \
            /usr/bin/python3 -I -B scripts/stage2-production-approval.py authenticate \
            "$RUNNER_TEMP/approval/approval.json" \
            >"$RUNNER_TEMP/approval/approval-authentication.json"

      - name: Keyless sign authentication and retain the exact offline verifier
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/approval"
          cp config/stage2-sigstore-trusted-root-v1.json "$out/sigstore-trusted-root.json"
          docker run --rm --network host \
            -e COSIGN_EXPERIMENTAL=1 -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -v "$out:/work" -w /work "$COSIGN_IMAGE" sign-blob --yes \
            --bundle approval-authentication.bundle.json approval-authentication.json >/dev/null
          identity="https://github.com/nenb/cogs/.github/workflows/stage2-production-approval.yml@refs/heads/main"
          docker run --rm --network none -v "$out:/work:ro" -w /work "$COSIGN_IMAGE" verify-blob \
            --trusted-root sigstore-trusted-root.json \
            --bundle approval-authentication.bundle.json --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            approval-authentication.json >/dev/null
          container=$(docker create "$COSIGN_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/ko-app/cosign" "$out/cosign"
          test "$(sha256sum "$out/cosign" | cut -d' ' -f1)" = \
            5db1043ec70bf92296da977941b19b3d86869af3018d4f4a0f457bf54d76bb68
          chmod 0555 "$out/cosign"; chmod 0444 "$out/sigstore-trusted-root.json"

      - name: Upload one non-replace approval and seven exact plans
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-approval-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/approval
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
