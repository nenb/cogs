name: Stage 2 pre-H diagnostic prebuilt rootfs producer
run-name: Pre-H diagnostic prebuilt rootfs producer H=${{ inputs.exact_implementation_head }}

on:
  workflow_dispatch:
    inputs:
      exact_implementation_head:
        description: Exact complete reviewed implementation H
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      head: ${{ steps.guard.outputs.head }}
    steps:
      - id: guard
        name: Admit one exact protected-main attempt before checkout
        env:
          EXACT_H: ${{ inputs.exact_implementation_head }}
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_H" "$GITHUB_RUN_ID"; do
            case "$selected" in
              c30e0d69ec374cd812ff361e670e974d51b661c4|15d99b55f4910df94decdd7edcc80bf95aee492d|d0e29eb359f0c1678c18f676e312276eff3aa3f8|34375934829|34402409489|34403562378|34411847798|10114901253|10123988189|10124443866|c10fc103532f3e3a8b746727bd0f48c6d8498148|eb59cae18e0f041a243f35f253d46713f7e87142|b11adc47c454bde0dc0e2930012e418b90917555|34282898803|34292774279|34293986674|34301325559|34302034014|10079099187|10081986019|10082440691|6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXACT_H" =~ ^[0-9a-f]{40}$ ]]
          test "$EXACT_H" = "$GITHUB_SHA"
          printf 'head=%s\n' "$EXACT_H" >>"$GITHUB_OUTPUT"

      - name: Require the sole first-created diagnostic producer run without reading final history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_H: ${{ inputs.exact_implementation_head }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/nenb/cogs/actions/workflows/stage2-prebuilt-rootfs-diagnostic-producer.yml/runs?event=workflow_dispatch&per_page=100&head_sha=$EXACT_H" \
            >"$RUNNER_TEMP/producer-runs.json"
          jq -e --arg h "$EXACT_H" --argjson current "$GITHUB_RUN_ID" \
            '([.[].total_count] | unique) == [1] and
             ([.[].workflow_runs[] | select(.head_sha == $h and .path == ".github/workflows/stage2-prebuilt-rootfs-diagnostic-producer.yml")] | map(.id) == [$current])' \
            "$RUNNER_TEMP/producer-runs.json" >/dev/null

  build:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.produce.outputs.receipt_sha256 }}
      package_sha256: ${{ steps.produce.outputs.package_sha256 }}
      provenance_sha256: ${{ steps.produce.outputs.provenance_sha256 }}
    steps:
      - name: Recheck retirement before build checkout
        env: { EXACT_H: "${{ needs.admit.outputs.head }}" }
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_H" "$GITHUB_RUN_ID"; do
            case "$selected" in
              c30e0d69ec374cd812ff361e670e974d51b661c4|15d99b55f4910df94decdd7edcc80bf95aee492d|d0e29eb359f0c1678c18f676e312276eff3aa3f8|34375934829|34402409489|34403562378|34411847798|10114901253|10123988189|10124443866|c10fc103532f3e3a8b746727bd0f48c6d8498148|eb59cae18e0f041a243f35f253d46713f7e87142|b11adc47c454bde0dc0e2930012e418b90917555|34282898803|34292774279|34293986674|34301325559|34302034014|10079099187|10081986019|10082440691|6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
      - name: Check out exact H without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.admit.outputs.head }}
          persist-credentials: false

      - name: Verify exact source and workflow identity
        id: identity
        env:
          EXACT_H: ${{ needs.admit.outputs.head }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-revision-retirement.py "$GITHUB_SHA" "$EXACT_H"
          test "$(git rev-parse HEAD)" = "$EXACT_H"
          test "$GITHUB_RUN_ATTEMPT" = 1
          workflow_sha=$(sha256sum .github/workflows/stage2-prebuilt-rootfs-diagnostic-producer.yml | cut -d' ' -f1)
          [[ "$workflow_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'workflow_sha=%s\n' "$workflow_sha" >>"$GITHUB_OUTPUT"

      - name: Prepare the complete fixed H source
        env:
          EXACT_PR_HEAD: ${{ needs.admit.outputs.head }}
        run: |
          set -euo pipefail
          result=$(sudo -n env -i PATH=/usr/bin:/bin /usr/bin/python3 -I \
            "$GITHUB_WORKSPACE/scripts/prepare-stage2-fixed-source.py")
          manifest=$(RESULT="$result" /usr/bin/python3 -I - "$EXACT_PR_HEAD" <<'PY'
          import json,os,sys
          value=json.loads(os.environ['RESULT'])
          if value.get('revision') != sys.argv[1] or value.get('authority') != 'qualification-only-fixed-source':
              raise SystemExit(2)
          print(value['manifest_sha256'])
          PY
          )
          [[ "$manifest" =~ ^[0-9a-f]{64}$ ]]
          printf 'COGS_STAGE2_PREBUILT_SOURCE_MANIFEST_SHA256=%s\n' "$manifest" >>"$GITHUB_ENV"

      - name: Build twice, compare, pin, and publish one local product
        id: produce
        env:
          COGS_STAGE2_ARTIFACT_ACQUISITION_APPROVED: download-16-fixed-public-stage2-artifacts
          COGS_STAGE2_PREBUILT_PRODUCER_H: ${{ needs.admit.outputs.head }}
          COGS_STAGE2_PREBUILT_WORKFLOW_SHA256: ${{ steps.identity.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          result=$(sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 5700s \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            COGS_STAGE2_ARTIFACT_ACQUISITION_APPROVED="$COGS_STAGE2_ARTIFACT_ACQUISITION_APPROVED" \
            COGS_STAGE2_PREBUILT_PRODUCER_H="$COGS_STAGE2_PREBUILT_PRODUCER_H" \
            COGS_STAGE2_PREBUILT_SOURCE_MANIFEST_SHA256="$COGS_STAGE2_PREBUILT_SOURCE_MANIFEST_SHA256" \
            COGS_STAGE2_PREBUILT_WORKFLOW_SHA256="$COGS_STAGE2_PREBUILT_WORKFLOW_SHA256" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-prebuilt-rootfs-producer.py)
          RESULT="$result" /usr/bin/python3 -I - <<'PY' >>"$GITHUB_OUTPUT"
          import json,os
          value=json.loads(os.environ['RESULT'])
          assert value['version']=='cogs.stage2-prebuilt-rootfs-producer-receipt/v1' and value['result']=='pass'
          print('receipt_sha256='+value['receipt_sha256'])
          print('package_sha256='+value['package_manifest_sha256'])
          print('provenance_sha256='+value['provenance_sha256'])
          PY

      - name: Transfer only exact verified product members to upload custody
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stage2-prebuilt-rootfs-product"
          install -d -m 0700 "$out/accepted"
          for name in rootfs.manifest.json rootfs.metadata.json rootfs.tar .cogs-rootfs-publication-v1; do
            sudo -n install -m 0400 "/var/lib/cogs/stage2-prebuilt-rootfs-product-v1/accepted/$name" "$out/accepted/$name"
          done
          for name in producer-receipt.json rootfs.package.json rootfs.provenance.json; do
            sudo -n install -m 0400 "/var/lib/cogs/stage2-prebuilt-rootfs-product-v1/$name" "$out/$name"
          done
          sudo -n chown -R "$(id -u):$(id -g)" "$out"
          test "$(find "$out" -type f | wc -l)" = 7
          sha256sum "$out/accepted/rootfs.tar" | grep -q '^41951eee6ee10211fa716962dd6e2641c319a816b89d0fc31fe114872addc397 '

      - id: upload
        name: Upload the non-authoritative candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-prebuilt-rootfs-diagnostic-${{ needs.admit.outputs.head }}
          path: ${{ runner.temp }}/stage2-prebuilt-rootfs-product
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  readback:
    needs: [admit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download the exact candidate from this one producer run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage2-prebuilt-rootfs-diagnostic-${{ needs.admit.outputs.head }}
          path: ${{ runner.temp }}/readback
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Verify all seven exact members and producer commitments
        env:
          RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
          PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
          PROVENANCE_SHA256: ${{ needs.build.outputs.provenance_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/readback"
          test "$(find "$root" -type f | wc -l)" = 7
          echo "$RECEIPT_SHA256  $root/producer-receipt.json" | sha256sum --check --strict
          echo "$PACKAGE_SHA256  $root/rootfs.package.json" | sha256sum --check --strict
          echo "$PROVENANCE_SHA256  $root/rootfs.provenance.json" | sha256sum --check --strict
          echo "41951eee6ee10211fa716962dd6e2641c319a816b89d0fc31fe114872addc397  $root/accepted/rootfs.tar" | sha256sum --check --strict
          echo "59ae5c5840fffca4ec24f4d720bca7a3f1ecb85e2950d8a7a3db7a3315c321d1  $root/accepted/rootfs.manifest.json" | sha256sum --check --strict
          echo "8bb789127187f3687d1452a4690c4b700fd99ad9e9c97469b726541fad972506  $root/accepted/rootfs.metadata.json" | sha256sum --check --strict
          echo "96ff5f11e4117ac8b22196a2216a52722eb16577dd3f28598e6ca4ebf28f70c0  $root/accepted/.cogs-rootfs-publication-v1" | sha256sum --check --strict
