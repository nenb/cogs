name: Protected product execution

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character main commit
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_PROTECTED_PRODUCT
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  admission:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.admit.outputs.candidate }}
    steps:
      - id: admit
        name: Admit only the sole first-created attempt-one dispatch before application effects
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRMATION" = EXECUTE_PROTECTED_PRODUCT
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          node - <<'NODE'
          process.exitCode = 1;
          const https = require("node:https"), fs = require("node:fs"), env = process.env;
          const fail = (message) => { throw new Error(message); };
          const candidate = env.CANDIDATE, runText = env.GITHUB_RUN_ID ?? "", run = Number(runText);
          const pageSize = 100, maximumPages = 20, maximumBodyBytes = 2 * 1024 * 1024, rows = [];
          const get = (page) => new Promise((resolve, reject) => {
            let settled = false;
            const settle = (fn, value) => { if (!settled) { settled = true; fn(value); } };
            const rejectOnce = (message) => settle(reject, new Error(message));
            const request = https.request({ hostname: "api.github.com", path: `/repos/${env.GITHUB_REPOSITORY}/actions/workflows/insecure-container.yml/runs?event=workflow_dispatch&branch=main&per_page=${pageSize}&page=${page}`, headers: { accept: "application/vnd.github+json", authorization: `Bearer ${env.GITHUB_TOKEN}`, "user-agent": "cogs-protected-product-admission" } }, (response) => {
              let body = "", bytes = 0, ended = false;
              response.setEncoding("utf8");
              response.once("error", () => rejectOnce("actions history response error"));
              response.once("aborted", () => rejectOnce("actions history response aborted"));
              response.once("close", () => { if (!ended || response.complete !== true) rejectOnce("actions history response closed early"); });
              response.on("data", (chunk) => {
                if (settled) return;
                bytes += Buffer.byteLength(chunk, "utf8");
                if (bytes > maximumBodyBytes) {
                  rejectOnce("actions history response too large");
                  try { response.destroy(); } catch { /* rejection is already latched */ }
                  return;
                }
                body += chunk;
              });
              response.once("end", () => {
                ended = true;
                if (response.complete !== true) rejectOnce("actions history response incomplete");
                else if (response.statusCode !== 200) rejectOnce("actions history unavailable");
                else settle(resolve, body);
              });
            });
            request.once("error", () => rejectOnce("actions history request error"));
            request.end();
          });
          (async () => {
            if (!/^[a-f0-9]{40}$/.test(candidate) || !/^[1-9][0-9]*$/.test(runText) || !Number.isSafeInteger(run) || run < 1 || env.GITHUB_RUN_ATTEMPT !== "1") fail("invalid admission inputs");
            let total;
            for (let page = 1; page <= maximumPages; page++) {
              const value = JSON.parse(await get(page));
              if (!value || Object.getPrototypeOf(value) !== Object.prototype || !Number.isSafeInteger(value.total_count) || value.total_count < 0 || !Array.isArray(value.workflow_runs) || value.workflow_runs.length > pageSize || (total !== undefined && total !== value.total_count)) fail("invalid actions history page");
              total = value.total_count; rows.push(...value.workflow_runs);
              if (rows.length === total) break;
              if (value.workflow_runs.length !== pageSize || page === maximumPages) fail("incomplete actions history");
            }
            if (rows.length !== total || total > pageSize * maximumPages) fail("incomplete actions history");
            const ids = new Set();
            for (const row of rows) {
              if (!row || Object.getPrototypeOf(row) !== Object.prototype || !Number.isSafeInteger(row.id) || row.id < 1 || ids.has(row.id) || typeof row.head_sha !== "string" || !/^[a-f0-9]{40}$/.test(row.head_sha) || row.head_branch !== "main" || row.event !== "workflow_dispatch" || !Number.isSafeInteger(row.run_attempt) || row.run_attempt < 1) fail("malformed actions history row");
              ids.add(row.id);
            }
            const exact = rows.filter((row) => row.head_sha === candidate);
            if (exact.length !== 1 || exact[0].id !== run || exact[0].run_attempt !== 1) fail("admission is not the sole first attempt");
            fs.appendFileSync(env.GITHUB_OUTPUT, `candidate=${candidate}\n`, { encoding: "utf8", mode: 0o600 });
            process.exitCode = 0;
          })().catch(() => {});
          NODE

  protected-product:
    if: github.run_attempt == 1 && needs.admission.result == 'success' && needs.admission.outputs.candidate == github.sha
    needs: admission
    name: protected-${{ matrix.profile }}-${{ matrix.authority }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: empty
            skills: empty
            authority: candidate-pass
            mode: --protected-linux
            timeout_minutes: 35
          - profile: nonempty
            skills: nonempty
            authority: candidate-pass
            mode: --protected-linux
            timeout_minutes: 35
          - profile: empty
            skills: empty
            authority: probe-only
            mode: --capability-probes
            timeout_minutes: 100
          - profile: nonempty
            skills: nonempty
            authority: probe-only
            mode: --capability-probes
            timeout_minutes: 100
    concurrency:
      group: protected-product-${{ needs.admission.outputs.candidate }}-${{ matrix.profile }}-${{ matrix.authority }}
      cancel-in-progress: false
    env:
      CANDIDATE: ${{ needs.admission.outputs.candidate }}
      PRODUCT_PROFILE: ${{ matrix.profile }}
      PRODUCT_SKILLS: ${{ matrix.skills }}
      PRODUCT_AUTHORITY: ${{ matrix.authority }}
      PRODUCT_MODE: ${{ matrix.mode }}
      STOCK_WORKER: ghcr.io/nenb/cogs/worker@sha256:1e71b2d0cd65f16c9633e092311b885ff03f43f4036195326e1a9fc91ea57535
      SANDBOX: ghcr.io/nenb/cogs/sandbox@sha256:db475ee1d01d446fe79cc9efdad40c9589cefe60eb69bce2f35108ea44eb94fe
    steps:
      - name: Check out exactly the admitted candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.admission.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify baseline ancestry and install the locked no-links closure
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor 8ddd4c3164bae32dbe02c67d2ee9b82eb8315a38 "$CANDIDATE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          env -i HOME="$HOME" PATH="$PATH" npm ci --ignore-scripts --no-bin-links
          env -i HOME="$HOME" PATH="$PATH" npm ls --all --ignore-scripts >/dev/null
      - name: Establish a fresh root-controlled Docker realm before pulls or builds
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq --no-trunc)"
          printf '%s\n' '{"exec-opts":["native.cgroupdriver=cgroupfs"],"storage-driver":"overlay2"}' | \
            sudo -n install -o root -g root -m 0644 /dev/stdin /etc/docker/daemon.json
          sudo -n systemctl restart docker
          deadline=$((SECONDS + 45))
          while (( SECONDS < deadline )); do
            if test "$(docker info --format '{{.CgroupDriver}} {{.Driver}}' 2>/dev/null || :)" = 'cgroupfs overlay2'; then
              break
            fi
            sleep 1
          done
          test "$(docker info --format '{{.CgroupDriver}} {{.Driver}}')" = 'cgroupfs overlay2'
          test -z "$(docker ps -aq --no-trunc)"
      - name: Pull only pinned bases before the offline build
        run: |
          set -euo pipefail
          docker pull "$STOCK_WORKER"
          docker pull "$SANDBOX"
          printf 'STOCK_WORKER_ID=%s\nSANDBOX_ID=%s\n' \
            "$(docker image inspect --format '{{.Id}}' "$STOCK_WORKER")" \
            "$(docker image inspect --format '{{.Id}}' "$SANDBOX")" >>"$GITHUB_ENV"
      - name: Root-copy and verify the exact protected build realm
        run: |
          set -euo pipefail
          PROTECTED="/var/lib/cogs-product-test/protected-$CANDIDATE"
          NODE=$(readlink -f "$(command -v node)")
          sudo -n env CANDIDATE="$CANDIDATE" PROTECTED="$PROTECTED" NODE="$NODE" CHECKOUT="$GITHUB_WORKSPACE" /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,shutil,stat,subprocess
          os.umask(0o077)
          candidate=os.environ['CANDIDATE']; root=os.environ['CHECKOUT']; protected=os.environ['PROTECTED']; node=os.environ['NODE']
          fail=lambda s: (_ for _ in ()).throw(SystemExit('FAIL: '+s))
          if not (len(candidate)==40 and all(c in '0123456789abcdef' for c in candidate) and os.path.realpath(root)==root and os.path.dirname(protected)=='/var/lib/cogs-product-test' and os.path.basename(protected)=='protected-'+candidate): fail('invalid protected realm')
          os.makedirs('/var/lib/cogs-product-test',mode=0o700,exist_ok=True)
          for path,mode in [('/var/lib',None),('/var/lib/cogs-product-test',0o700)]:
              info=os.lstat(path)
              if not stat.S_ISDIR(info.st_mode) or info.st_uid!=0 or info.st_mode&0o022 or (mode is not None and stat.S_IMODE(info.st_mode)!=mode): fail('unsafe protected ancestry')
          if os.path.lexists(protected): fail('protected realm already exists')
          # Reject source aliases before copying; root never dereferences a link.
          for current,dirs,files in os.walk(root,followlinks=False):
              for name in dirs+files:
                  info=os.lstat(os.path.join(current,name))
                  if stat.S_ISLNK(info.st_mode) or (not stat.S_ISDIR(info.st_mode) and info.st_nlink!=1): fail('source link or alias')
          shutil.copytree(root,protected,copy_function=shutil.copy2)
          for current,dirs,files in os.walk(protected,topdown=False,followlinks=False):
              for name in dirs+files: os.chown(os.path.join(current,name),0,0,follow_symlinks=False)
              os.chown(current,0,0,follow_symlinks=False)
          os.chmod(protected,0o700)
          def run(*args): return subprocess.check_output(args,text=True,cwd=protected).strip()
          if run('/usr/bin/git','rev-parse','HEAD')!=candidate or run('/usr/bin/git','status','--porcelain=v1','--untracked-files=all'): fail('protected candidate drift')
          # The sealed copy closes every applicable lock entry. Only an optional
          # dependency or a lock cpu/os constraint excluding linux/x64 may be absent.
          npm=shutil.which('npm'); fail('npm unavailable') if npm is None else None
          closure=subprocess.check_output([node,'-e',r'''const fs=require('fs'),crypto=require('crypto'),p=process.argv[1],npm=process.argv[2],l=JSON.parse(fs.readFileSync(p+'/package-lock.json'));if(l.lockfileVersion!==3||!l.packages||!l.packages[''])process.exit(2);const matches=(v,w)=>!Array.isArray(v)||(!v.includes('!'+w)&&(v.some(x=>x===w)||!v.some(x=>!x.startsWith('!'))));const rows=[];for(const k of Object.keys(l.packages).filter(k=>k.startsWith('node_modules/')).sort()){const e=l.packages[k],q=p+'/'+k,app=matches(e.os,'linux')&&matches(e.cpu,'x64'),present=fs.existsSync(q)&&fs.lstatSync(q).isDirectory();if(!present&&app&&!e.optional)process.exit(3);if(present){const j=q+'/package.json';if(!fs.existsSync(j))process.exit(4);rows.push([k,crypto.createHash('sha256').update(fs.readFileSync(j)).digest('hex')]);}else rows.push([k,'absent',!!e.optional,app]);}require('child_process').execFileSync(npm,['--prefix',p,'ls','--all','--ignore-scripts'],{stdio:'ignore'});process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(rows)).digest('hex'));''',protected,npm],text=True)
          source={}
          raw=subprocess.check_output(['/usr/bin/git','ls-tree','-rz','-r','HEAD','--','src','schemas','dev/product-test','dev/launcher/api-client.ts','third_party'],cwd=protected)
          for row in raw.split(b'\0'):
              if not row: continue
              meta,path=row.split(b'\t',1); mode,kind,oid=meta.decode().split(); rel=path.decode()
              if kind!='blob' or mode not in ('100644','100755'): fail('invalid source inventory')
              data=subprocess.check_output(['/usr/bin/git','cat-file','blob',oid],cwd=protected)
              info=os.lstat(os.path.join(protected,rel))
              if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode)!=(int(mode,8)&0o777) or open(os.path.join(protected,rel),'rb').read()!=data: fail('protected source drift')
              source[rel]={'digest':'sha256:'+hashlib.sha256(data).hexdigest(),'mode':int(mode,8)&0o777}
          # Docker receives no checkout alias: replace the copied ignore file only
          # after the exact source closure has been verified in the root realm.
          dockerignore=b"""**
          !.dockerignore
          !src/
          !src/**
          !schemas/
          !schemas/**
          !dev/
          !dev/product-test/
          !dev/product-test/**
          !dev/launcher/
          !dev/launcher/api-client.ts
          !third_party/
          !third_party/**
          """
          root_fd=os.open(protected,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          try:
              temporary='.cogs-product-dockerignore.tmp'
              fd=os.open(temporary,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400,dir_fd=root_fd)
              try:
                  if os.write(fd,dockerignore)!=len(dockerignore): fail('short dockerignore write')
                  os.fchown(fd,0,0); os.fchmod(fd,0o400); os.fsync(fd)
              finally: os.close(fd)
              os.replace(temporary,'.dockerignore',src_dir_fd=root_fd,dst_dir_fd=root_fd); os.fsync(root_fd)
              info=os.stat('.dockerignore',dir_fd=root_fd,follow_symlinks=False)
              if not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_gid!=0 or info.st_nlink!=1 or stat.S_IMODE(info.st_mode)!=0o400: fail('unsafe product dockerignore')
              with os.fdopen(os.open('.dockerignore',os.O_RDONLY|os.O_NOFOLLOW,dir_fd=root_fd),'rb') as f:
                  if f.read()!=dockerignore: fail('product dockerignore drift')
          finally: os.close(root_fd)
          for current,dirs,files in os.walk(protected,followlinks=False):
              for name in dirs+files:
                  info=os.lstat(os.path.join(current,name))
                  if stat.S_ISLNK(info.st_mode) or (not stat.S_ISDIR(info.st_mode) and info.st_nlink!=1) or info.st_uid!=0 or info.st_gid!=0 or info.st_mode&0o022: fail('protected link or writable alias')
          inventory='sha256:'+hashlib.sha256((json.dumps(source,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest()
          value={'candidate':candidate,'tree':run('/usr/bin/git','rev-parse','HEAD^{tree}'),'source_inventory':inventory,'dockerignore':'sha256:'+hashlib.sha256(dockerignore).hexdigest(),'package_lock':'sha256:'+hashlib.sha256(open(protected+'/package-lock.json','rb').read()).hexdigest(),'npm_closure':'sha256:'+closure}
          with open(protected+'/.cogs-product-inventory.json','x',encoding='utf8') as f: f.write(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          with open(protected+'/.git/info/exclude','a',encoding='utf8') as f: f.write('/.cogs-product-inventory.json\n/Dockerfile\n')
          os.chown(protected+'/.cogs-product-inventory.json',0,0); os.chmod(protected+'/.cogs-product-inventory.json',0o400)
          PY
          printf 'PROTECTED=%s\nNODE=%s\n' "$PROTECTED" "$NODE" >>"$GITHUB_ENV"
      - name: Emit fixed worker recipe and build only from protected copy
        run: |
          set -euo pipefail
          sudo -n env -i PATH=/usr/bin:/bin HOME=/nonexistent "$NODE" --import "$PROTECTED/node_modules/tsx/dist/loader.mjs" "$PROTECTED/dev/product-test/runner.ts" --dockerfile >"$RUNNER_TEMP/Dockerfile"
          sudo -n install -o root -g root -m 0400 "$RUNNER_TEMP/Dockerfile" "$PROTECTED/Dockerfile"
          sudo -n docker build --pull=false --network=none --build-arg PINNED_WORKER="$STOCK_WORKER" \
            --file "$PROTECTED/Dockerfile" --tag "cogs-product:$CANDIDATE" "$PROTECTED"
          printf 'WORKER_ID=%s\n' "$(docker image inspect --format '{{.Id}}' "cogs-product:$CANDIDATE")" >>"$GITHUB_ENV"
      - name: Root-create bound immutable restrictions and build receipt
        run: |
          set -euo pipefail
          # Probe suites get a fresh 5,280-second grant: eight independent
          # 600-second effects plus eight 60-second cleanups.  The 100-minute
          # job bound leaves setup and final evidence time without extending a
          # generation's own effect limit.
          lifetime_ms=900000
          if test "$PRODUCT_AUTHORITY" = probe-only; then lifetime_ms=5340000; fi
          sudo -n env CANDIDATE="$CANDIDATE" PROTECTED="$PROTECTED" STOCK_WORKER_ID="$STOCK_WORKER_ID" SANDBOX_ID="$SANDBOX_ID" WORKER_ID="$WORKER_ID" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" IMAGE_OS="$ImageOS" IMAGE_VERSION="$ImageVersion" PRODUCT_PROFILE="$PRODUCT_PROFILE" PRODUCT_SKILLS="$PRODUCT_SKILLS" PRODUCT_AUTHORITY="$PRODUCT_AUTHORITY" RESTRICTION_LIFETIME_MS="$lifetime_ms" RESTRICTIONS="$RUNNER_TEMP/cogs-product-restrictions.json" /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,time
          inv=json.load(open(os.environ['PROTECTED']+'/.cogs-product-inventory.json'))
          common={'candidate':os.environ['CANDIDATE'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'tree':inv['tree'],'source_inventory':inv['source_inventory'],'dockerignore':inv['dockerignore'],'package_lock':inv['package_lock'],'npm_closure':inv['npm_closure'],'image_os':os.environ['IMAGE_OS'],'image_version':os.environ['IMAGE_VERSION']}
          value={'version':'cogs.product-restrictions/v1','baseline':'8ddd4c3164bae32dbe02c67d2ee9b82eb8315a38',**common,'owner':'repository-owner','expires':time.time_ns()//1_000_000+int(os.environ['RESTRICTION_LIFETIME_MS']),'profile':'functional-only-protected-linux-docker/v1','breach':'fail-and-settle-exact','findings':[4,5,6,8,9,10,14],'seconds':600,'skills':os.environ['PRODUCT_SKILLS'],'sandbox_image':os.environ['SANDBOX_ID'],'worker_image':os.environ['WORKER_ID'],'stock_worker_image':os.environ['STOCK_WORKER_ID'],'fresh_protected_runner':True}
          recipe='sha256:'+hashlib.sha256(open(os.environ['PROTECTED']+'/Dockerfile','rb').read()).hexdigest()
          build={'candidate':value['candidate'],'baseline':value['baseline'],'worker_image':value['worker_image'],'sandbox_image':value['sandbox_image'],'stock_worker_image':value['stock_worker_image'],'skills':value['skills'],'profile_case':os.environ['PRODUCT_PROFILE'],'authority':os.environ['PRODUCT_AUTHORITY'],'recipe':recipe,**common}
          for path,body in [(os.environ['RESTRICTIONS'],value),('/var/lib/cogs-product-test/build-receipt.json',build)]:
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
              try: os.write(fd,(json.dumps(body,sort_keys=True,separators=(',',':'))+'\n').encode()); os.fsync(fd)
              finally: os.close(fd)
              os.chown(path,0,0); os.chmod(path,0o400)
          PY
          sudo -n test "$(stat -c '%u:%g:%a' "$RUNNER_TEMP/cogs-product-restrictions.json")" = 0:0:400
      - name: Run only the selected protected profile or its probe-only generations
        run: |
          set -euo pipefail
          status=0
          sudo -n env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/nonexistent "$NODE" --import "$PROTECTED/node_modules/tsx/dist/loader.mjs" "$PROTECTED/dev/product-test/runner.ts" "$PRODUCT_MODE" "$RUNNER_TEMP/cogs-product-restrictions.json" "$CANDIDATE" >"$RUNNER_TEMP/product-receipt.json" || status=$?
          if (( status != 0 )); then
            sudo -n env CANDIDATE="$CANDIDATE" PROFILE="$PRODUCT_PROFILE" AUTHORITY="$PRODUCT_AUTHORITY" STATUS="$status" RECEIPT="$RUNNER_TEMP/product-receipt.json" RUNNER_UID="$(id -u)" RUNNER_GID="$(id -g)" /usr/bin/python3 -I -B - <<'PY' || :
          import json,os,re,stat
          build=json.load(open('/var/lib/cogs-product-test/build-receipt.json'))
          receipt=os.environ['RECEIPT']; info=os.lstat(receipt)
          if not stat.S_ISREG(info.st_mode) or info.st_nlink!=1 or info.st_size>32768: raise SystemExit('unsafe partial receipt')
          raw=open(receipt,'rb').read()
          operations={'authenticate','capability-probe','create','evidence','exec','file','image','lease','lease-directory','mkdir','pair','provenance','seal','settle','status','storage'}
          diagnostics={'constructor','helper','helper-finalize'}|operations
          provenance={'final-head','status','baseline','source','inventory','build-receipt','layer-prefix','layer-count','environment','persistence'}
          probe_keys={'purpose','generation','retired_generation','candidate','tree','source_inventory','run_id','run_attempt','skills','profile_case','build_receipt_sha256','container_id','removed','start_code','running','ssh','sftp'}
          failure_keys={'version','generation','diagnostic','pass_authority','probe_authority'}
          canonical=lambda value:(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
          def object_line(line):
              value=json.loads(line,object_pairs_hook=lambda pairs: pairs if len({k for k,_ in pairs})==len(pairs) else (_ for _ in ()).throw(ValueError()))
              if type(value) is not list: raise ValueError()
              value=dict(value)
              if canonical(value)!=line+b'\n': raise ValueError()
              return value
          def probe(value):
              if set(value)!=probe_keys or value['purpose']!='capability-probe': raise ValueError()
              if not all(isinstance(value[k],str) for k in ('generation','retired_generation','candidate','tree','source_inventory','run_id','run_attempt','skills','profile_case','build_receipt_sha256','container_id','removed')): raise ValueError()
              if not re.fullmatch(r'[a-f0-9]{32}',value['generation']) or value['retired_generation']!=value['generation'] or not re.fullmatch(r'[a-f0-9]{64}',value['container_id']): raise ValueError()
              if value['removed'] not in {'CHOWN','DAC_OVERRIDE','FOWNER','SETGID','SETUID','KILL','NET_BIND_SERVICE','SYS_CHROOT'} or type(value['start_code']) is not int or type(value['running']) is not bool or (value['ssh'] is not None and type(value['ssh']) is not bool) or (value['sftp'] is not None and type(value['sftp']) is not bool): raise ValueError()
              if any(value[k]!=build[k] for k in ('candidate','tree','source_inventory','run_id','run_attempt','skills')) or value['candidate']!=os.environ['CANDIDATE'] or value['profile_case']!=os.environ['PROFILE']: raise ValueError()
              if value['build_receipt_sha256']!='sha256:'+__import__('hashlib').sha256(canonical(build)).hexdigest(): raise ValueError()
          diagnostic='constructor'; generation=None; substage=None; cleanup_uncertain=True
          try:
              if not raw.endswith(b'\n') or not raw or any(not line for line in raw.splitlines()): raise ValueError()
              rows=[object_line(line) for line in raw.splitlines()]
              final=rows[-1]
              if set(final)-{'substage','cleanup'}!=failure_keys or final.get('version')!='cogs.product-failure-diagnostic/v1' or final.get('diagnostic') not in diagnostics or final.get('pass_authority') is not False or final.get('probe_authority') is not False or not re.fullmatch(r'[a-f0-9]{32}',final.get('generation','')): raise ValueError()
              if ('cleanup' in final and final['cleanup']!='uncertain') or (final.get('diagnostic')=='provenance' and final.get('substage') not in provenance) or (final.get('diagnostic')!='provenance' and 'substage' in final): raise ValueError()
              if os.environ['AUTHORITY']=='candidate-pass' and len(rows)!=1: raise ValueError()
              if os.environ['AUTHORITY']=='probe-only':
                  for row in rows[:-1]: probe(row)
              elif os.environ['AUTHORITY']!='candidate-pass': raise ValueError()
              diagnostic=final['diagnostic']; generation=final['generation']; substage=final.get('substage'); cleanup_uncertain=final.get('cleanup')=='uncertain'
          except (AttributeError,KeyError,TypeError,ValueError,json.JSONDecodeError):
              # Hostile, trailing, duplicate, or mixed output is never partial success.
              diagnostic='constructor'; generation=None; substage=None; cleanup_uncertain=True
          value={'version':'cogs.product-failure-receipt/v1','candidate':os.environ['CANDIDATE'],'profile':os.environ['PROFILE'],'authority':os.environ['AUTHORITY'],'status':int(os.environ['STATUS']),'run_id':build['run_id'],'run_attempt':build['run_attempt'],'diagnostic':diagnostic,'cleanup_uncertain':cleanup_uncertain,'pass_authority':False,'probe_authority':False}
          if generation is not None: value['generation']=generation
          if substage is not None: value['substage']=substage
          data=canonical(value)
          if len(data)>2048: raise SystemExit('oversized failure receipt')
          fd=os.open(receipt,os.O_WRONLY|os.O_TRUNC|os.O_NOFOLLOW)
          try:
              if os.write(fd,data)!=len(data): raise SystemExit('short failure receipt')
              os.fsync(fd); os.fchown(fd,int(os.environ['RUNNER_UID']),int(os.environ['RUNNER_GID'])); os.fchmod(fd,0o400)
          finally: os.close(fd)
          PY
            exit "$status"
          fi
          test "$(wc -c <"$RUNNER_TEMP/product-receipt.json")" -le 32768
      - name: Root-inventory pass generation and create digest evidence
        if: always() && matrix.authority == 'candidate-pass'
        run: |
          set -euo pipefail
          sudo -n env CANDIDATE="$CANDIDATE" PRODUCT_PROFILE="$PRODUCT_PROFILE" PRODUCT_AUTHORITY="$PRODUCT_AUTHORITY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_UID="$(id -u)" RUNNER_GID="$(id -g)" RECEIPT="$RUNNER_TEMP/product-receipt.json" EVIDENCE="$RUNNER_TEMP/product-evidence.json" /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,re,stat,sys
          raw=open(os.environ['RECEIPT'],'rb').read(); value=json.loads(raw)
          canonical=lambda item:(json.dumps(item,sort_keys=True,separators=(',',':'))+'\n').encode()
          if value.get('version')=='cogs.product-failure-receipt/v1':
              allowed={'version','candidate','profile','authority','status','run_id','run_attempt','diagnostic','cleanup_uncertain','pass_authority','probe_authority','generation','substage'}
              required=allowed-{'generation','substage'}
              if len(raw)>2048 or raw!=canonical(value) or not required<=set(value)<=allowed or value['candidate']!=os.environ['CANDIDATE'] or value['profile']!=os.environ['PRODUCT_PROFILE'] or value['authority']!='candidate-pass' or value['run_id']!=os.environ['GITHUB_RUN_ID'] or value['run_attempt']!=os.environ['GITHUB_RUN_ATTEMPT'] or value['pass_authority'] is not False or value['probe_authority'] is not False or type(value['cleanup_uncertain']) is not bool: raise SystemExit('FAIL: invalid product failure receipt')
              evidence={'version':'cogs.product-failure-inventory/v1','candidate':value['candidate'],'profile':value['profile'],'authority':value['authority'],'run_id':value['run_id'],'run_attempt':value['run_attempt'],'generation':value.get('generation'),'diagnostic':value['diagnostic'],'cleanup_uncertain':value['cleanup_uncertain'],'pass_authority':False,'probe_authority':False,'receipt_digest':'sha256:'+hashlib.sha256(raw).hexdigest()}
              open(os.environ['EVIDENCE'],'xb').write(canonical(evidence)); sys.exit(0)
          if len(raw)>2048 or raw!=canonical(value) or set(value)!={'version','generation','candidate','tree','source_inventory','run_id','run_attempt','skills'} or value['version']!='cogs.product-pass-receipt/v1' or value['candidate']!=os.environ['CANDIDATE'] or value['run_id']!=os.environ['GITHUB_RUN_ID'] or value['run_attempt']!=os.environ['GITHUB_RUN_ATTEMPT'] or not re.fullmatch(r'[a-f0-9]{32}',value['generation']): raise SystemExit('FAIL: invalid product pass receipt')
          parent='/var/lib/cogs-product-test'; source='protected-'+value['candidate']; evidence='build-receipt.json'; lock=value['generation']+'.lock'
          source_info=os.stat(parent+'/'+source,follow_symlinks=False)
          if not stat.S_ISDIR(source_info.st_mode) or source_info.st_uid!=0 or stat.S_IMODE(source_info.st_mode)!=0o700: raise SystemExit('FAIL: unsafe protected source')
          build=json.load(open(parent+'/'+evidence))
          if any(build.get(k)!=value[k] for k in ('candidate','tree','source_inventory','run_id','run_attempt','skills')) or build.get('profile_case')!=os.environ['PRODUCT_PROFILE'] or build.get('authority')!=os.environ['PRODUCT_AUTHORITY'] or not all(isinstance(build.get(k),str) for k in ('image_os','image_version')): raise SystemExit('FAIL: product evidence binding mismatch')
          parent_fd=os.open(parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          try:
              names=os.listdir(parent_fd); generations=[n for n in names if re.fullmatch(r'[a-f0-9]{32}',n)]
              if set(names)!={source,evidence,lock,value['generation']} or generations!=[value['generation']]: raise SystemExit('FAIL: product root inventory mismatch')
              lock_fd=os.open(lock,os.O_RDONLY|os.O_NOFOLLOW,dir_fd=parent_fd)
              try:
                  lock_info=os.fstat(lock_fd); lock_path=os.stat(lock,dir_fd=parent_fd,follow_symlinks=False)
                  same=lambda a,b:(a.st_dev,a.st_ino)==(b.st_dev,b.st_ino)
                  if not same(lock_info,lock_path) or not stat.S_ISREG(lock_info.st_mode) or lock_info.st_uid!=0 or lock_info.st_gid!=0 or lock_info.st_nlink!=1 or stat.S_IMODE(lock_info.st_mode)!=0o600 or not 1<=lock_info.st_size<=32768: raise SystemExit('FAIL: unsafe generation lock')
                  lock_raw=os.pread(lock_fd,lock_info.st_size,0)
                  if len(lock_raw)!=lock_info.st_size or not same(lock_info,os.stat(lock,dir_fd=parent_fd,follow_symlinks=False)): raise SystemExit('FAIL: replaced generation lock')
                  lines=lock_raw.splitlines(keepends=True)
                  if not lines or any(not line.endswith(b'\n') for line in lines) or len(lines)>2: raise SystemExit('FAIL: invalid generation lock content')
                  lock_values=[]
                  for line in lines:
                      item=json.loads(line)
                      if (json.dumps(item,sort_keys=True,separators=(',',':'))+'\n').encode()!=line: raise SystemExit('FAIL: noncanonical generation lock content')
                      lock_values.append(item)
                  first=lock_values[0]; allowed={'generation','seconds','cleanup_only','purpose'}
                  if type(first) is not dict or not {'generation','seconds'}<=set(first)<=allowed or first['generation']!=value['generation'] or type(first['seconds']) is not int or not 60<=first['seconds']<=600 or ('cleanup_only' in first and first['cleanup_only'] is not True) or ('purpose' in first and first['purpose'] not in ('run','capability-probe')): raise SystemExit('FAIL: invalid generation lock config')
                  if len(lock_values)==2 and lock_values[1]!={'generation':value['generation'],'cleanup_required':True}: raise SystemExit('FAIL: secret or invalid generation lock tail')
                  lock_metadata={'name':lock,'mode':stat.S_IMODE(lock_info.st_mode),'size':lock_info.st_size,'sha256':'sha256:'+hashlib.sha256(lock_raw).hexdigest()}
              finally: os.close(lock_fd)
          finally: os.close(parent_fd)
          control=parent+'/'+value['generation']+'/control'; info=os.stat(control,follow_symlinks=False)
          if not stat.S_ISDIR(info.st_mode) or info.st_uid!=0 or stat.S_IMODE(info.st_mode)!=0o700: raise SystemExit('FAIL: unsafe product control')
          rows=[]
          for name in sorted(os.listdir(control)):
              p=control+'/'+name; s=os.stat(p,follow_symlinks=False)
              if not stat.S_ISREG(s.st_mode) or s.st_uid!=0 or s.st_mode&0o022 or s.st_nlink!=1: raise SystemExit('FAIL: unsafe product control entry')
              if name in ('state.img','workspace.img'):
                  # Retained images are evidence custody, not evidence content.
                  rows.append({'name':name,'kind':'retained-image-metadata','mode':stat.S_IMODE(s.st_mode),'size':s.st_size,'dev':s.st_dev,'inode':s.st_ino})
              else:
                  if s.st_size>1048576: raise SystemExit('FAIL: unknown large product control entry')
                  rows.append({'name':name,'kind':'control-digest','mode':stat.S_IMODE(s.st_mode),'size':s.st_size,'sha256':'sha256:'+hashlib.sha256(open(p,'rb').read()).hexdigest()})
          evidence={'version':'cogs.product-control-digests/v1','candidate':value['candidate'],'generation':value['generation'],'run_id':value['run_id'],'run_attempt':value['run_attempt'],'tree':value['tree'],'source_inventory':value['source_inventory'],'image_os':build['image_os'],'image_version':build['image_version'],'receipt_digest':'sha256:'+hashlib.sha256(raw).hexdigest(),'generation_lock':lock_metadata,'control':rows}
          data=(json.dumps(evidence,sort_keys=True,separators=(',',':'))+'\n').encode()
          if len(data)>65536: raise SystemExit('FAIL: product evidence bound')
          fd=os.open(os.environ['EVIDENCE'],os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
          try: os.write(fd,data); os.fsync(fd)
          finally: os.close(fd)
          os.chown(os.environ['EVIDENCE'],int(os.environ['RUNNER_UID']),int(os.environ['RUNNER_GID'])); os.chmod(os.environ['EVIDENCE'],0o400)
          PY
      - name: Inventory probe-only generations without candidate pass authority
        if: always() && matrix.authority == 'probe-only'
        run: |
          set -euo pipefail
          sudo -n env CANDIDATE="$CANDIDATE" PROFILE="$PRODUCT_PROFILE" AUTHORITY="$PRODUCT_AUTHORITY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RECEIPT="$RUNNER_TEMP/product-receipt.json" EVIDENCE="$RUNNER_TEMP/product-evidence.json" /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,re,sys
          raw=open(os.environ['RECEIPT'],'rb').read()
          canonical=lambda item:(json.dumps(item,sort_keys=True,separators=(',',':'))+'\n').encode()
          try: rows=[json.loads(line) for line in raw.splitlines()]
          except json.JSONDecodeError: rows=[]
          build=open('/var/lib/cogs-product-test/build-receipt.json','rb').read(); bound=json.loads(build)
          if len(rows)==1 and rows[0].get('version')=='cogs.product-failure-receipt/v1':
              value=rows[0]; allowed={'version','candidate','profile','authority','status','run_id','run_attempt','diagnostic','cleanup_uncertain','pass_authority','probe_authority','generation','substage'}; required=allowed-{'generation','substage'}
              if len(raw)>2048 or raw!=canonical(value) or not required<=set(value)<=allowed or value['candidate']!=os.environ['CANDIDATE'] or value['profile']!=os.environ['PROFILE'] or value['authority']!='probe-only' or value['run_id']!=os.environ['GITHUB_RUN_ID'] or value['run_attempt']!=os.environ['GITHUB_RUN_ATTEMPT'] or value['pass_authority'] is not False or value['probe_authority'] is not False or type(value['cleanup_uncertain']) is not bool: raise SystemExit('FAIL: invalid product failure receipt')
              evidence={'version':'cogs.product-failure-inventory/v1','candidate':value['candidate'],'profile':value['profile'],'authority':value['authority'],'run_id':value['run_id'],'run_attempt':value['run_attempt'],'generation':value.get('generation'),'diagnostic':value['diagnostic'],'cleanup_uncertain':value['cleanup_uncertain'],'pass_authority':False,'probe_authority':False,'receipt_digest':'sha256:'+hashlib.sha256(raw).hexdigest()}
              open(os.environ['EVIDENCE'],'xb').write(canonical(evidence)); sys.exit(0)
          profile=os.environ['PROFILE']; skills='nonempty' if profile=='nonempty' else 'empty'
          required={'purpose','generation','retired_generation','candidate','tree','source_inventory','run_id','run_attempt','skills','profile_case','build_receipt_sha256','container_id','removed','start_code','running','ssh','sftp'}
          capabilities={'CHOWN','DAC_OVERRIDE','FOWNER','SETGID','SETUID','KILL','NET_BIND_SERVICE','SYS_CHROOT'}
          if os.environ['AUTHORITY']!='probe-only' or len(raw)>32768 or len(rows)!=len(capabilities) or any(set(row)!=required or row['purpose']!='capability-probe' or not re.fullmatch(r'[a-f0-9]{32}',row['generation']) or row['retired_generation']!=row['generation'] for row in rows): raise SystemExit('FAIL: invalid probe receipt')
          bindings=('candidate','tree','source_inventory','run_id','run_attempt','skills')
          if any(any(row[k]!=bound.get(k) for k in bindings) or row['candidate']!=os.environ['CANDIDATE'] or row['run_id']!=os.environ['GITHUB_RUN_ID'] or row['run_attempt']!=os.environ['GITHUB_RUN_ATTEMPT'] or row['skills']!=skills or row['profile_case']!=profile or row['build_receipt_sha256']!='sha256:'+hashlib.sha256(build).hexdigest() for row in rows): raise SystemExit('FAIL: probe provenance binding mismatch')
          if {row['generation'] for row in rows}!={row['retired_generation'] for row in rows} or len({row['generation'] for row in rows})!=len(rows) or {row['removed'] for row in rows}!=capabilities: raise SystemExit('FAIL: probe capability coverage or retired generation mismatch')
          value={'version':'cogs.product-probe-inventory/v1','candidate':bound['candidate'],'tree':bound['tree'],'source_inventory':bound['source_inventory'],'run_id':bound['run_id'],'run_attempt':bound['run_attempt'],'skills':skills,'profile':profile,'build_receipt_sha256':'sha256:'+hashlib.sha256(build).hexdigest(),'probe_count':len(rows),'capability_coverage':sorted(capabilities),'retired_generations':sorted(row['generation'] for row in rows),'receipt_digest':'sha256:'+hashlib.sha256(raw).hexdigest()}
          data=(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
          if len(data)>4096: raise SystemExit('FAIL: probe evidence bound')
          open(os.environ['EVIDENCE'],'xb').write(data)
          PY
      - name: Upload bounded product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-product-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}-${{ matrix.authority }}
          path: |
            ${{ runner.temp }}/product-evidence.json
            ${{ runner.temp }}/product-receipt.json
          if-no-files-found: error
          retention-days: 30
