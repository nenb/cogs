name: Stage 2 production AWS campaign
run-name: Stage 2 production AWS campaign R=${{ github.sha }} G=${{ inputs.control_head }} approval=${{ inputs.approval_run_id }}

on:
  workflow_dispatch:
    inputs:
      control_head:
        { description: Exact qualified control G, required: true, type: string }
      authorization_phrase:
        {
          description: Fresh destructive AWS campaign authorization,
          required: true,
          type: string,
        }
      approval_run_id:
        {
          description: Exact authenticated approval run,
          required: true,
          type: string,
        }
      approval_artifact_id:
        {
          description: Exact authenticated approval artifact ID,
          required: true,
          type: string,
        }
      approval_artifact_digest:
        {
          description: Exact sha256-prefixed approval archive digest,
          required: true,
          type: string,
        }

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: stage2-production-aws-campaign
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONTROL_HEAD: ${{ inputs.control_head }}
      APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
      APPROVAL_ARTIFACT_ID: ${{ inputs.approval_artifact_id }}
      APPROVAL_ARTIFACT_DIGEST: ${{ inputs.approval_artifact_digest }}
      AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
    steps:
      - name: Admit one first-created separately authorized campaign before source effects
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          test "$AUTHORIZATION_PHRASE" = authorize-seven-stage2-production-cycles
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          [[ "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_HEAD" != "$GITHUB_SHA"
          [[ "$APPROVAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # ADR0326 complete retirement mirror; it must precede source and credential effects.
          for selected in "$GITHUB_SHA" "$GITHUB_RUN_ID" "$CONTROL_HEAD" "$APPROVAL_RUN_ID" \
            "$APPROVAL_ARTIFACT_ID"; do
            case "$selected" in
              c30e0d69ec374cd812ff361e670e974d51b661c4|15d99b55f4910df94decdd7edcc80bf95aee492d|d0e29eb359f0c1678c18f676e312276eff3aa3f8|34375934829|34402409489|34403562378|34411847798|10114901253|10123988189|10124443866|c10fc103532f3e3a8b746727bd0f48c6d8498148|eb59cae18e0f041a243f35f253d46713f7e87142|b11adc47c454bde0dc0e2930012e418b90917555|34282898803|34292774279|34293986674|34301325559|34302034014|10079099187|10081986019|10082440691|6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
          gh api --paginate --slurp \
            "repos/nenb/cogs/actions/workflows/stage2-production-campaign.yml/runs?event=workflow_dispatch&per_page=100&head_sha=$GITHUB_SHA" \
            >"$RUNNER_TEMP/campaign-runs.json"
          jq -e --arg r "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" \
            '([.[].total_count] | unique) == [1] and
             ([.[].workflow_runs[] | select(.head_sha == $r and
               .path == ".github/workflows/stage2-production-campaign.yml")] |
              map(.id) == [$current])' "$RUNNER_TEMP/campaign-runs.json" >/dev/null

      - name: Authenticate exact completed approval run and immutable artifact
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$APPROVAL_RUN_ID" >"$RUNNER_TEMP/approval-run.json"
          jq -e --arg r "$GITHUB_SHA" \
            '.path == ".github/workflows/stage2-production-approval.yml" and .head_sha == $r and
             .head_branch == "main" and .event == "workflow_dispatch" and .run_attempt == 1 and
             .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/approval-run.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$APPROVAL_ARTIFACT_ID" >"$RUNNER_TEMP/approval-artifact.json"
          jq -e --arg digest "$APPROVAL_ARTIFACT_DIGEST" --argjson run "$APPROVAL_RUN_ID" \
            --arg name "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/approval-artifact.json" >/dev/null

      - name: Check out exact campaign revision R without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }

      - name: Install locked schema validator before credentials
        run: npm ci --ignore-scripts

      - name: Download exact numeric approval artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.approval_artifact_id }}
          path: ${{ runner.temp }}/approval
          run-id: ${{ inputs.approval_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Cryptographically verify signed approval authentication before AWS credentials
        id: approval_verification
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/approval"
          test "$(sha256sum "$out/cosign" | cut -d' ' -f1)" = \
            5db1043ec70bf92296da977941b19b3d86869af3018d4f4a0f457bf54d76bb68
          test "$(sha256sum "$out/tofu" | cut -d' ' -f1)" = \
            e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88
          test "$(sha256sum "$out/sigstore-trusted-root.json" | cut -d' ' -f1)" = \
            844a1c6de3986c9f02070266b25e0d1a2fa99ceccc89f6b9ad90aae47b62a16e
          test "$(cat "$out/provider-package.tar.sha256")" = \
            "sha256:$(sha256sum "$out/provider-package.tar" | cut -d' ' -f1)"
          # The stager extracts this archive without trusting artifact modes,
          # and rejects every member outside the manifest before root staging.
          /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
            verify-provider-package "$out"
          chmod 0555 "$out/cosign"
          "$out/cosign" verify-blob --trusted-root "$out/sigstore-trusted-root.json" \
            --bundle "$out/approval-authentication.bundle.json" \
            --certificate-identity \
            https://github.com/nenb/cogs/.github/workflows/stage2-production-approval.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$out/approval-authentication.json" >/dev/null
          test "$(sha256sum "$out/approval.json" | cut -d' ' -f1)" = \
            "$(jq -er '.approval_sha256 | select(test("^[0-9a-f]{64}$"))' \
              "$out/approval-authentication.json")"
          jq -e --arg g "$CONTROL_HEAD" \
            '.version == "cogs.stage2-completion-production-approval/v5" and
             .control_revision == $g and .one_attempt == true' "$out/approval.json" >/dev/null
          /usr/bin/python3 -I -B scripts/stage2-production-approval.py eligibility "$out/approval.json"
          expires_ns=$(jq -er '.expires_unix_ns' "$out/approval.json")
          now_s=$(date +%s); duration=$((expires_ns / 1000000000 - now_s - 60))
          test "$duration" -ge 20000
          test "$duration" -le 28800
          printf 'role_duration_seconds=%s\n' "$duration" >>"$GITHUB_OUTPUT"

      - name: Acquire exact separately approved implementation H without credentials
        run: |
          set -euo pipefail
          h=$(jq -er '.implementation_revision | select(test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/approval/approval.json")
          destination="$RUNNER_TEMP/implementation-H"; test ! -e "$destination"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" git init --quiet "$destination"
          "${clean[@]}" git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" git -C "$destination" fetch --quiet --no-tags --depth=1 origin "$h"
          "${clean[@]}" git -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$destination" rev-parse HEAD)" = "$h"

      - name: Stage exact implementation H before any AWS credential exists
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B \
            "$RUNNER_TEMP/implementation-H/scripts/prepare-stage2-fixed-source.py" >/dev/null

      - name: Acquire short-lived fixed executor credentials only after approval verification
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.STAGE2_AWS_PRODUCTION_EXECUTOR_ROLE_ARN }}
          role-session-name: cogs-stage2-campaign-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: ${{ steps.approval_verification.outputs.role_duration_seconds }}

      - name: Seal executor credential bytes before acquiring independent observer
        run: |
          set -euo pipefail
          umask 077
          printf '[nebula]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" \
            >"$RUNNER_TEMP/aws-credentials"

      - name: Acquire independent short-lived inventory-observer credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.STAGE2_AWS_INVENTORY_OBSERVER_ROLE_ARN }}
          role-session-name: cogs-stage2-observer-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: ${{ steps.approval_verification.outputs.role_duration_seconds }}

      - name: Stage exact H, authenticated approval, explicit credentials, and plans
        id: production_staging
        run: |
          set -euo pipefail
          umask 077
          printf '[profile nebula]\nregion = us-east-1\noutput = json\n[profile observer]\nregion = us-east-1\noutput = json\n' \
            >"$RUNNER_TEMP/aws-config"
          printf '[observer]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" \
            >>"$RUNNER_TEMP/aws-credentials"
          printf '%s\n' '${{ vars.STAGE2_AWS_BUDGET_ALERT_EMAIL }}' >"$RUNNER_TEMP/budget-email"
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
            "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" \
            "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"

      - name: Recover only exact pre-campaign staging after a failed staging step
        if: always() && steps.production_staging.outcome != 'success'
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/cogs/stage2-aws-production-v2 || \
             sudo -n test -e /var/lib/cogs/stage2-aws-production-v2.staging; then
            sudo -n env COGS_STAGE2_STAGING_RECOVERY_ONLY=1 \
              /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
              "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" \
              "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"
          fi
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2.staging

      - name: Retire runner credential files and exported environment after every staging outcome
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/aws-credentials" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/budget-email"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nAWS_PROFILE=\n' \
            >>"$GITHUB_ENV"

      - name: Execute the sole sealed seven-cycle controller
        id: campaign
        timeout-minutes: 265
        run: |
          set -euo pipefail
          sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/run-production-campaign.sh

      - name: Invoke cleanup-only recovery after any uncertain campaign outcome
        if: always() && steps.campaign.outcome != 'success'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials; then
            sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
              /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/recover-production-campaign-entry.sh
          fi
          sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/cleanup-complete.json
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials

      - name: Stage pass-only canonical evidence outside privileged custody
        if: steps.campaign.outcome == 'success'
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/evidence-publication"
          test ! -e "$destination"; install -d -m 0700 "$destination"
          sudo -n find /var/lib/cogs/stage2-aws-production-v2/evidence-publication \
            -mindepth 1 -maxdepth 1 -type f -exec cp --no-preserve=ownership {} "$destination"/ \;
          test "$(sudo -n find "$destination" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ge 2
          sudo -n chown -R "$(id -u):$(id -g)" "$destination"
          chmod 0400 "$destination"/*
          npx tsx scripts/validate-aws-stage2-completion-evidence-v3.ts \
            "$destination/aws-stage2-completion-evidence-v3.json"

      - name: Upload pass-only canonical evidence after credential retirement
        id: evidence_upload
        if: steps.campaign.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Download evidence by exact numeric artifact ID
        if: steps.evidence_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.evidence_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence-readback
          digest-mismatch: error

      - name: Byte-compare exact evidence readback and create upload receipt
        if: steps.evidence_upload.outcome == 'success'
        env:
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          diff -r --no-dereference "$RUNNER_TEMP/evidence-publication" "$RUNNER_TEMP/evidence-readback"
          install -d -m 0700 "$RUNNER_TEMP/evidence-receipt"
          python3 -I -B - <<'PY' >"$RUNNER_TEMP/evidence-receipt/receipt.json"
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"evidence-readback"
          members=[]
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.is_symlink(): raise SystemExit(2)
              raw=path.read_bytes(); members.append({"name":path.name,"bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest()})
          if [row["name"] for row in members] != ["aws-stage2-completion-evidence-v3.json",
              "aws-stage2-completion-publication-v1.json", "aws-stage2-completion-report-v3.md"]:
              raise SystemExit(2)
          artifact_digest=os.environ["EVIDENCE_ARTIFACT_DIGEST"]
          if not artifact_digest.startswith("sha256:"): artifact_digest="sha256:"+artifact_digest
          value={"version":"cogs.stage2-production-evidence-upload-receipt/v2",
              "result":"pass","control_revision":os.environ["CONTROL_HEAD"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":1,
              "artifact_id":int(os.environ["EVIDENCE_ARTIFACT_ID"]),
              "artifact_digest":artifact_digest,
              "members":members,"readback":"byte-equal"}
          print(json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False))
          PY
          node --input-type=module - "$RUNNER_TEMP/evidence-receipt/receipt.json" <<'JS'
          import fs from "node:fs";
          import Ajv2020 from "ajv/dist/2020.js";
          const schema=JSON.parse(fs.readFileSync("schemas/aws-stage2-production-evidence-upload-receipt-v2.json","utf8"));
          const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const validate=new Ajv2020({allErrors:true,strict:true}).compile(schema);
          if(!validate(value)) { console.error(validate.errors); process.exit(2); }
          JS

      - name: Upload separate exact-readback evidence receipt
        id: receipt_upload
        if: steps.evidence_upload.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-evidence-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Download and byte-compare exact receipt artifact ID
        if: steps.receipt_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.receipt_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence-receipt-readback
          digest-mismatch: error

      - name: Require exact receipt bytes
        if: steps.receipt_upload.outcome == 'success'
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/evidence-receipt/receipt.json" \
            "$RUNNER_TEMP/evidence-receipt-readback/receipt.json"
