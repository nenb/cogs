name: Stage 2 production AWS campaign
run-name: Stage 2 production AWS campaign R=${{ github.sha }} G=${{ inputs.control_head }} approval=${{ inputs.approval_run_id }}

on:
  workflow_dispatch:
    inputs:
      control_head: { description: Exact qualified control G, required: true, type: string }
      authorization_phrase: { description: Fresh destructive AWS campaign authorization, required: true, type: string }
      approval_run_id: { description: Exact authenticated approval run, required: true, type: string }
      approval_artifact_id: { description: Exact authenticated approval artifact ID, required: true, type: string }
      approval_artifact_digest: { description: Exact sha256-prefixed approval archive digest, required: true, type: string }

permissions: { actions: read, contents: read, id-token: write }
concurrency: { group: stage2-production-aws-campaign, cancel-in-progress: false }

env:
  CONTROL_HEAD: ${{ inputs.control_head }}
  APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
  APPROVAL_ARTIFACT_ID: ${{ inputs.approval_artifact_id }}
  APPROVAL_ARTIFACT_DIGEST: ${{ inputs.approval_artifact_digest }}
  AWS_MAX_ATTEMPTS: "1"
  AWS_RETRY_MODE: standard

jobs:
  cycles_1_3:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      producer_job_id: ${{ steps.campaign_admission.outputs.producer_job_id }}
      continuation_artifact_id: ${{ steps.continuation_upload.outputs.artifact-id }}
      continuation_artifact_digest: ${{ steps.continuation_metadata.outputs.artifact_digest }}
      continuation_sha256: ${{ steps.continuation_package.outputs.continuation_sha256 }}
    steps:
      - name: Admit one first-created separately authorized campaign before source effects
        id: campaign_admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
        run: |
          set -euo pipefail
          umask 077
          JOB_START_FILE="$RUNNER_TEMP/stage2-job-start-epoch" /usr/bin/python3 -I -B - <<'PY'
          import os,time
          path=os.environ["JOB_START_FILE"]
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,"w",encoding="ascii") as stream:
              stream.write(f"{int(time.time())}\n"); stream.flush(); os.fsync(stream.fileno())
          PY
          test "$AUTHORIZATION_PHRASE" = authorize-seven-stage2-production-cycles
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          [[ "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_HEAD" != "$GITHUB_SHA"
          [[ "$APPROVAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for selected in "$GITHUB_SHA" "$GITHUB_RUN_ID" "$CONTROL_HEAD" "$APPROVAL_RUN_ID" "$APPROVAL_ARTIFACT_ID"; do
            case "$selected" in
              c30e0d69ec374cd812ff361e670e974d51b661c4|15d99b55f4910df94decdd7edcc80bf95aee492d|d0e29eb359f0c1678c18f676e312276eff3aa3f8|34375934829|34402409489|34403562378|34411847798|10114901253|10123988189|10124443866|c10fc103532f3e3a8b746727bd0f48c6d8498148|eb59cae18e0f041a243f35f253d46713f7e87142|b11adc47c454bde0dc0e2930012e418b90917555|34282898803|34292774279|34293986674|34301325559|34302034014|10079099187|10081986019|10082440691|6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363|9ae1f21bf655081f03f4e2f3eb890ffa11de9b3e|34831612221|5ea2064daa3e62ddbd68fc0f0bb20db1eb0c3f3c|4452a96acb1ad31ea8f6b242334f258ce0b0abab|35562735335|35572729553|35573039122|10622494382|10627325100|d98571b9f2be446ed478464d23df532d91b94e53|431f7d2b63b4e5d4da7aca40e0f02ff0fca07f33|17380562a9fb9f7d08bea0269a9fdc5812b1faf7|35638724656|35670440520|35670986936|35684568600|35685410662|10658466954|10670334621|10670965964|10678755703|10677962970|10678201915|10678118928|10677629335|10678169602|10677874983|306727e28ed8b0257d84b7c6fdfd6ba1fde5a22c|21848f84f01d42f28ce2f6f2a177bfe62af8fc58|35716917245|35732877526|35733919360|10690851656|10696531175|2076c2bd781a663d2b27fa478792fc133fa9fd42|1956ea8da439de2ae137e6ccbc5650ca149fe815|4ffdeb435cc8cd053d47ab173b942ec0f99cd3b4|35795093115|35810787971|35811001315|35822851712|10724846408|10729183411|10729578379|8e9328c66a1ab930583e22f07ba6f17f23bc7d2e|f82c9e77acbd8cf1f963a46d73a9e70afb6f41d6|6d2eff8ffa8fe525b5566a0ddded7d79e868ba16|c075458cf2d853200df57584c1b16cf38bd6e38c|f75d3f09990de4635cc3890efe0f5f6e783312bd|35928408355|35938320143|35938533499|35946454149|10780807449|10783357865|10784336353|56fdd694c1a0c6967bf09156d44260f18a28888d|35957236430|10791707159) exit 2 ;;
            esac
          done
          gh api --paginate --slurp "repos/nenb/cogs/actions/workflows/stage2-production-campaign.yml/runs?event=workflow_dispatch&per_page=100&head_sha=$GITHUB_SHA" >"$RUNNER_TEMP/campaign-runs.json"
          jq -e --arg r "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '([.[].total_count] | unique) == [1] and ([.[].workflow_runs[] | select(.head_sha == $r and .path == ".github/workflows/stage2-production-campaign.yml")] | map(.id) == [$current])' "$RUNNER_TEMP/campaign-runs.json" >/dev/null
          gh api "repos/nenb/cogs/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" >"$RUNNER_TEMP/campaign-jobs.json"
          producer=$(jq -er '[.jobs[] | select(.name == "cycles_1_3" and .status == "in_progress")] | select(length == 1) | .[0].id' "$RUNNER_TEMP/campaign-jobs.json")
          [[ "$producer" =~ ^[1-9][0-9]*$ ]]
          printf 'producer_job_id=%s\n' "$producer" >>"$GITHUB_OUTPUT"

      - name: Authenticate exact completed approval run and immutable artifact
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$APPROVAL_RUN_ID" >"$RUNNER_TEMP/approval-run.json"
          jq -e --arg r "$GITHUB_SHA" '.path == ".github/workflows/stage2-production-approval.yml" and .head_sha == $r and .head_branch == "main" and .event == "workflow_dispatch" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/approval-run.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$APPROVAL_ARTIFACT_ID" >"$RUNNER_TEMP/approval-artifact.json"
          jq -e --arg digest "$APPROVAL_ARTIFACT_DIGEST" --argjson run "$APPROVAL_RUN_ID" --arg name "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID" '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' "$RUNNER_TEMP/approval-artifact.json" >/dev/null

      - name: Check out exact campaign revision R without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }

      - name: Download exact numeric approval artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.approval_artifact_id }}
          path: ${{ runner.temp }}/approval
          run-id: ${{ inputs.approval_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Cryptographically verify approval and pre-credential runway
        id: approval_verification
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/approval"
          test "$(sha256sum "$out/cosign" | cut -d' ' -f1)" = 5db1043ec70bf92296da977941b19b3d86869af3018d4f4a0f457bf54d76bb68
          test "$(sha256sum "$out/tofu" | cut -d' ' -f1)" = e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88
          test "$(sha256sum "$out/sigstore-trusted-root.json" | cut -d' ' -f1)" = 844a1c6de3986c9f02070266b25e0d1a2fa99ceccc89f6b9ad90aae47b62a16e
          test "$(cat "$out/provider-package.tar.sha256")" = "sha256:$(sha256sum "$out/provider-package.tar" | cut -d' ' -f1)"
          /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py verify-provider-package "$out"
          chmod 0555 "$out/cosign"
          "$out/cosign" verify-blob --trusted-root "$out/sigstore-trusted-root.json" --bundle "$out/approval-authentication.bundle.json" --certificate-identity https://github.com/nenb/cogs/.github/workflows/stage2-production-approval.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com "$out/approval-authentication.json" >/dev/null
          test "$(sha256sum "$out/approval.json" | cut -d' ' -f1)" = "$(jq -er '.approval_sha256 | select(test("^[0-9a-f]{64}$"))' "$out/approval-authentication.json")"
          jq -e --arg g "$CONTROL_HEAD" '.version == "cogs.stage2-completion-production-approval/v6" and .control_revision == $g and .one_attempt == true and .phrase == "run-seven-sequential-stage2-completion-launches-in-one-fixed-two-phase-campaign" and .phase_boundary_ordinal == 3 and .phase_cycle_counts == [3,4] and .effect_deadline_ns == 28800000000000 and .cleanup_reserve_ns == 1800000000000 and .maximum_cycle_duration_ns == 9000000000000 and .maximum_cost_micro_usd == 1100000 and (.expires_unix_ns - .not_before_unix_ns) == 36000000000000' "$out/approval.json" >/dev/null
          /usr/bin/python3 -I -B scripts/stage2-production-approval.py eligibility "$out/approval.json"
          remaining=$(( $(jq -er '.expires_unix_ns' "$out/approval.json") / 1000000000 - $(date +%s) - 60 ))
          # Preserve at least nine actual hours before any approval consumption
          # or OIDC use; this conservatively exceeds the formal effect/cleanup need.
          test "$remaining" -ge 32400

      - name: Freeze authenticated segment-one issuance authority before OIDC
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
            stage-issuance-approval "$RUNNER_TEMP/approval"

      - name: Acquire and stage exact implementation H before credentials
        run: |
          set -euo pipefail
          h=$(jq -er '.implementation_revision | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/approval/approval.json")
          destination="$RUNNER_TEMP/implementation-H"; test ! -e "$destination"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" git init --quiet "$destination"
          "${clean[@]}" git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" git -C "$destination" fetch --quiet --no-tags --depth=1 origin "$h"
          "${clean[@]}" git -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$destination" rev-parse HEAD)" = "$h"
          sudo -n /usr/bin/python3 -I -B "$destination/scripts/prepare-stage2-fixed-source.py" >/dev/null

      - name: Acquire fresh bounded segment-one executor credentials
        timeout-minutes: 10
        env:
          ROLE_ARN: ${{ vars.STAGE2_AWS_PRODUCTION_EXECUTOR_ROLE_ARN }}
        run: |
          set -euo pipefail
          expiry_s=$(( $(jq -er '.expires_unix_ns' "$RUNNER_TEMP/approval/approval.json") / 1000000000 ))
          remaining=$(( expiry_s - $(date +%s) - 900 )); cap=18000; minimum=16200; duration="$cap"
          test "$duration" -ge "$minimum"; test "$duration" -eq "$cap"; test "$duration" -le "$remaining"
          sudo -n --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ENV \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-production-approval.py \
            assume-github-role executor "$ROLE_ARN" "cogs-stage2-campaign-s1-$GITHUB_RUN_ID" \
            "$duration" "$minimum" /var/lib/cogs/stage2-aws-issuance-v1/approval.json

      - name: Verify executor budget tag-read closure before any resource effect
        run: |
          set -euo pipefail; umask 077
          account=$(aws sts get-caller-identity --query Account --output text --no-cli-pager); test "$account" = 372495030090
          output="$RUNNER_TEMP/executor-budget-tag-read.stdout"; diagnostic="$RUNNER_TEMP/executor-budget-tag-read.stderr"; trap 'rm -f "$output" "$diagnostic"' EXIT
          if aws budgets list-tags-for-resource --resource-arn "arn:aws:budgets::${account}:budget/cogs-s2-permission-probe-$GITHUB_RUN_ID-s1" --output json --no-cli-pager >"$output" 2>"$diagnostic"; then exit 2; fi
          test ! -s "$output"; grep -Fq NotFoundException "$diagnostic"; if grep -Fq AccessDenied "$diagnostic"; then exit 2; fi

      - name: Seal segment-one executor credentials
        run: |
          set -euo pipefail; umask 077
          printf '[nebula]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" >"$RUNNER_TEMP/aws-credentials"

      - name: Acquire fresh bounded segment-one inventory-observer credentials
        timeout-minutes: 10
        env:
          ROLE_ARN: ${{ vars.STAGE2_AWS_INVENTORY_OBSERVER_ROLE_ARN }}
        run: |
          set -euo pipefail
          expiry_s=$(( $(jq -er '.expires_unix_ns' "$RUNNER_TEMP/approval/approval.json") / 1000000000 ))
          remaining=$(( expiry_s - $(date +%s) - 900 )); cap=18000; minimum=16200; duration="$cap"
          test "$duration" -ge "$minimum"; test "$duration" -eq "$cap"; test "$duration" -le "$remaining"
          sudo -n --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ENV \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-production-approval.py \
            assume-github-role observer "$ROLE_ARN" "cogs-stage2-observer-s1-$GITHUB_RUN_ID" \
            "$duration" "$minimum" /var/lib/cogs/stage2-aws-issuance-v1/approval.json

      - name: Stage approval, plans, and segment-one credentials
        id: production_staging
        env:
          BUDGET_ALERT_EMAIL: ${{ vars.STAGE2_AWS_BUDGET_ALERT_EMAIL }}
        run: |
          set -euo pipefail; umask 077
          printf '[profile nebula]\nregion = us-east-1\noutput = json\n[profile observer]\nregion = us-east-1\noutput = json\n' >"$RUNNER_TEMP/aws-config"
          printf '[observer]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" >>"$RUNNER_TEMP/aws-credentials"
          printf '%s\n' "$BUDGET_ALERT_EMAIL" >"$RUNNER_TEMP/budget-email"
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"

      - name: Recover exact failed segment-one staging
        if: always() && steps.production_staging.outcome != 'success'
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/cogs/stage2-aws-production-v2 || sudo -n test -e /var/lib/cogs/stage2-aws-production-v2.staging; then sudo -n env COGS_STAGE2_STAGING_RECOVERY_ONLY=1 /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"; fi
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2; sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2.staging

      - name: Retire runner AWS credential files and exported AWS environment
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/aws-credentials" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/budget-email"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nAWS_PROFILE=\n' >>"$GITHUB_ENV"

      - name: Execute exactly cycles 1 through 3
        id: campaign_segment
        timeout-minutes: 270
        run: |
          set -euo pipefail
          start_file="$RUNNER_TEMP/stage2-job-start-epoch"
          test "$(stat -c '%a:%h' "$start_file")" = 600:1
          job_start=$(cat "$start_file"); [[ "$job_start" =~ ^[1-9][0-9]*$ ]]
          now_s=$(date +%s)
          job_deadline=$(( job_start + (300 - 31) * 60 ))
          remaining=$(( job_deadline - now_s ))
          test "$remaining" -gt 0
          campaign_status=0
          /usr/bin/timeout --signal=TERM --kill-after=10s "$remaining"s sudo -n \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            COGS_STAGE2_WORKFLOW_REVISION="$GITHUB_SHA" \
            COGS_STAGE2_GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            COGS_STAGE2_PRODUCER_JOB_ID="${{ steps.campaign_admission.outputs.producer_job_id }}" \
            COGS_STAGE2_APPROVAL_ARTIFACT_RUN_ID="$APPROVAL_RUN_ID" \
            COGS_STAGE2_APPROVAL_ARTIFACT_ID="$APPROVAL_ARTIFACT_ID" \
            COGS_STAGE2_APPROVAL_ARTIFACT_DIGEST="$APPROVAL_ARTIFACT_DIGEST" \
            COGS_STAGE2_APPROVAL_ARTIFACT_NAME="stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID" \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/run-production-campaign.sh \
            || campaign_status=$?
          exit "$campaign_status"

      - name: Cleanup after an uncertain segment-one outcome
        if: always() && steps.campaign_segment.outcome != 'success'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          root=/var/lib/cogs/stage2-aws-production-v2
          if sudo -n test -e "$root"; then
            if sudo -n test -e "$root/aws-credentials" || \
               { ! sudo -n test -e "$root/cleanup-complete.json" && \
                 ! sudo -n test -e "$root/segment-one-zero-complete.json"; }; then
              sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
                /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/recover-production-campaign-entry.sh
            fi
            if ! sudo -n test -e "$root/cleanup-complete.json"; then
              sudo -n test -e "$root/segment-one-zero-complete.json"
            fi
          else
            sudo -n test ! -e "$root.staging"
          fi
          sudo -n test ! -e "$root/aws-credentials"

      - name: Build credential-free signed continuation package after root credential retirement
        id: continuation_package
        if: steps.campaign_segment.outcome == 'success'
        run: |
          set -euo pipefail; umask 077
          sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/segment-one-zero-complete.json
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials
          sign="$RUNNER_TEMP/continuation-sign"; package="$RUNNER_TEMP/continuation-package"
          install -d -m 0700 "$sign" "$package"
          name=aws-stage2-production-continuation-v1
          sudo -n cp --no-preserve=ownership "/var/lib/cogs/stage2-aws-production-v2/continuation-publication/$name.json" "$sign/$name.json"
          sudo -n chown "$(id -u):$(id -g)" "$sign/$name.json"; chmod 0400 "$sign/$name.json"
          test "$(find "$sign" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 1
          NAME="$name" python3 -I -B - <<'PY'
          import json,os,pathlib,re
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"continuation-sign"/(os.environ["NAME"]+".json")
          raw=path.read_bytes(); value=json.loads(raw)
          if raw != json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode("ascii")+b"\n": raise SystemExit(2)
          forbidden=(b"AWS_ACCESS_KEY_ID",b"AWS_SECRET_ACCESS_KEY",b"AWS_SESSION_TOKEN",b"aws_access_key_id",b"aws_secret_access_key",b"aws_session_token",b"ACTIONS_ID_TOKEN_REQUEST_TOKEN",b"ACTIONS_ID_TOKEN_REQUEST_URL",b"GITHUB_TOKEN",b"BEGIN PRIVATE KEY",b"BEGIN OPENSSH PRIVATE KEY")
          if any(token.lower() in raw.lower() for token in forbidden) or re.search(rb"(?:AKIA|ASIA)[A-Z0-9]{16}",raw): raise SystemExit(2)
          PY
          scripts/stage2-cosign-keyless-sign.sh "$sign" https://github.com/nenb/cogs/.github/workflows/stage2-production-campaign.yml@refs/heads/main "$name"
          install -m 0400 "$sign/$name.json" "$package/$name.json"
          install -m 0400 "$sign/$name.bundle.json" "$package/$name.bundle.json"
          test "$(find "$package" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 2
          test "$(stat -c '%a:%h' "$package"/* | sort -u)" = 400:1
          hash=$(sha256sum "$package/$name.json" | cut -d' ' -f1)
          printf 'continuation_sha256=%s\n' "$hash" >>"$GITHUB_OUTPUT"

      - name: Upload exact signed continuation artifact
        id: continuation_upload
        if: steps.campaign_segment.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-continuation-${{ github.sha }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/continuation-package
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Normalize exact continuation artifact metadata
        id: continuation_metadata
        if: steps.continuation_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_DIGEST: ${{ steps.continuation_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          id='${{ steps.continuation_upload.outputs.artifact-id }}'
          [[ "$id" =~ ^[1-9][0-9]*$ ]]
          digest="$UPLOAD_DIGEST"; if [[ "$digest" != sha256:* ]]; then digest="sha256:$digest"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/nenb/cogs/actions/artifacts/$id" >"$RUNNER_TEMP/continuation-artifact-created.json"
          jq -e --arg digest "$digest" --argjson run "$GITHUB_RUN_ID" \
            --arg name "stage2-production-continuation-$GITHUB_SHA-$GITHUB_RUN_ID-1" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and
             .name == $name and .size_in_bytes > 0 and .size_in_bytes <= 8388608' \
            "$RUNNER_TEMP/continuation-artifact-created.json" >/dev/null
          printf 'artifact_digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Exact continuation artifact readback
        if: steps.continuation_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.continuation_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/continuation-readback
          digest-mismatch: error
      - name: Byte-compare continuation readback
        if: steps.continuation_upload.outcome == 'success'
        run: diff -r --no-dereference "$RUNNER_TEMP/continuation-package" "$RUNNER_TEMP/continuation-readback"

      - name: Retire job-one OIDC request environment after continuation custody
        if: always()
        run: printf 'ACTIONS_ID_TOKEN_REQUEST_TOKEN=\nACTIONS_ID_TOKEN_REQUEST_URL=\n' >>"$GITHUB_ENV"

  cycles_4_7:
    needs: cycles_1_3
    if: ${{ github.run_attempt == 1 && needs.cycles_1_3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CONTINUATION_ARTIFACT_ID: ${{ needs.cycles_1_3.outputs.continuation_artifact_id }}
      CONTINUATION_ARTIFACT_DIGEST: ${{ needs.cycles_1_3.outputs.continuation_artifact_digest }}
      CONTINUATION_SHA256: ${{ needs.cycles_1_3.outputs.continuation_sha256 }}
    steps:
      - name: Admit only the successful same-attempt predecessor and exact artifacts before source effects
        id: handoff_admission
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          umask 077
          JOB_START_FILE="$RUNNER_TEMP/stage2-job-start-epoch" /usr/bin/python3 -I -B - <<'PY'
          import os,time
          path=os.environ["JOB_START_FILE"]
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,"w",encoding="ascii") as stream:
              stream.write(f"{int(time.time())}\n"); stream.flush(); os.fsync(stream.fileno())
          PY
          test "$GITHUB_REPOSITORY" = nenb/cogs; test "$GITHUB_REF" = refs/heads/main; test "$GITHUB_REF_PROTECTED" = true; test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = workflow_dispatch; test "$GITHUB_ACTOR" = nenb; test "$GITHUB_TRIGGERING_ACTOR" = nenb
          [[ "$CONTINUATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; [[ "$CONTINUATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; [[ "$CONTINUATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ '${{ needs.cycles_1_3.outputs.producer_job_id }}' =~ ^[1-9][0-9]*$ ]]
          gh api "repos/nenb/cogs/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" >"$RUNNER_TEMP/campaign-jobs.json"
          jq -e --argjson producer '${{ needs.cycles_1_3.outputs.producer_job_id }}' \
            '[.jobs[] | select(.name == "cycles_1_3" and .id == $producer and .status == "completed" and .conclusion == "success")] | length == 1' \
            "$RUNNER_TEMP/campaign-jobs.json" >/dev/null
          consumer=$(jq -er '[.jobs[] | select(.name == "cycles_4_7" and .status == "in_progress")] | select(length == 1) | .[0].id' "$RUNNER_TEMP/campaign-jobs.json")
          [[ "$consumer" =~ ^[1-9][0-9]*$ ]]; test "$consumer" != '${{ needs.cycles_1_3.outputs.producer_job_id }}'
          printf 'consumer_job_id=%s\n' "$consumer" >>"$GITHUB_OUTPUT"
          gh api "repos/nenb/cogs/actions/artifacts/$CONTINUATION_ARTIFACT_ID" >"$RUNNER_TEMP/continuation-artifact.json"
          jq -e --arg digest "$CONTINUATION_ARTIFACT_DIGEST" --argjson run "$GITHUB_RUN_ID" --arg name "stage2-production-continuation-$GITHUB_SHA-$GITHUB_RUN_ID-1" '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name and .size_in_bytes > 0 and .size_in_bytes <= 8388608' "$RUNNER_TEMP/continuation-artifact.json" >/dev/null
          gh api "repos/nenb/cogs/actions/runs/$APPROVAL_RUN_ID" >"$RUNNER_TEMP/approval-run.json"
          jq -e --arg r "$GITHUB_SHA" '.path == ".github/workflows/stage2-production-approval.yml" and .head_sha == $r and .head_branch == "main" and .event == "workflow_dispatch" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/approval-run.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$APPROVAL_ARTIFACT_ID" >"$RUNNER_TEMP/approval-artifact.json"
          jq -e --arg digest "$APPROVAL_ARTIFACT_DIGEST" --argjson run "$APPROVAL_RUN_ID" --arg name "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID" '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' "$RUNNER_TEMP/approval-artifact.json" >/dev/null

      - name: Check out exact campaign revision R without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - name: Install locked schema validator before credentials
        run: npm ci --ignore-scripts
      - name: Download exact numeric approval artifact again
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.approval_artifact_id }}
          path: ${{ runner.temp }}/approval
          run-id: ${{ inputs.approval_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error
      - name: Download exact same-run continuation artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.cycles_1_3.outputs.continuation_artifact_id }}
          path: ${{ runner.temp }}/continuation
          digest-mismatch: error

      - name: Verify approval and signed continuation before fresh AWS credentials
        id: approval_verification
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/approval"; continuation="$RUNNER_TEMP/continuation"
          test "$(sha256sum "$out/cosign" | cut -d' ' -f1)" = 5db1043ec70bf92296da977941b19b3d86869af3018d4f4a0f457bf54d76bb68
          test "$(sha256sum "$out/tofu" | cut -d' ' -f1)" = e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88
          test "$(sha256sum "$out/sigstore-trusted-root.json" | cut -d' ' -f1)" = 844a1c6de3986c9f02070266b25e0d1a2fa99ceccc89f6b9ad90aae47b62a16e
          test "$(cat "$out/provider-package.tar.sha256")" = "sha256:$(sha256sum "$out/provider-package.tar" | cut -d' ' -f1)"
          /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py verify-provider-package "$out"
          chmod 0555 "$out/cosign"; chmod 0700 "$continuation"; chmod 0400 "$continuation"/*
          test "$(find "$continuation" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 2
          name=aws-stage2-production-continuation-v1
          test "$(find "$continuation" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = 'aws-stage2-production-continuation-v1.bundle.json aws-stage2-production-continuation-v1.json '
          test "$(stat -c '%a:%h' "$continuation"/* | sort -u)" = 400:1
          test "$(stat -c %s "$continuation/$name.json")" -le 4194304
          test "$(stat -c %s "$continuation/$name.bundle.json")" -le 1048576
          test "$(sha256sum "$continuation/$name.json" | cut -d' ' -f1)" = "$CONTINUATION_SHA256"
          NAME="$name" python3 -I -B - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"continuation"; path=root/(os.environ["NAME"]+".json")
          raw=path.read_bytes(); value=json.loads(raw)
          if raw != json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode("ascii")+b"\n": raise SystemExit(2)
          forbidden=(b"AWS_ACCESS_KEY_ID",b"AWS_SECRET_ACCESS_KEY",b"AWS_SESSION_TOKEN",b"aws_access_key_id",b"aws_secret_access_key",b"aws_session_token",b"ACTIONS_ID_TOKEN_REQUEST_TOKEN",b"ACTIONS_ID_TOKEN_REQUEST_URL",b"GITHUB_TOKEN",b"BEGIN PRIVATE KEY",b"BEGIN OPENSSH PRIVATE KEY")
          if any(token.lower() in raw.lower() for token in forbidden) or re.search(rb"(?:AKIA|ASIA)[A-Z0-9]{16}",raw): raise SystemExit(2)
          PY
          jq -e --arg r "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
            --argjson producer '${{ needs.cycles_1_3.outputs.producer_job_id }}' \
            --arg ad "$APPROVAL_ARTIFACT_DIGEST" --arg an "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID" \
            --argjson ar "$APPROVAL_RUN_ID" --argjson ai "$APPROVAL_ARTIFACT_ID" \
            '.workflow_revision == $r and .github_run_id == $run and .github_run_attempt == 1 and
             .producer_job_name == "cycles_1_3" and .producer_job_id == $producer and
             .approval_artifact_run_id == $ar and .approval_artifact_id == $ai and
             .approval_artifact_digest == $ad and .approval_artifact_name == $an and
             .phase_boundary_ordinal == 3 and .active_resource == false and
             .certain_zero == true and .credentials_retired == true' "$continuation/$name.json" >/dev/null
          "$out/cosign" verify-blob --trusted-root "$out/sigstore-trusted-root.json" --bundle "$continuation/$name.bundle.json" --certificate-identity https://github.com/nenb/cogs/.github/workflows/stage2-production-campaign.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com "$continuation/$name.json" >/dev/null
          "$out/cosign" verify-blob --trusted-root "$out/sigstore-trusted-root.json" --bundle "$out/approval-authentication.bundle.json" --certificate-identity https://github.com/nenb/cogs/.github/workflows/stage2-production-approval.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com "$out/approval-authentication.json" >/dev/null
          test "$(sha256sum "$out/approval.json" | cut -d' ' -f1)" = "$(jq -er '.approval_sha256 | select(test("^[0-9a-f]{64}$"))' "$out/approval-authentication.json")"
          jq -e --arg g "$CONTROL_HEAD" '.version == "cogs.stage2-completion-production-approval/v6" and .control_revision == $g and .one_attempt == true and .phrase == "run-seven-sequential-stage2-completion-launches-in-one-fixed-two-phase-campaign" and .phase_boundary_ordinal == 3 and .phase_cycle_counts == [3,4] and .effect_deadline_ns == 28800000000000 and .cleanup_reserve_ns == 1800000000000 and .maximum_cycle_duration_ns == 9000000000000 and .maximum_cost_micro_usd == 1100000 and (.expires_unix_ns - .not_before_unix_ns) == 36000000000000' "$out/approval.json" >/dev/null
          /usr/bin/python3 -I -B scripts/stage2-production-approval.py eligibility "$out/approval.json"
          approval_remaining=$(( $(jq -er '.expires_unix_ns' "$out/approval.json") / 1000000000 - $(date +%s) - 60 ))
          handoff_remaining=$(( $(jq -er '.cleanup_deadline_unix_ns' "$continuation/aws-stage2-production-continuation-v1.json") / 1000000000 - $(date +%s) - 60 ))
          test "$approval_remaining" -ge 19800
          test "$handoff_remaining" -ge 19800

      - name: Freeze authenticated segment-two issuance authority before OIDC
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
            stage-issuance-approval "$RUNNER_TEMP/approval"
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py \
            stage-issuance-continuation "$RUNNER_TEMP/continuation" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            '${{ needs.cycles_1_3.outputs.producer_job_id }}' \
            '${{ steps.handoff_admission.outputs.consumer_job_id }}' \
            "$CONTINUATION_ARTIFACT_ID" "$CONTINUATION_ARTIFACT_DIGEST" \
            "stage2-production-continuation-$GITHUB_SHA-$GITHUB_RUN_ID-1" \
            "$APPROVAL_RUN_ID" "$APPROVAL_ARTIFACT_ID" "$APPROVAL_ARTIFACT_DIGEST" \
            "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID"

      - name: Acquire and stage exact implementation H before credentials
        run: |
          set -euo pipefail
          h=$(jq -er '.implementation_revision | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/approval/approval.json")
          destination="$RUNNER_TEMP/implementation-H"; test ! -e "$destination"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" git init --quiet "$destination"; "${clean[@]}" git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" git -C "$destination" fetch --quiet --no-tags --depth=1 origin "$h"; "${clean[@]}" git -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$destination" rev-parse HEAD)" = "$h"
          sudo -n /usr/bin/python3 -I -B "$destination/scripts/prepare-stage2-fixed-source.py" >/dev/null

      - name: Acquire fresh bounded segment-two executor credentials
        timeout-minutes: 10
        env:
          ROLE_ARN: ${{ vars.STAGE2_AWS_PRODUCTION_EXECUTOR_ROLE_ARN }}
        run: |
          set -euo pipefail
          now_s=$(date +%s)
          approval_remaining=$(( $(jq -er '.expires_unix_ns' "$RUNNER_TEMP/approval/approval.json") / 1000000000 - now_s - 900 ))
          handoff_remaining=$(( $(jq -er '.cleanup_deadline_unix_ns' "$RUNNER_TEMP/continuation/aws-stage2-production-continuation-v1.json") / 1000000000 - now_s - 900 ))
          remaining="$approval_remaining"; if (( handoff_remaining < remaining )); then remaining="$handoff_remaining"; fi
          cap=19800; minimum=18000; duration="$cap"
          test "$duration" -ge "$minimum"; test "$duration" -eq "$cap"; test "$duration" -le "$remaining"
          sudo -n --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ENV \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-production-approval.py \
            assume-github-role executor "$ROLE_ARN" "cogs-stage2-campaign-s2-$GITHUB_RUN_ID" \
            "$duration" "$minimum" /var/lib/cogs/stage2-aws-issuance-v1/approval.json \
            /var/lib/cogs/stage2-aws-issuance-v1/aws-stage2-production-continuation-v1.json
      - name: Verify segment-two executor budget tag-read closure
        run: |
          set -euo pipefail; umask 077
          account=$(aws sts get-caller-identity --query Account --output text --no-cli-pager); test "$account" = 372495030090
          output="$RUNNER_TEMP/executor-budget-tag-read.stdout"; diagnostic="$RUNNER_TEMP/executor-budget-tag-read.stderr"; trap 'rm -f "$output" "$diagnostic"' EXIT
          if aws budgets list-tags-for-resource --resource-arn "arn:aws:budgets::${account}:budget/cogs-s2-permission-probe-$GITHUB_RUN_ID-s2" --output json --no-cli-pager >"$output" 2>"$diagnostic"; then exit 2; fi
          test ! -s "$output"; grep -Fq NotFoundException "$diagnostic"; if grep -Fq AccessDenied "$diagnostic"; then exit 2; fi
      - name: Seal segment-two executor credentials
        run: |
          set -euo pipefail; umask 077
          printf '[nebula]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" >"$RUNNER_TEMP/aws-credentials"

      - name: Acquire fresh bounded segment-two inventory-observer credentials
        timeout-minutes: 10
        env:
          ROLE_ARN: ${{ vars.STAGE2_AWS_INVENTORY_OBSERVER_ROLE_ARN }}
        run: |
          set -euo pipefail
          now_s=$(date +%s)
          approval_remaining=$(( $(jq -er '.expires_unix_ns' "$RUNNER_TEMP/approval/approval.json") / 1000000000 - now_s - 900 ))
          handoff_remaining=$(( $(jq -er '.cleanup_deadline_unix_ns' "$RUNNER_TEMP/continuation/aws-stage2-production-continuation-v1.json") / 1000000000 - now_s - 900 ))
          remaining="$approval_remaining"; if (( handoff_remaining < remaining )); then remaining="$handoff_remaining"; fi
          cap=19800; minimum=18000; duration="$cap"
          test "$duration" -ge "$minimum"; test "$duration" -eq "$cap"; test "$duration" -le "$remaining"
          sudo -n --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ENV \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-production-approval.py \
            assume-github-role observer "$ROLE_ARN" "cogs-stage2-observer-s2-$GITHUB_RUN_ID" \
            "$duration" "$minimum" /var/lib/cogs/stage2-aws-issuance-v1/approval.json \
            /var/lib/cogs/stage2-aws-issuance-v1/aws-stage2-production-continuation-v1.json

      - name: Stage approval, fresh credentials, and root-verified continuation
        id: production_staging
        env:
          BUDGET_ALERT_EMAIL: ${{ vars.STAGE2_AWS_BUDGET_ALERT_EMAIL }}
        run: |
          set -euo pipefail; umask 077
          printf '[profile nebula]\nregion = us-east-1\noutput = json\n[profile observer]\nregion = us-east-1\noutput = json\n' >"$RUNNER_TEMP/aws-config"
          printf '[observer]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" >>"$RUNNER_TEMP/aws-credentials"
          printf '%s\n' "$BUDGET_ALERT_EMAIL" >"$RUNNER_TEMP/budget-email"
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"
          sudo -n /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py stage-continuation \
            "$RUNNER_TEMP/continuation" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            '${{ needs.cycles_1_3.outputs.producer_job_id }}' \
            '${{ steps.handoff_admission.outputs.consumer_job_id }}' \
            "$CONTINUATION_ARTIFACT_ID" "$CONTINUATION_ARTIFACT_DIGEST" \
            "stage2-production-continuation-$GITHUB_SHA-$GITHUB_RUN_ID-1" \
            "$APPROVAL_RUN_ID" "$APPROVAL_ARTIFACT_ID" "$APPROVAL_ARTIFACT_DIGEST" \
            "stage2-production-approval-$GITHUB_SHA-$APPROVAL_RUN_ID"

      - name: Cleanup after failed segment-two staging
        if: always() && steps.production_staging.outcome != 'success'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials; then
            sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/recover-production-campaign-entry.sh
          elif sudo -n test -e /var/lib/cogs/stage2-aws-production-v2.staging; then
            sudo -n env COGS_STAGE2_STAGING_RECOVERY_ONLY=1 /usr/bin/python3 -I -B scripts/stage2-stage-production-approval.py "$RUNNER_TEMP/approval" "$RUNNER_TEMP/budget-email" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/aws-credentials"
          fi
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials

      - name: Retire runner credential files and exported environment
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/aws-credentials" "$RUNNER_TEMP/aws-config" "$RUNNER_TEMP/budget-email"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nAWS_PROFILE=\nACTIONS_ID_TOKEN_REQUEST_TOKEN=\nACTIONS_ID_TOKEN_REQUEST_URL=\n' >>"$GITHUB_ENV"

      - name: Execute exactly cycles 4 through 7 and final zero observation
        id: campaign_segment
        if: steps.production_staging.outcome == 'success'
        timeout-minutes: 300
        run: |
          set -euo pipefail
          start_file="$RUNNER_TEMP/stage2-job-start-epoch"
          test "$(stat -c '%a:%h' "$start_file")" = 600:1
          job_start=$(cat "$start_file"); [[ "$job_start" =~ ^[1-9][0-9]*$ ]]
          now_s=$(date +%s)
          job_deadline=$(( job_start + (330 - 31) * 60 ))
          remaining=$(( job_deadline - now_s ))
          test "$remaining" -gt 0
          campaign_status=0
          /usr/bin/timeout --signal=TERM --kill-after=10s "$remaining"s sudo -n \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/run-production-campaign.sh \
            || campaign_status=$?
          exit "$campaign_status"

      - name: Cleanup after an uncertain segment-two campaign outcome
        if: always() && steps.production_staging.outcome == 'success' && steps.campaign_segment.outcome != 'success'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials || \
             ! sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/cleanup-complete.json; then
            sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
              /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/recover-production-campaign-entry.sh
          fi
          sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/cleanup-complete.json
          sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials

      - name: Stage pass-only canonical evidence after final cleanup and credential retirement
        if: steps.campaign_segment.outcome == 'success'
        run: |
          set -euo pipefail
          sudo -n test -e /var/lib/cogs/stage2-aws-production-v2/cleanup-complete.json; sudo -n test ! -e /var/lib/cogs/stage2-aws-production-v2/aws-credentials
          sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-stage-production-approval.py snapshot-evidence first
          destination=/var/lib/cogs/stage2-aws-evidence-v2/first
          test "$(find "$destination" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')" = 'aws-stage2-completion-evidence-v4.json aws-stage2-completion-publication-v2.json aws-stage2-completion-report-v4.md aws-stage2-production-continuation-admission-v1.json aws-stage2-production-continuation-v1.bundle.json aws-stage2-production-continuation-v1.json '
          test "$(stat -c '%U:%G:%a' "$destination" "$destination"/* | sort -u | tr '\n' ' ')" = 'root:root:444 root:root:555 '
          npx tsx scripts/validate-aws-stage2-completion-evidence-v4.ts --package "$destination"

      - name: Upload pass-only canonical evidence after credential retirement
        id: evidence_upload
        if: steps.campaign_segment.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-evidence-${{ github.sha }}-${{ github.run_id }}
          path: /var/lib/cogs/stage2-aws-evidence-v2/first
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Download evidence by exact numeric artifact ID
        if: steps.evidence_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.evidence_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence-readback
          digest-mismatch: error
      - name: Byte-compare exact evidence readback and create upload receipt
        if: steps.evidence_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
          CONSUMER_JOB_ID: ${{ steps.handoff_admission.outputs.consumer_job_id }}
        run: |
          set -euo pipefail
          final_digest="$EVIDENCE_ARTIFACT_DIGEST"; if [[ "$final_digest" != sha256:* ]]; then final_digest="sha256:$final_digest"; fi
          [[ "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; [[ "$final_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/nenb/cogs/actions/artifacts/$EVIDENCE_ARTIFACT_ID" >"$RUNNER_TEMP/evidence-artifact.json"
          jq -e --arg d "$final_digest" --argjson r "$GITHUB_RUN_ID" --arg n "stage2-production-evidence-$GITHUB_SHA-$GITHUB_RUN_ID" '.expired == false and .digest == $d and .workflow_run.id == $r and .name == $n and .size_in_bytes > 0' "$RUNNER_TEMP/evidence-artifact.json" >/dev/null
          export EVIDENCE_ARTIFACT_DIGEST="$final_digest"
          sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            /usr/bin/python3 -I -B /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-stage-production-approval.py snapshot-evidence readback "$RUNNER_TEMP/evidence-readback"
          first=/var/lib/cogs/stage2-aws-evidence-v2/first
          readback=/var/lib/cogs/stage2-aws-evidence-v2/readback
          diff -r --no-dereference "$first" "$readback"
          npx tsx scripts/validate-aws-stage2-completion-evidence-v4.ts --package "$readback"
          install -d -m 0700 "$RUNNER_TEMP/evidence-receipt"
          python3 -I -B - <<'PY' >"$RUNNER_TEMP/evidence-receipt/receipt.json"
          import hashlib,json,os,pathlib
          root=pathlib.Path("/var/lib/cogs/stage2-aws-evidence-v2/readback"); members=[]
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.is_symlink(): raise SystemExit(2)
              raw=path.read_bytes(); members.append({"name":path.name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
          expected=["aws-stage2-completion-evidence-v4.json","aws-stage2-completion-publication-v2.json","aws-stage2-completion-report-v4.md","aws-stage2-production-continuation-admission-v1.json","aws-stage2-production-continuation-v1.bundle.json","aws-stage2-production-continuation-v1.json"]
          if [row["name"] for row in members] != expected: raise SystemExit(2)
          digest=os.environ["EVIDENCE_ARTIFACT_DIGEST"]; digest=digest if digest.startswith("sha256:") else "sha256:"+digest
          admission=json.loads((root/"aws-stage2-production-continuation-admission-v1.json").read_text("ascii"))
          if admission["consumer_job_id"] != int(os.environ["CONSUMER_JOB_ID"]): raise SystemExit(2)
          value={"version":"cogs.stage2-production-evidence-upload-receipt/v3","result":"pass","control_revision":os.environ["CONTROL_HEAD"],"run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":1,"consumer_job_id":admission["consumer_job_id"],"continuation_artifact_id":admission["artifact_id"],"continuation_artifact_digest":admission["artifact_digest"],"continuation_admission_commitment":admission["admission_commitment"],"artifact_id":int(os.environ["EVIDENCE_ARTIFACT_ID"]),"artifact_digest":digest,"members":members,"readback":"byte-equal"}
          print(json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False))
          PY
          node --input-type=module - "$RUNNER_TEMP/evidence-receipt/receipt.json" <<'JS'
          import fs from "node:fs"; import Ajv2020 from "ajv/dist/2020.js";
          const schema=JSON.parse(fs.readFileSync("schemas/aws-stage2-production-evidence-upload-receipt-v3.json","utf8")); const value=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); const validate=new Ajv2020({allErrors:true,strict:true}).compile(schema); if(!validate(value)){console.error(validate.errors);process.exit(2)}
          JS
      - name: Upload separate exact-readback evidence receipt
        id: receipt_upload
        if: steps.evidence_upload.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-evidence-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Download and byte-compare exact receipt artifact ID
        if: steps.receipt_upload.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.receipt_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/evidence-receipt-readback
          digest-mismatch: error
      - name: Require exact receipt bytes
        if: steps.receipt_upload.outcome == 'success'
        run: cmp "$RUNNER_TEMP/evidence-receipt/receipt.json" "$RUNNER_TEMP/evidence-receipt-readback/receipt.json"
