name: KVM qualification

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character protected-main candidate
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_PROTECTED_KVM
        required: true
        type: string

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.admit.outputs.candidate }}
    steps:
      - id: admit
        name: Refuse invalid dispatch before qualification effects
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRMATION" = EXECUTE_PROTECTED_KVM
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$GITHUB_SHA"
          printf 'candidate=%s\n' "$CANDIDATE" >>"$GITHUB_OUTPUT"

  linux-kvm:
    needs: admission
    runs-on: ubuntu-24.04
    env:
      COGS_SOURCE_REVISION: ${{ needs.admission.outputs.candidate }}
      COGS_KVM_EXECUTION_RECEIPT: /run/cogs-kvm-execution-receipt.json
    concurrency:
      group: kvm-qualification-${{ needs.admission.outputs.candidate }}
      cancel-in-progress: true
    timeout-minutes: 55
    steps:
      - name: Root-create immutable KVM execution receipt before checkout
        env:
          CANDIDATE: ${{ needs.admission.outputs.candidate }}
        run: |
          set -euo pipefail
          sudo -n env CANDIDATE="$CANDIDATE" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,time
          candidate=os.environ['CANDIDATE']; run=os.environ['GITHUB_RUN_ID']; attempt=os.environ['GITHUB_RUN_ATTEMPT']
          generation=hashlib.sha256(f'{run}:{attempt}:{candidate}'.encode()).hexdigest()[:32]
          value={'version':'cogs.linux-kvm-execution/v1','run_id':run,'run_attempt':attempt,'candidate':candidate,'source_revision':candidate,'generation':generation,'expires':time.time_ns()//1_000_000+3_600_000}
          path='/run/cogs-kvm-execution-receipt.json'; fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o444)
          try: os.write(fd,(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()); os.fsync(fd)
          finally: os.close(fd)
          os.chown(path,0,0); os.chmod(path,0o444)
          PY
          printf 'COGS_KVM_GENERATION=%s\n' "$(printf '%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CANDIDATE" | sha256sum | cut -d' ' -f1 | cut -c1-32)" >>"$GITHUB_ENV"
          printf 'COGS_KVM_EXECUTION_RECEIPT=/run/cogs-kvm-execution-receipt.json\n' >>"$GITHUB_ENV"
          sudo -n test "$(stat -c '%u:%g:%a' "$COGS_KVM_EXECUTION_RECEIPT")" = 0:0:444
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.admission.outputs.candidate }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install KVM qualification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            busybox-static cloud-image-utils cpio curl e2fsprogs file iptables linux-image-virtual \
            openssh-client qemu-system-x86 qemu-utils socat
          sudo chmod 0660 /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm

      - name: Prove active KVM acceleration with a root guest
        run: env COGS_SOURCE_REVISION="$COGS_SOURCE_REVISION" COGS_KVM_GENERATION="$COGS_KVM_GENERATION" COGS_KVM_EXECUTION_RECEIPT="$COGS_KVM_EXECUTION_RECEIPT" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" dev/linux-kvm/qualify.sh docs/security-evidence/generated/kvm-qualification.json

      - name: Acquire and authenticate the immutable guest image before network isolation
        run: env COGS_SOURCE_REVISION="$COGS_SOURCE_REVISION" COGS_KVM_GENERATION="$COGS_KVM_GENERATION" COGS_KVM_EXECUTION_RECEIPT="$COGS_KVM_EXECUTION_RECEIPT" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" dev/linux-kvm/driver.sh prepare-cache

      - name: Provision the exclusive disposable driver network domain
        run: |
          set -euo pipefail
          ns="cogs-kvm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          identity=
          lease=
          lease_may_exist=false
          acquired=false
          rollback() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$acquired" == true ]]; then
              current=
              pids=
              if ! current=$(sudo ip netns exec "$ns" stat -Lc '%d-%i' /proc/self/ns/net) ||
                 [[ -n "$identity" && "$current" != "$identity" ]] ||
                 ! pids=$(sudo ip netns pids "$ns") || [[ -n "$pids" ]] ||
                 ! sudo ip netns delete "$ns"; then
                echo 'FAIL: uncertain partial network-domain provisioning; custody retained' >&2
              elif [[ "$lease_may_exist" == true ]] && ! sudo rm -- "$lease"; then
                echo 'FAIL: retired namespace left a lease residue' >&2
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT
          sudo ip netns add "$ns"
          acquired=true
          printf 'COGS_KVM_NETNS=%s\n' "$ns" >>"$GITHUB_ENV"
          sudo ip -n "$ns" link set lo up
          identity=$(sudo ip netns exec "$ns" stat -Lc '%d-%i' /proc/self/ns/net)
          for tool in iptables ip6tables; do
            for chain in INPUT FORWARD OUTPUT; do
              sudo ip netns exec "$ns" "$tool" -w 5 -P "$chain" ACCEPT
            done
            expected=$'*filter\n:INPUT ACCEPT [0:0]\n:FORWARD ACCEPT [0:0]\n:OUTPUT ACCEPT [0:0]\nCOMMIT'
            test "$(sudo ip netns exec "$ns" "$tool"-save -t filter)" = "$expected"
          done
          lease="/run/cogs-kvm-network-domain/$identity"
          printf 'COGS_KVM_NETNS_IDENTITY=%s\nCOGS_KVM_LEASE=%s\n' "$identity" "$lease" >>"$GITHUB_ENV"
          boot=$(cat /proc/sys/kernel/random/boot_id)
          sudo install -d -o root -g root -m 0755 /run/cogs-kvm-network-domain
          lease_may_exist=true
          printf 'cogs-exclusive-netns-v1 %s\n' "$boot" | sudo tee "$lease" >/dev/null
          sudo chmod 0444 "$lease"
          trap - EXIT

      - name: Exercise the isolated Debian guest lifecycle
        id: smoke
        env:
          COGS_SOURCE_REVISION: ${{ needs.admission.outputs.candidate }}
        run: |
          sudo -n ip netns exec "$COGS_KVM_NETNS" sudo -n -u "$USER" env \
            HOME="$HOME" PATH="$PATH" COGS_SOURCE_REVISION="$COGS_SOURCE_REVISION" COGS_KVM_GENERATION="$COGS_KVM_GENERATION" COGS_KVM_EXECUTION_RECEIPT="$COGS_KVM_EXECUTION_RECEIPT" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            dev/linux-kvm/ci-smoke.sh docs/security-evidence/generated/kvm-driver-smoke.json

      - name: Retire the exclusive disposable driver network domain
        id: domain_cleanup
        if: always() && env.COGS_KVM_NETNS != ''
        run: |
          set -euo pipefail
          current=$(sudo ip netns exec "$COGS_KVM_NETNS" stat -Lc '%d-%i' /proc/self/ns/net)
          test -n "${COGS_KVM_NETNS_IDENTITY:-}"
          test "$current" = "$COGS_KVM_NETNS_IDENTITY"
          pids=
          if ! pids=$(sudo ip netns pids "$COGS_KVM_NETNS"); then
            echo 'FAIL: network-domain process enumeration was uncertain' >&2
            exit 1
          fi
          test -z "$pids"
          sudo ip netns delete "$COGS_KVM_NETNS"
          sudo rm -- "$COGS_KVM_LEASE"
          test ! -e "$COGS_KVM_LEASE"

      - name: Validate applicability-aware reports
        id: evidence
        if: always()
        run: |
          npm run schemas -- docs/security-evidence/generated/kvm-qualification.json docs/security-evidence/generated/kvm-driver-smoke.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvm-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/security-evidence/generated/kvm-qualification.json
            docs/security-evidence/generated/kvm-driver-smoke.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce applicable conformance after evidence publication
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DOMAIN_OUTCOME: ${{ steps.domain_cleanup.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          test "$SMOKE_OUTCOME" = success
          test "$DOMAIN_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
