name: Stage 2 no-KVM static control candidate
run-name: Non-authoritative Stage 2 static control H=${{ inputs.exact_implementation_head }}

on:
  workflow_dispatch:
    inputs:
      exact_implementation_head:
        description: Exact reviewed implementation revision H
        required: true
        type: string

permissions:
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    # Step bounds total 42 minutes with a three-minute cleanup/runner reserve.
    timeout-minutes: 45
    concurrency:
      group: stage2-no-kvm-static-control-${{ inputs.exact_implementation_head }}
      cancel-in-progress: false
    steps:
      - name: Admit only the authorized event-contract replacement generation
        timeout-minutes: 1
        env:
          ACTIONS_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.exact_implementation_head }}
        run: |
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 50s \
            /usr/bin/python3 -I -B - <<'PY'
          """Versioned authenticated guard for the sole replacement no-KVM static-control event."""
          import json
          import os
          import re
          import stat
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          GUARD_VERSION = "cogs.stage2-static-control-dispatch-guard/v15"
          REPOSITORY = "nenb/cogs"
          WORKFLOW_NAME = "stage2-local-static-control-candidate.yml"
          WORKFLOW_PATH = f".github/workflows/{WORKFLOW_NAME}"
          REVIEWED_IMPLEMENTATION_HEAD = "a2c25f34c35d778965ab7b125fd3b8b4460b0617"
          RUN_TITLE = f"Non-authoritative Stage 2 static control H={REVIEWED_IMPLEMENTATION_HEAD}"
          PREDECESSOR_RUN_ID = 32558263561
          PREDECESSOR_WORKFLOW_HEAD = "a201d5688013377069b6fb4a36159360dc307cae"
          PREDECESSOR_REVIEWED_HEAD = "62bcfbcd58f90d0e329683e3297693c32bb71877"
          PREDECESSOR_RUN_TITLE = (
              f"Non-authoritative Stage 2 static control H={PREDECESSOR_REVIEWED_HEAD}")
          SECOND_PREDECESSOR_RUN_ID = 32560385792
          SECOND_PREDECESSOR_WORKFLOW_HEAD = "7ccb35d14d749a0ef14602889ce2b52934c03d4d"
          SECOND_PREDECESSOR_REVIEWED_HEAD = "67b1ca45f101f98c56b2717549e9252a38a9f2a1"
          SECOND_PREDECESSOR_RUN_TITLE = (
