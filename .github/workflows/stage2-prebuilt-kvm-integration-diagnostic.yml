            /var/lib/cogs/stage2-completion-v1/source/scripts/stage2-stage-prebuilt-control.py \
            verify-diagnostic 015cb863f9b2ec8582619cc46c1914d41eb1b58ef1abc3384cdf34ed24c89029)
