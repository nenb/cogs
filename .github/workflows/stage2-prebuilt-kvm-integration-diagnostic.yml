            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" REPORT_STAGING="$REPORT_STAGING" \
            REPORT_READBACK_STAGING="$REPORT_READBACK_STAGING" RECEIPT_READBACK_STAGING="$RECEIPT_READBACK_STAGING" \
            /usr/bin/python3 -I -B scripts/stage2-local-settlement.py residue
      - id: scaffold
        name: Restore hosted scaffolding after residue proof
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          sudo -n rmdir /run/netns
          test ! -e /run/netns
          test "$(sudo -n stat -c '%U:%G:%a' /opt)" = root:root:755
          sudo -n chmod 0777 /opt
      - id: final_observation
        name: Run one final supervised residue observation
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          sudo -n /usr/bin/python3 -I -B scripts/stage2-local-settlement.py supervise-final <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          EOF
      - name: Enforce the complete readiness diagnostic outcome
        if: always()
        env:
          ROUTE: ${{ steps.route.outcome }}
          RECOVERY: ${{ steps.recovery.outcome }}
          SETTLEMENT: ${{ steps.settlement.outcome }}
          RESIDUE: ${{ steps.residue.outcome }}
          SCAFFOLD: ${{ steps.scaffold.outcome }}
          FINAL_OBSERVATION: ${{ steps.final_observation.outcome }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          for outcome in "$ROUTE" "$RECOVERY" "$SETTLEMENT" "$RESIDUE" "$SCAFFOLD" "$FINAL_OBSERVATION"; do
            test "$outcome" = success
          done
          test ! -e "$REPORT_STAGING"
          test ! -e "$REPORT_READBACK_STAGING"
          test ! -e "$RECEIPT_READBACK_STAGING"
  aggregate:
    name: aggregate statuses only
    permissions: {}
    if: always()
    needs: [full, readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both independent lifecycle jobs
        env:
          FULL: ${{ needs.full.result }}
          READINESS: ${{ needs.readiness.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$FULL" = success
          test "$READINESS" = success
