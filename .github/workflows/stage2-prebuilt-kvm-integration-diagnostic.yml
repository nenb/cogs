  aggregate:
    name: aggregate statuses only
    if: always()
    needs: [full, readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both independent lifecycle jobs
        env:
          FULL: ${{ needs.full.result }}
          READINESS: ${{ needs.readiness.result }}
        run: |
          test "$FULL" = success
          test "$READINESS" = success
