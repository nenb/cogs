name: Stage 2 production planning
run-name: Stage 2 production planning H=${{ inputs.implementation_head }} G=${{ inputs.control_head }} Q=${{ inputs.qualification_head }} qualification=${{ inputs.qualification_run_id }}

on:
  workflow_dispatch:
    inputs:
      authorization_phrase: { description: Fresh read-only AWS planning authorization, required: true, type: string }
      implementation_head: { description: Exact qualified implementation H, required: true, type: string }
      control_head: { description: Exact qualified control G, required: true, type: string }
      qualification_head: { description: Exact qualification package Q, required: true, type: string }
      qualification_run_id: { description: Exact successful formal qualification run, required: true, type: string }
      package_artifact_id: { description: Exact V4 qualification package artifact ID, required: true, type: string }
      package_artifact_digest: { description: Exact corrected pre-AWS package archive digest, required: true, type: string }

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: stage2-production-planning
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      IMPLEMENTATION_HEAD: ${{ inputs.implementation_head }}
      CONTROL_HEAD: ${{ inputs.control_head }}
      QUALIFICATION_HEAD: ${{ inputs.qualification_head }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      PACKAGE_ARTIFACT_DIGEST: ${{ inputs.package_artifact_digest }}
    steps:
      - name: Admit one fresh first-created read-only planning observation
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          test "${{ inputs.authorization_phrase }}" = authorize-read-only-stage2-production-planning
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          [[ "$IMPLEMENTATION_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$IMPLEMENTATION_HEAD" != "$CONTROL_HEAD" && test "$IMPLEMENTATION_HEAD" != "$QUALIFICATION_HEAD"
          test "$CONTROL_HEAD" != "$QUALIFICATION_HEAD"
          test "$GITHUB_SHA" != "$IMPLEMENTATION_HEAD" && test "$GITHUB_SHA" != "$CONTROL_HEAD"
          test "$GITHUB_SHA" != "$QUALIFICATION_HEAD"
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --paginate --slurp \
            'repos/nenb/cogs/actions/workflows/stage2-production-plan.yml/runs?event=workflow_dispatch&branch=main&per_page=100' \
            >"$RUNNER_TEMP/planning-runs.json"
          jq -e --arg r "$GITHUB_SHA" --arg h "$IMPLEMENTATION_HEAD" --arg g "$CONTROL_HEAD" \
            --arg q "$QUALIFICATION_HEAD" --arg qualification "$QUALIFICATION_RUN_ID" \
            --argjson current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[] | select(.head_sha == $r and
              .path == ".github/workflows/stage2-production-plan.yml" and
              .display_title == ("Stage 2 production planning H=" + $h + " G=" + $g + " Q=" + $q + " qualification=" + $qualification))] |
             map(.id) == [$current]' "$RUNNER_TEMP/planning-runs.json" >/dev/null

      - name: Authenticate exact successful formal qualification and package artifact
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          gh api "repos/nenb/cogs/actions/runs/$QUALIFICATION_RUN_ID" >"$RUNNER_TEMP/qualification.json"
          jq -e --arg q "$QUALIFICATION_HEAD" \
            --arg title "Stage 2 prebuilt local Kata qualification H=$IMPLEMENTATION_HEAD G=$CONTROL_HEAD Q=$QUALIFICATION_HEAD" \
            '.path == ".github/workflows/stage2-prebuilt-local-kata-qualification.yml" and
             .head_sha == $q and .display_title == $title and
             .head_branch == "main" and .event == "workflow_dispatch" and
             .run_attempt == 1 and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/qualification.json" >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$PACKAGE_ARTIFACT_ID" >"$RUNNER_TEMP/package-artifact.json"
          jq -e --arg digest "$PACKAGE_ARTIFACT_DIGEST" --argjson run "$QUALIFICATION_RUN_ID" \
            --arg name "stage2-formal-non-aws-package-$IMPLEMENTATION_HEAD-$CONTROL_HEAD-$QUALIFICATION_RUN_ID-1" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            "$RUNNER_TEMP/package-artifact.json" >/dev/null

      - name: Check out exact planning revision without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: "${{ github.sha }}", persist-credentials: false }

      - name: Download exact V4 qualification package ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Prepare exact control and prebuilt descriptor inputs before credentials
        run: |
          set -euo pipefail
          package=deploy/aws-feasibility/remote/stage2-completion-local-control-v4
          test -f "$package/stage2-local-static-control-v2.json"
          test -f "$package/stage2-local-execution-envelope-v3.json"
          test -f "$RUNNER_TEMP/qualification/pre-aws-package-v4.json"
          test -f "$RUNNER_TEMP/qualification/cycle-artifact-custody-v2.json"
          python3 -I -B - "$package/stage2-local-execution-envelope-v3.json" \
            "$RUNNER_TEMP/descriptor.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="ascii"))["rootfs"]["prebuilt_descriptor"]
          open(sys.argv[2],"w",encoding="ascii").write(json.dumps(
              value,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)+"\n")
          PY
          tofu=$(COGS_TOFU_BIN="$RUNNER_TEMP/tofu" scripts/install-opentofu.sh)
          test "$(sha256sum "$tofu" | cut -d' ' -f1)" = \
            e11e783ab8ee0a029da32c2ab1817952121208d0ae9d6cf2d91fa0687f573a88

      - name: Acquire short-lived planning identity only after all local gates
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.STAGE2_AWS_PRODUCTION_PLANNING_ROLE_ARN }}
          role-session-name: cogs-stage2-plan-${{ github.run_id }}
          aws-region: us-east-1
          role-duration-seconds: 10800

      - name: Produce seven read-only saved plans and canonical JSON derivations
        env:
          COGS_STAGE2_AWS_PLAN_AUTHORIZATION: authorize-read-only-stage2-production-planning
          COGS_STAGE2_BUDGET_ALERT_EMAIL: ${{ vars.STAGE2_AWS_BUDGET_ALERT_EMAIL }}
          COGS_STAGE2_EXECUTOR_ROLE_NAME: ${{ vars.STAGE2_AWS_PRODUCTION_EXECUTOR_ROLE_NAME }}
          COGS_STAGE2_INVENTORY_OBSERVER_ROLE_NAME: ${{ vars.STAGE2_AWS_INVENTORY_OBSERVER_ROLE_NAME }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-production-planner.py \
            "$RUNNER_TEMP/qualification/pre-aws-package-v4.json" \
            deploy/aws-feasibility/remote/stage2-completion-local-control-v4/stage2-local-static-control-v2.json \
            "$RUNNER_TEMP/descriptor.json" "$RUNNER_TEMP/tofu" "$RUNNER_TEMP/planning"
          test "$(find "$RUNNER_TEMP/planning/plans" -type f -name '*.tfplan' | wc -l)" = 7
          test "$(find "$RUNNER_TEMP/planning/plans" -type f -name '*.plan.json' | wc -l)" = 7
          test ! -e "$RUNNER_TEMP/planning/.aws-credentials"
          test ! -e "$RUNNER_TEMP/planning/.aws-config"

      - name: Retire planning credentials after every planner outcome
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/planning/.aws-credentials" "$RUNNER_TEMP/planning/.aws-config"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nAWS_PROFILE=\n' \
            >>"$GITHUB_ENV"

      - name: Upload one private planning package for independent approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-production-planning-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/planning
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
