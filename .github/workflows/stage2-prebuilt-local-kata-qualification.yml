name: Stage 2 prebuilt local Kata qualification
run-name: Stage 2 prebuilt local Kata qualification H=${{ inputs.reviewed_implementation_head }} G=${{ inputs.reviewed_control_head }} Q=${{ inputs.reviewed_qualification_head }}

on:
  workflow_dispatch:
    inputs:
      reviewed_implementation_head:
        description: Exact reviewed implementation revision H
        required: true
        type: string
      reviewed_control_head:
        description: Exact independently observed control revision G
        required: true
        type: string
      reviewed_qualification_head:
        description: Exact direct-child qualification package revision Q containing this unchanged workflow
        required: true
        type: string
      mixed_preflight_run_id:
        description: Exact successful attempt-one H-G-Q no-KVM preflight run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: stage2-local-kata-qualification
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.pre_admission.outputs.run_id }}
      preflight_run_id: ${{ steps.pre_admission.outputs.preflight_run_id }}
    steps:
      - name: Admit the sole first-created formal non-cloud batch before every source effect
        id: pre_admission
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.reviewed_implementation_head }}
          EXACT_CONTROL_HEAD: ${{ inputs.reviewed_control_head }}
          EXACT_QUALIFICATION_HEAD: ${{ inputs.reviewed_qualification_head }}
          MIXED_PREFLIGHT_RUN_ID: ${{ inputs.mixed_preflight_run_id }}
          CONFIGURED_IMPLEMENTATION_HEAD: ${{ vars.STAGE2_LOCAL_IMPLEMENTATION_HEAD }}
          CONFIGURED_CONTROL_HEAD: ${{ vars.STAGE2_LOCAL_CONTROL_HEAD }}
          CONFIGURED_QUALIFICATION_HEAD: ${{ vars.STAGE2_LOCAL_QUALIFICATION_HEAD }}
          CONFIGURED_AUTHORIZED_ACTOR: ${{ vars.STAGE2_LOCAL_AUTHORIZED_ACTOR }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = "$CONFIGURED_AUTHORIZED_ACTOR"
          test "$GITHUB_TRIGGERING_ACTOR" = "$CONFIGURED_AUTHORIZED_ACTOR"
          test "$EXACT_IMPLEMENTATION_HEAD" = "$CONFIGURED_IMPLEMENTATION_HEAD"
          test "$EXACT_CONTROL_HEAD" = "$CONFIGURED_CONTROL_HEAD"
          test "$EXACT_QUALIFICATION_HEAD" = "$CONFIGURED_QUALIFICATION_HEAD"
          test "$EXACT_QUALIFICATION_HEAD" = "$GITHUB_SHA"
          test "$EXACT_IMPLEMENTATION_HEAD" != "$EXACT_CONTROL_HEAD"
          test "$EXACT_IMPLEMENTATION_HEAD" != "$EXACT_QUALIFICATION_HEAD"
          test "$EXACT_CONTROL_HEAD" != "$EXACT_QUALIFICATION_HEAD"
          [[ "$MIXED_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXACT_CONTROL_HEAD" >"$RUNNER_TEMP/control-commit.json"
          jq -e --arg g "$EXACT_CONTROL_HEAD" --arg h "$EXACT_IMPLEMENTATION_HEAD" \
            '.sha == $g and (.parents | map(.sha)) == [$h]' "$RUNNER_TEMP/control-commit.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXACT_QUALIFICATION_HEAD" >"$RUNNER_TEMP/qualification-commit.json"
          jq -e --arg q "$EXACT_QUALIFICATION_HEAD" --arg g "$EXACT_CONTROL_HEAD" \
            '.sha == $q and (.parents | map(.sha)) == [$g]' "$RUNNER_TEMP/qualification-commit.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MIXED_PREFLIGHT_RUN_ID" >"$RUNNER_TEMP/preflight-run.json"
          jq -e --arg q "$EXACT_QUALIFICATION_HEAD" \
            --arg title "Stage 2 prebuilt mixed H-G-Q preflight H=$EXACT_IMPLEMENTATION_HEAD G=$EXACT_CONTROL_HEAD Q=$EXACT_QUALIFICATION_HEAD" \
            '.path == ".github/workflows/stage2-prebuilt-mixed-hg-preflight.yml" and
             .head_sha == $q and .head_branch == "main" and .event == "workflow_dispatch" and
             .display_title == $title and .run_attempt == 1 and .status == "completed" and
             .conclusion == "success"' "$RUNNER_TEMP/preflight-run.json" >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$MIXED_PREFLIGHT_RUN_ID/jobs?per_page=100" \
            >"$RUNNER_TEMP/preflight-jobs.json"
          jq -e '[.[].jobs[] | select(.name == "preflight" and .status == "completed" and
                     .conclusion == "success")] | length == 1' "$RUNNER_TEMP/preflight-jobs.json" >/dev/null
          gh api --paginate --slurp \
            'repos/nenb/cogs/actions/workflows/stage2-prebuilt-local-kata-qualification.yml/runs?event=workflow_dispatch&branch=main&per_page=100' \
            >"$RUNNER_TEMP/qualification-runs.json"
          jq -e --arg h "$EXACT_IMPLEMENTATION_HEAD" --arg g "$EXACT_CONTROL_HEAD" \
            --arg q "$EXACT_QUALIFICATION_HEAD" \
            --arg title "Stage 2 prebuilt local Kata qualification H=$EXACT_IMPLEMENTATION_HEAD G=$EXACT_CONTROL_HEAD Q=$EXACT_QUALIFICATION_HEAD" \
            --argjson current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[] | select(.head_sha == $q and .display_title == $title and
              .path == ".github/workflows/stage2-prebuilt-local-kata-qualification.yml")] |
             map(.id) == [$current]' \
            "$RUNNER_TEMP/qualification-runs.json" >/dev/null
          printf 'run_id=%s\npreflight_run_id=%s\n' \
            "$GITHUB_RUN_ID" "$MIXED_PREFLIGHT_RUN_ID" >>"$GITHUB_OUTPUT"

  local-kata:
    needs: admission
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        ordinal: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      EXACT_IMPLEMENTATION_HEAD: ${{ inputs.reviewed_implementation_head }}
      EXACT_CONTROL_HEAD: ${{ inputs.reviewed_control_head }}
      EXACT_QUALIFICATION_HEAD: ${{ inputs.reviewed_qualification_head }}
      FORMAL_CYCLE_ORDINAL: ${{ matrix.ordinal }}
      REPORT_STAGING: /var/tmp/cogs-stage2-local-result-${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_READBACK_STAGING: /var/tmp/cogs-stage2-local-result-upload-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_READBACK_STAGING: /var/tmp/cogs-stage2-local-receipt-upload-${{ github.run_id }}-${{ github.run_attempt }}
      CYCLE_STAGING: /var/tmp/cogs-stage2-local-result-${{ github.run_id }}-${{ github.run_attempt }}/cycle-${{ matrix.ordinal }}
      CYCLE_READBACK_STAGING: /var/tmp/cogs-stage2-local-result-upload-${{ github.run_id }}-${{ github.run_attempt }}/cycle-${{ matrix.ordinal }}
      CYCLE_ARTIFACT_NAME: stage2-formal-cycle-${{ matrix.ordinal }}-${{ inputs.reviewed_implementation_head }}-${{ inputs.reviewed_control_head }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Acquire exact qualification revision Q without credentials
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test -z "$(/usr/bin/find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" /usr/bin/git init --quiet "$GITHUB_WORKSPACE"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags --depth=2 origin "$EXACT_QUALIFICATION_HEAD"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)" = "$EXACT_CONTROL_HEAD"

      - name: Independently authenticate exact final H, G, and Q for this ordinal
        id: gate
        timeout-minutes: 1
        env:
          CONFIGURED_IMPLEMENTATION_HEAD: ${{ vars.STAGE2_LOCAL_IMPLEMENTATION_HEAD }}
          CONFIGURED_CONTROL_HEAD: ${{ vars.STAGE2_LOCAL_CONTROL_HEAD }}
          CONFIGURED_QUALIFICATION_HEAD: ${{ vars.STAGE2_LOCAL_QUALIFICATION_HEAD }}
          CONFIGURED_AUTHORIZED_ACTOR: ${{ vars.STAGE2_LOCAL_AUTHORIZED_ACTOR }}
          PRE_EFFECT_ADMITTED_RUN_ID: ${{ needs.admission.outputs.run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXACT_QUALIFICATION_HEAD" = "$GITHUB_SHA"
          test "$EXACT_QUALIFICATION_HEAD" = "$(/usr/bin/git rev-parse HEAD)"
          test "$EXACT_CONTROL_HEAD" = "$(/usr/bin/git rev-parse HEAD^)"
          test -z "$(/usr/bin/git status --porcelain)"
          /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            /usr/bin/python3 -I -B scripts/stage2-prebuilt-local-qualification-guard.py >>"$GITHUB_OUTPUT"

      - name: Acquire exact reviewed implementation revision H separately without credentials
        timeout-minutes: 1
        run: |
          set -euo pipefail
          destination=$GITHUB_WORKSPACE/stage2-implementation-H
          test ! -e "$destination"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" /usr/bin/git init --quiet "$destination"
          "${clean[@]}" /usr/bin/git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" /usr/bin/git -C "$destination" fetch --quiet --no-tags --depth=1 origin "${{ steps.gate.outputs.implementation_head }}"
          "${clean[@]}" /usr/bin/git -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(/usr/bin/git -C "$destination" rev-parse HEAD)" = "${{ steps.gate.outputs.implementation_head }}"
          test -z "$(/usr/bin/git -C "$destination" status --porcelain)"

      - name: Complete exact immutable preparation before KVM eligibility and role custody
        id: preparation
        timeout-minutes: 35
        env:
          EXPECTED_MANIFEST: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
        run: |
          set -euo pipefail
          test ! -e /var/lib/cogs
          test ! -e /opt/kata
          test ! -e /run/netns
          sudo -n /bin/mkdir -m 0755 /run/netns
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /run/netns)" = root:root:755
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)" = root:root:777
          sudo -n /bin/chmod 0755 /opt
          prepared=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 75s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/stage2-implementation-H/scripts/prepare-stage2-fixed-source.py")
          /usr/bin/python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read()); assert value["revision"] == sys.argv[1] and value["manifest_sha256"] == sys.argv[2]
          ' "${{ steps.gate.outputs.implementation_head }}" "$EXPECTED_MANIFEST" <<<"$prepared"
          staged=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 75s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B scripts/stage2-stage-prebuilt-control.py)
          test "$staged" = "control_sha256=$EXPECTED_CONTROL_SHA256"
          immutable=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 1770s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_kata_immutable_preparation.py)
          /usr/bin/python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read()); assert value == {"version":"cogs.stage2-local-immutable-preparation/v2","rootfs_artifact_count":1,"runtime_archive_count":2,"receipt_sha256":value["receipt_sha256"],"control_verified":True,"authority":"immutable-public-input-preparation-only"}; assert len(value["receipt_sha256"]) == 64
          ' <<<"$immutable"
          descriptor=$(/usr/bin/python3 -I -B -c 'import json,pathlib,re
          paths=list(pathlib.Path("/var/lib/cogs/stage2-completion-v1/control").glob("stage2-local-execution-envelope-v3.json")); assert len(paths)==1
          value=json.loads(paths[0].read_bytes())["rootfs"]["prebuilt_descriptor_sha256"]; assert re.fullmatch("[0-9a-f]{64}",value); print(value)')
          test "$descriptor" = "${{ steps.gate.outputs.rootfs_descriptor_sha256 }}"
          sudo -n /usr/bin/test -x /opt/kata/bin/containerd-shim-kata-v2
          test ! -e /run/cogs-stage2-local-private-v2

      - name: Materialize ordinal and batch bound non-cloud formal grant
        id: grant
        timeout-minutes: 1
        env: &formal_expected
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_QUALIFICATION_HEAD: ${{ steps.gate.outputs.qualification_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          EXPECTED_ROOTFS_DESCRIPTOR_SHA256: ${{ steps.gate.outputs.rootfs_descriptor_sha256 }}
          EXPECTED_STATIC_CONTROL_RUN_ID: ${{ steps.gate.outputs.static_control_run_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_ID: ${{ steps.gate.outputs.static_control_artifact_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST: ${{ steps.gate.outputs.static_control_artifact_digest }}
          EXPECTED_MIXED_PREFLIGHT_RUN_ID: ${{ needs.admission.outputs.preflight_run_id }}
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i PATH=/usr/bin:/bin FORMAL_CYCLE_ORDINAL="$FORMAL_CYCLE_ORDINAL" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_IMPLEMENTATION_HEAD="$EXPECTED_IMPLEMENTATION_HEAD" EXPECTED_CONTROL_HEAD="$EXPECTED_CONTROL_HEAD" \
            EXPECTED_QUALIFICATION_HEAD="$EXPECTED_QUALIFICATION_HEAD" \
            EXPECTED_STATIC_CONTROL_RUN_ID="$EXPECTED_STATIC_CONTROL_RUN_ID" \
            EXPECTED_STATIC_CONTROL_ARTIFACT_ID="$EXPECTED_STATIC_CONTROL_ARTIFACT_ID" \
            EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST="$EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST" \
            EXPECTED_MIXED_PREFLIGHT_RUN_ID="$EXPECTED_MIXED_PREFLIGHT_RUN_ID" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" EXPECTED_CONTROL_SHA256="$EXPECTED_CONTROL_SHA256" \
            EXPECTED_WORKFLOW_SHA256="$EXPECTED_WORKFLOW_SHA256" EXPECTED_RESULT_SCHEMA_SHA256="$EXPECTED_RESULT_SCHEMA_SHA256" \
            EXPECTED_ROOTFS_DESCRIPTOR_SHA256="$EXPECTED_ROOTFS_DESCRIPTOR_SHA256" \
            /usr/bin/python3 -I -B scripts/stage2-formal-local-qualification.py grant \
            | /usr/bin/tee -a "$GITHUB_OUTPUT" >/dev/null

      - name: Provision the fresh-host NFT writer owner
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/scripts/provision-stage2-nft-owner.py

      - name: Execute exactly one ordinal-bound formal cycle
        id: local_entry
        continue-on-error: true
        timeout-minutes: 132
        run: |
          set -euo pipefail
          test ! -e "$REPORT_STAGING"
          /bin/mkdir -m 0700 -- "$REPORT_STAGING"
          /bin/mkdir -m 0700 -- "$CYCLE_STAGING"
          case "$FORMAL_CYCLE_ORDINAL" in
            1) entry=completion_formal_cycle_full.py ;;
            2|3|4|5|6|7) entry=completion_formal_cycle_readiness.py ;;
            *) exit 1 ;;
          esac
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 7800s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            /usr/bin/python3 -I -B "/var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/$entry" \
            | /usr/bin/tee "$CYCLE_STAGING/receipt.partial" >/dev/null

      - name: Invoke cleanup-only recovery after every cycle outcome
        id: recovery
        if: always()
        continue-on-error: true
        timeout-minutes: 13
        run: |
          set -euo pipefail
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 720s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/recover-stage2-completion-remote.sh

      - name: Settle fixed roots only after recovery
        id: fixed_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B scripts/stage2-local-settlement.py supervise-cleanup <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          ${{ steps.recovery.outcome }}
          EOF

      - name: Independently prove zero lifecycle residue after cleanup
        id: independent_residue
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo -n /usr/bin/python3 -I -B scripts/stage2-local-settlement.py supervise-residue <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          EOF

      - name: Freeze exact typed cycle receipt and canonical status
        id: publication
        if: always() && steps.local_entry.outcome == 'success' && steps.recovery.outcome == 'success' && steps.fixed_cleanup.outcome == 'success' && steps.independent_residue.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env: *formal_expected
        run: |
          set -euo pipefail
          sudo -n env -i PATH=/usr/bin:/bin FORMAL_CYCLE_ORDINAL="$FORMAL_CYCLE_ORDINAL" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            CYCLE_STAGING="$CYCLE_STAGING" TRUSTED_RUNNER_UID="$(id -u)" \
            EXPECTED_IMPLEMENTATION_HEAD="$EXPECTED_IMPLEMENTATION_HEAD" EXPECTED_CONTROL_HEAD="$EXPECTED_CONTROL_HEAD" \
            EXPECTED_QUALIFICATION_HEAD="$EXPECTED_QUALIFICATION_HEAD" \
            EXPECTED_STATIC_CONTROL_RUN_ID="$EXPECTED_STATIC_CONTROL_RUN_ID" \
            EXPECTED_STATIC_CONTROL_ARTIFACT_ID="$EXPECTED_STATIC_CONTROL_ARTIFACT_ID" \
            EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST="$EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST" \
            EXPECTED_MIXED_PREFLIGHT_RUN_ID="$EXPECTED_MIXED_PREFLIGHT_RUN_ID" \
            EXPECTED_SOURCE_MANIFEST_SHA256="$EXPECTED_SOURCE_MANIFEST_SHA256" EXPECTED_CONTROL_SHA256="$EXPECTED_CONTROL_SHA256" \
            EXPECTED_WORKFLOW_SHA256="$EXPECTED_WORKFLOW_SHA256" EXPECTED_RESULT_SCHEMA_SHA256="$EXPECTED_RESULT_SCHEMA_SHA256" \
            EXPECTED_ROOTFS_DESCRIPTOR_SHA256="$EXPECTED_ROOTFS_DESCRIPTOR_SHA256" \
            /usr/bin/python3 -I -B scripts/stage2-formal-local-qualification.py publish

      - name: Upload sole canonical cycle receipt and status
        id: cycle_upload
        if: always() && steps.publication.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CYCLE_ARTIFACT_NAME }}
          path: ${{ env.REPORT_STAGING }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download cycle artifact by exact numeric ID
        id: cycle_download
        if: always() && steps.cycle_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.cycle_upload.outputs.artifact-id }}
          path: ${{ env.REPORT_READBACK_STAGING }}
          merge-multiple: true
          digest-mismatch: error

      - name: Validate exact-ID and exact-archive-digest cycle readback
        id: cycle_readback
        if: always() && steps.cycle_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_QUALIFICATION_HEAD: ${{ steps.gate.outputs.qualification_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          EXPECTED_ROOTFS_DESCRIPTOR_SHA256: ${{ steps.gate.outputs.rootfs_descriptor_sha256 }}
          EXPECTED_STATIC_CONTROL_RUN_ID: ${{ steps.gate.outputs.static_control_run_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_ID: ${{ steps.gate.outputs.static_control_artifact_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST: ${{ steps.gate.outputs.static_control_artifact_digest }}
          EXPECTED_MIXED_PREFLIGHT_RUN_ID: ${{ needs.admission.outputs.preflight_run_id }}
          CYCLE_ARTIFACT_ID: ${{ steps.cycle_upload.outputs.artifact-id }}
          CYCLE_ARTIFACT_DIGEST: ${{ steps.cycle_upload.outputs.artifact-digest }}
        run: |
          /usr/bin/python3 -I -B scripts/stage2-formal-local-qualification.py readback

      - name: Remove cycle output and readback staging
        id: output_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          sudo -n /bin/rm -rf -- "$REPORT_STAGING" "$REPORT_READBACK_STAGING" "$RECEIPT_READBACK_STAGING"
          test ! -e "$REPORT_STAGING" && test ! -e "$REPORT_READBACK_STAGING" && test ! -e "$RECEIPT_READBACK_STAGING"

      - name: Restore hosted scaffolding after runtime removal
        id: host_scaffold_restore
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test ! -e /opt/kata
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' /run/netns)" = root:root:755
          sudo -n /bin/rmdir /run/netns
          seen=$(sudo -n /usr/bin/stat -c '%U:%G:%a' /opt)
          case "$seen" in root:root:755) sudo -n /bin/chmod 0777 /opt ;; root:root:777) ;; *) exit 1 ;; esac

      - name: Run one final supervised cycle residue observation
        id: final_observation
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          sudo -n /usr/bin/python3 -I -B scripts/stage2-local-settlement.py supervise-final <<EOF
          $GITHUB_RUN_ID
          $GITHUB_RUN_ATTEMPT
          $REPORT_STAGING
          $REPORT_READBACK_STAGING
          $RECEIPT_READBACK_STAGING
          EOF

      - name: Enforce one-attempt complete cycle custody and zero residue
        if: always()
        timeout-minutes: 1
        env:
          ENTRY: ${{ steps.local_entry.outcome }}
          RECOVERY: ${{ steps.recovery.outcome }}
          FIXED_CLEANUP: ${{ steps.fixed_cleanup.outcome }}
          INDEPENDENT_RESIDUE: ${{ steps.independent_residue.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
          CYCLE_UPLOAD: ${{ steps.cycle_upload.outcome }}
          CYCLE_DOWNLOAD: ${{ steps.cycle_download.outcome }}
          CYCLE_READBACK: ${{ steps.cycle_readback.outcome }}
          OUTPUT_CLEANUP: ${{ steps.output_cleanup.outcome }}
          HOST_SCAFFOLD_RESTORE: ${{ steps.host_scaffold_restore.outcome }}
          FINAL_OBSERVATION: ${{ steps.final_observation.outcome }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          for outcome in "$ENTRY" "$RECOVERY" "$FIXED_CLEANUP" "$INDEPENDENT_RESIDUE" "$PUBLICATION" \
            "$CYCLE_UPLOAD" "$CYCLE_DOWNLOAD" "$CYCLE_READBACK" "$OUTPUT_CLEANUP" "$HOST_SCAFFOLD_RESTORE" \
            "$FINAL_OBSERVATION"
          do test "$outcome" = success; done

  aggregate:
    needs: [admission, local-kata]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_IMPLEMENTATION_HEAD: ${{ inputs.reviewed_implementation_head }}
      EXACT_CONTROL_HEAD: ${{ inputs.reviewed_control_head }}
      EXACT_QUALIFICATION_HEAD: ${{ inputs.reviewed_qualification_head }}
      CYCLE_AGGREGATE_ROOT: /var/tmp/cogs-stage2-formal-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
      PACKAGE_STAGING: /var/tmp/cogs-stage2-formal-package-${{ github.run_id }}-${{ github.run_attempt }}
      PACKAGE_READBACK: /var/tmp/cogs-stage2-formal-package-readback-${{ github.run_id }}-${{ github.run_attempt }}
      CYCLE_CUSTODY_API_RESPONSE: /var/tmp/cogs-stage2-formal-artifact-api-${{ github.run_id }}-${{ github.run_attempt }}.json
      CYCLE_CUSTODY_MAP: /var/tmp/cogs-stage2-formal-artifact-custody-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Acquire exact qualification revision Q without credentials
        timeout-minutes: 2
        run: |
          set -euo pipefail
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" /usr/bin/git init --quiet "$GITHUB_WORKSPACE"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags --depth=2 origin "$EXACT_QUALIFICATION_HEAD"
          "${clean[@]}" /usr/bin/git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXACT_QUALIFICATION_HEAD"
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)" = "$EXACT_CONTROL_HEAD"
          test -z "$(/usr/bin/git -C "$GITHUB_WORKSPACE" status --porcelain)"

      - name: Authenticate exact final H, G, and Q for aggregation
        id: gate
        timeout-minutes: 1
        env:
          CONFIGURED_IMPLEMENTATION_HEAD: ${{ vars.STAGE2_LOCAL_IMPLEMENTATION_HEAD }}
          CONFIGURED_CONTROL_HEAD: ${{ vars.STAGE2_LOCAL_CONTROL_HEAD }}
          CONFIGURED_QUALIFICATION_HEAD: ${{ vars.STAGE2_LOCAL_QUALIFICATION_HEAD }}
          CONFIGURED_AUTHORIZED_ACTOR: ${{ vars.STAGE2_LOCAL_AUTHORIZED_ACTOR }}
          PRE_EFFECT_ADMITTED_RUN_ID: ${{ needs.admission.outputs.run_id }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-prebuilt-local-qualification-guard.py >>"$GITHUB_OUTPUT"

      - name: Materialize authenticated exact custody for all seven cycle uploads
        id: cycle_custody
        if: always() && needs.local-kata.result == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_QUALIFICATION_HEAD: ${{ steps.gate.outputs.qualification_head }}
          EXPECTED_STATIC_CONTROL_RUN_ID: ${{ steps.gate.outputs.static_control_run_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_ID: ${{ steps.gate.outputs.static_control_artifact_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST: ${{ steps.gate.outputs.static_control_artifact_digest }}
          EXPECTED_MIXED_PREFLIGHT_RUN_ID: ${{ needs.admission.outputs.preflight_run_id }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          EXPECTED_ROOTFS_DESCRIPTOR_SHA256: ${{ steps.gate.outputs.rootfs_descriptor_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" >"$CYCLE_CUSTODY_API_RESPONSE"
          /usr/bin/python3 -I -B scripts/stage2-formal-local-qualification.py custody >>"$GITHUB_OUTPUT"

      - name: Download all seven cycle artifacts by exact numeric IDs
        id: cycle_download
        if: always() && steps.cycle_custody.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.cycle_custody.outputs.artifact_ids }}
          path: ${{ env.CYCLE_AGGREGATE_ROOT }}
          merge-multiple: true
          digest-mismatch: error

      - name: Aggregate seven exact typed canonical cycle receipts and statuses
        id: package_create
        if: always() && steps.cycle_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          EXPECTED_IMPLEMENTATION_HEAD: ${{ steps.gate.outputs.implementation_head }}
          EXPECTED_CONTROL_HEAD: ${{ steps.gate.outputs.control_head }}
          EXPECTED_QUALIFICATION_HEAD: ${{ steps.gate.outputs.qualification_head }}
          EXPECTED_SOURCE_MANIFEST_SHA256: ${{ steps.gate.outputs.implementation_manifest_sha256 }}
          EXPECTED_CONTROL_SHA256: ${{ steps.gate.outputs.control_sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.gate.outputs.workflow_sha256 }}
          EXPECTED_RESULT_SCHEMA_SHA256: ${{ steps.gate.outputs.result_schema_sha256 }}
          EXPECTED_ROOTFS_DESCRIPTOR_SHA256: ${{ steps.gate.outputs.rootfs_descriptor_sha256 }}
          EXPECTED_STATIC_CONTROL_RUN_ID: ${{ steps.gate.outputs.static_control_run_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_ID: ${{ steps.gate.outputs.static_control_artifact_id }}
          EXPECTED_STATIC_CONTROL_ARTIFACT_DIGEST: ${{ steps.gate.outputs.static_control_artifact_digest }}
          EXPECTED_MIXED_PREFLIGHT_RUN_ID: ${{ needs.admission.outputs.preflight_run_id }}
          CYCLE_JOB_RESULT: ${{ needs.local-kata.result }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$PACKAGE_STAGING"
          install -m 0600 "$CYCLE_CUSTODY_MAP" "$PACKAGE_STAGING/cycle-artifact-custody-v2.json"
          /usr/bin/python3 -I -B scripts/stage2-formal-local-qualification.py aggregate >"$PACKAGE_STAGING/pre-aws-package-v4.json"

      - name: Upload non-AWS prerequisite package
        id: package_upload
        if: always() && steps.package_create.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-formal-non-aws-package-${{ inputs.reviewed_implementation_head }}-${{ inputs.reviewed_control_head }}-${{ github.run_id }}-1
          path: ${{ env.PACKAGE_STAGING }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Download package by exact numeric ID
        id: package_download
        if: always() && steps.package_upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.package_upload.outputs.artifact-id }}
          path: ${{ env.PACKAGE_READBACK }}
          merge-multiple: true
          digest-mismatch: error

      - name: Byte-compare package and fail closed
        id: package_readback
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          CUSTODY: ${{ steps.cycle_custody.outcome }}
          CREATE: ${{ steps.package_create.outcome }}
          UPLOAD: ${{ steps.package_upload.outcome }}
          DOWNLOAD: ${{ steps.package_download.outcome }}
          CYCLE_JOB_RESULT: ${{ needs.local-kata.result }}
          PACKAGE_ARTIFACT_ID: ${{ steps.package_upload.outputs.artifact-id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.package_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CYCLE_JOB_RESULT" = success
          test "$CUSTODY:$CREATE:$UPLOAD:$DOWNLOAD" = success:success:success:success
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PACKAGE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          cmp "$PACKAGE_STAGING/pre-aws-package-v4.json" "$PACKAGE_READBACK/pre-aws-package-v4.json"
          cmp "$PACKAGE_STAGING/cycle-artifact-custody-v2.json" "$PACKAGE_READBACK/cycle-artifact-custody-v2.json"

      - name: Remove every aggregate staging path
        id: aggregate_cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          rm -rf -- "$CYCLE_AGGREGATE_ROOT" "$PACKAGE_STAGING" "$PACKAGE_READBACK" \
            "$CYCLE_CUSTODY_API_RESPONSE" "$CYCLE_CUSTODY_MAP"
          for path in "$CYCLE_AGGREGATE_ROOT" "$PACKAGE_STAGING" "$PACKAGE_READBACK" \
            "$CYCLE_CUSTODY_API_RESPONSE" "$CYCLE_CUSTODY_MAP"; do test ! -e "$path"; done

      - name: Enforce complete aggregate custody and cleanup
        if: always()
        timeout-minutes: 1
        env:
          CYCLE_JOB_RESULT: ${{ needs.local-kata.result }}
          CUSTODY: ${{ steps.cycle_custody.outcome }}
          DOWNLOAD: ${{ steps.cycle_download.outcome }}
          CREATE: ${{ steps.package_create.outcome }}
          UPLOAD: ${{ steps.package_upload.outcome }}
          PACKAGE_DOWNLOAD: ${{ steps.package_download.outcome }}
          READBACK: ${{ steps.package_readback.outcome }}
          CLEANUP: ${{ steps.aggregate_cleanup.outcome }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CYCLE_JOB_RESULT" = success
          for outcome in "$CUSTODY" "$DOWNLOAD" "$CREATE" "$UPLOAD" \
            "$PACKAGE_DOWNLOAD" "$READBACK" "$CLEANUP"; do test "$outcome" = success; done
