name: Stage 2 local static admission diagnostic
run-name: Non-authoritative Stage 2 static admission diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Acquire exact diagnostic control and implementation revisions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "$({ find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit; })"
          clean=(env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0)
          "${clean[@]}" git init --quiet "$GITHUB_WORKSPACE"
          "${clean[@]}" git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags --depth=1 origin \
            9f6cca5fcc059d3316cc702d2cc9f4b46b36079c
          "${clean[@]}" git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
          destination=$GITHUB_WORKSPACE/stage2-implementation-H
          "${clean[@]}" git init --quiet "$destination"
          "${clean[@]}" git -C "$destination" remote add origin https://github.com/nenb/cogs.git
          "${clean[@]}" git -C "$destination" fetch --quiet --no-tags --depth=1 origin \
            1fc2dea2dcefea2aaf71a80356e0f5ed946e9991
          "${clean[@]}" git -C "$destination" checkout --quiet --detach FETCH_HEAD

      - name: Reproduce immutable preparation without lifecycle entry
        timeout-minutes: 32
        run: |
          set -euo pipefail
          test ! -e /var/lib/cogs
          test ! -e /opt/kata
          test ! -e /var/lib/cogs-stage2-nft-owner-v1
          test ! -e /run/netns
          sudo -n mkdir -m 0755 /run/netns
          test "$(sudo -n stat -c '%U:%G:%a' /run/netns)" = root:root:755
          test "$(sudo -n stat -c '%U:%G:%a' /opt)" = root:root:777
          sudo -n chmod 0755 /opt
          prepared=$(sudo -n timeout --foreground --signal=TERM --kill-after=5s 75s \
            env -i PATH=/usr/bin:/bin python3 -I -B \
            "$GITHUB_WORKSPACE/stage2-implementation-H/scripts/prepare-stage2-fixed-source.py")
          python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read()); assert value["revision"] == sys.argv[1]
          assert value["manifest_sha256"] == sys.argv[2]' \
            1fc2dea2dcefea2aaf71a80356e0f5ed946e9991 \
            509dacc4a83b45a2da1ca7892210de8434a2b9de5b2a478ce4d8197f85967f3a <<<"$prepared"
          test "$(sudo -n env -i PATH=/usr/bin:/bin python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-stage-reviewed-control.py")" = \
            control_sha256=d94af3687d21c432946f3bb1bc40b76fc8dad786fea2cc51366d1651a8a33926
          sudo -n timeout --foreground --signal=TERM --kill-after=10s 1770s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            python3 -I -B /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_kata_immutable_preparation.py \
            >/tmp/cogs-static-admission-preparation.json
          sudo -n env -i HOME=/root LC_ALL=C PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PYTHONDONTWRITEBYTECODE=1 python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/scripts/provision-stage2-nft-owner.py

      - name: Consume the full diagnostic receipt and exercise publication without upload
        timeout-minutes: 150
        run: |
          sudo -n env -i HOME=/nonexistent LANG=C LC_ALL=C \
            PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" TRUSTED_RUNNER_UID="$(id -u)" \
            python3 -I -B - <<'PY'
          import hashlib, importlib.util, os, pathlib, sys, traceback
          sys.stdout.reconfigure(line_buffering=True)
          sys.path.insert(0, "/var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote")
          import completion_kata_coordinator as coordinator
          import completion_local_receipt as local_receipt
          staging = pathlib.Path("/var/lib/cogs/stage2-diagnostic-publication")
          try:
              receipt = coordinator._run_fixed_local_qualification()
              raw = local_receipt._consume_local_receipt(receipt)
              print(f"COGS_FULL_OWNER_DIAGNOSTIC:CONSUMED:{len(raw)}:{hashlib.sha256(raw).hexdigest()}")
              staging.mkdir(mode=0o700)
              source = os.open(staging / "report.partial", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              try:
                  if os.write(source, raw) != len(raw): raise RuntimeError("diagnostic write incomplete")
                  os.fchown(source, int(os.environ["TRUSTED_RUNNER_UID"]), 0)
                  os.fsync(source)
              finally: os.close(source)
              os.chown(staging, int(os.environ["TRUSTED_RUNNER_UID"]), 0)
              path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "scripts/stage2-local-publication.py"
              spec = importlib.util.spec_from_file_location("diagnostic_publication", path)
              publication = importlib.util.module_from_spec(spec); spec.loader.exec_module(publication)
              result = publication.publish(staging, "1fc2dea2dcefea2aaf71a80356e0f5ed946e9991",
                  "509dacc4a83b45a2da1ca7892210de8434a2b9de5b2a478ce4d8197f85967f3a",
                  "57ff30b4adb601a7775dbefc9002c983152974ba3244aa449656c7e8a5f7dc27",
                  int(os.environ["TRUSTED_RUNNER_UID"]))
              print(f"COGS_FULL_OWNER_DIAGNOSTIC:PUBLISHED:{result[0]}:{result[1]}:{result[2]}")
          except BaseException as error:
              print("COGS_FULL_OWNER_DIAGNOSTIC:TERMINAL")
              for index in range(32):
                  if error is None: break
                  message = str(error).replace("\n", " ")[:192]
                  print(f"COGS_FULL_OWNER_CAUSE:{index}:{type(error).__name__}:{message}")
                  for ordinal, frame in enumerate(traceback.extract_tb(error.__traceback__)[-8:]):
                      name = frame.filename.rsplit("/", 1)[-1]
                      if (frame.filename.startswith("/var/lib/cogs/stage2-completion-v1/source/")
                              or name in {"stage2-local-publication.py", "stage2-native-publication.py"}):
                          print(f"COGS_FULL_OWNER_FRAME:{index}:{ordinal}:{name}:{frame.lineno}:{frame.name}")
                  error = error.__cause__ or error.__context__
          finally:
              for name in ("report.partial", "report.fresh", "report.json"):
                  try: os.unlink(staging / name)
                  except FileNotFoundError: pass
              try: staging.rmdir()
              except FileNotFoundError: pass
          PY

      - name: Remove diagnostic-only immutable state
        if: always()
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if test -x /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/recover-stage2-completion-remote.sh; then
            sudo -n timeout --signal=TERM --kill-after=10s 720s \
              env -i HOME=/nonexistent LANG=C LC_ALL=C \
              PATH=/opt/kata/bin:/usr/sbin:/usr/bin:/sbin:/bin TZ=UTC \
              /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/recover-stage2-completion-remote.sh
          fi
          sudo -n rm -rf --one-file-system -- /var/lib/cogs /opt/kata /var/lib/cogs-stage2-nft-owner-v1
          sudo -n rm -f -- /tmp/cogs-static-admission-preparation.json
          test "$(sudo -n stat -c '%U:%G:%a' /run/netns)" = root:root:755
          sudo -n rmdir /run/netns
          sudo -n chmod 0777 /opt
          test ! -e /var/lib/cogs
          test ! -e /opt/kata
          test ! -e /run/netns
          test "$(sudo -n stat -c '%U:%G:%a' /opt)" = root:root:777
