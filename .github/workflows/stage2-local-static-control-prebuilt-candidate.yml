name: Stage 2 prebuilt no-KVM static control candidate
run-name: Non-authoritative Stage 2 static control H=${{ inputs.exact_implementation_head }}

on:
  workflow_dispatch:
    inputs:
      exact_implementation_head:
        description: Exact reviewed implementation revision H
        required: true
        type: string
      rootfs_control_run_id:
        description: Exact trusted publisher run ID
        required: true
        type: string
      rootfs_control_artifact_id:
        description: Exact descriptor artifact ID
        required: true
        type: string
      rootfs_control_artifact_digest:
        description: Exact sha256-prefixed descriptor archive digest
        required: true
        type: string

permissions:
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    # Step bounds total 53 minutes with a seven-minute cleanup/runner reserve.
    timeout-minutes: 60
    concurrency:
      group: stage2-no-kvm-static-control-${{ inputs.exact_implementation_head }}
      cancel-in-progress: false
    steps:
      - name: Admit sole first-created prebuilt static-control generation
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.exact_implementation_head }}
          CONTROL_RUN_ID: ${{ inputs.rootfs_control_run_id }}
          CONTROL_ARTIFACT_ID: ${{ inputs.rootfs_control_artifact_id }}
        run: |
          set -euo pipefail
          # ADR0326 complete retirement mirror; selection only, never ancestors.
          for selected in "$GITHUB_SHA" "$EXACT_IMPLEMENTATION_HEAD" "$GITHUB_RUN_ID" "$CONTROL_RUN_ID" "$CONTROL_ARTIFACT_ID"; do
            case "$selected" in
              c30e0d69ec374cd812ff361e670e974d51b661c4|15d99b55f4910df94decdd7edcc80bf95aee492d|d0e29eb359f0c1678c18f676e312276eff3aa3f8|34375934829|34402409489|34403562378|34411847798|10114901253|10123988189|10124443866|c10fc103532f3e3a8b746727bd0f48c6d8498148|eb59cae18e0f041a243f35f253d46713f7e87142|b11adc47c454bde0dc0e2930012e418b90917555|34282898803|34292774279|34293986674|34301325559|34302034014|10079099187|10081986019|10082440691|6276eae08e29ee577f3d9b2c739ceadfe467a769|5601edf196a1bd4127afed6adf12ad8525fdb5b3|9f6e79140e4df284588182c96b5044bb52f50ef9|0e5b7012fabae3412ce8e3110bb181af1ffe608b|f93748b253c1429cce9149defde623f40c9cc0ab|d2fe08553d25d73fa276794c96b0f311e5406186|a108f981dacad6978e2a37d16a143da5c3b51cf4|728a77a87328e9cccd57547a930e84764964061f|8e2af4398519ab8d64b7f9e7194f9c116c6f51d9|229ea62bce964086726181974a6fec1c6dfd1f86|821149ba4c3dbccef48694efcdb1eb29fa9fd2b9|06188f67a9a699924d645ce8aa0e91950b6341c7|8a1b56cfdaf013b27d8ef7a7e2753d3bb2582271|69987e08cf9454fecf540a4de097f0877155b043|97bc8eb8520a2116914c65a9ec5929e82c34ebf3|942e84cd8f977ee23a97dc47ce4a5d2d7510b346|0296252721fad0502dd4f41dacb1674e71b42bd6|9b9966afffe0ea8de4d0c99147886a95094470a9|6bd12dcd25d877ffac03752fa0f71beeeb86a99e|8907eba3191d07573cd84573cb0b2adddff17bd6|242bbefeae5444118d9e97b46597130b509ca253|34257525184|33626103650|33630868892|33837299968|33850962596|33851159217|33908498241|33931002300|33931091412|33965298642|33972129993|33980034976|33987181596|33987659305|33995592875|33995910136|34007531193|34013328638|34013774850|34183885618|34192071842|34192787285|34023790672|34028384783|10069446931|9845676644|9924034454|9928325265|9951239210|9958532006|9958574502|9971564905|9973726406|9975524471|9975667979|9981717931|9983143614|9983282050|10040293103|10042564354|9988125363) exit 2 ;;
            esac
          done
          if test "${ImageOS-}" != ubuntu24 || test "${ImageVersion-}" != 20260907.300.1; then
            /usr/bin/printf '%s\n' 'stage2.runner-image.rejected' >&2
            exit 2
          fi
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = nenb/cogs
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = nenb
          test "$GITHUB_TRIGGERING_ACTOR" = nenb
          [[ "$EXACT_IMPLEMENTATION_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" != "$EXACT_IMPLEMENTATION_HEAD"
          gh api --paginate --slurp \
            "repos/nenb/cogs/actions/workflows/stage2-local-static-control-prebuilt-candidate.yml/runs?event=workflow_dispatch&per_page=100&head_sha=$GITHUB_SHA" \
            >"$RUNNER_TEMP/static-runs.json"
          jq -e --arg g "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" \
            '([.[].total_count] | unique) == [1] and
             ([.[].workflow_runs[] | select(.head_sha == $g and
               .path == ".github/workflows/stage2-local-static-control-prebuilt-candidate.yml")] |
              map(.id) == [$current])' "$RUNNER_TEMP/static-runs.json" >/dev/null

      - name: Check out exact reviewed implementation head without credentials
        timeout-minutes: 2
        env:
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.exact_implementation_head }}
        run: |
          set -euo pipefail
          test -z "$(/usr/bin/find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          cd "$GITHUB_WORKSPACE"
          env -i HOME=/nonexistent PATH=/usr/bin:/bin GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            /usr/bin/git init .
          env -i HOME=/nonexistent PATH=/usr/bin:/bin GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            /usr/bin/git remote add origin https://github.com/nenb/cogs.git
          env -i HOME=/nonexistent PATH=/usr/bin:/bin GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            /usr/bin/git -c credential.helper= fetch --no-tags --depth=1 origin \
            "$EXACT_IMPLEMENTATION_HEAD"
          env -i HOME=/nonexistent PATH=/usr/bin:/bin GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            /usr/bin/git checkout --detach FETCH_HEAD

      - name: Establish exact-head static-only source policy and owned runtime baseline
        id: boundary
        timeout-minutes: 1
        env:
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.exact_implementation_head }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/stage2-revision-retirement.py "$GITHUB_SHA" "$EXACT_IMPLEMENTATION_HEAD"
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$EXACT_IMPLEMENTATION_HEAD" = "$(/usr/bin/git rev-parse HEAD)"
          test -z "$(/usr/bin/git status --porcelain)"
          test ! -e /var/lib/cogs
          test ! -e /opt/kata
          sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/stage2-prebuilt-static-control-runtime-boundary.py" pre
          printf 'established=true\n' >>"$GITHUB_OUTPUT"

      - name: Materialize exact H source
        id: source_acquisition
        timeout-minutes: 3
        env:
          EXACT_IMPLEMENTATION_HEAD: ${{ inputs.exact_implementation_head }}
        run: |
          set -euo pipefail
          printf 'intent=true\n' >>"$GITHUB_OUTPUT"
          result=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 150s \
            env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
            "$GITHUB_WORKSPACE/scripts/prepare-stage2-fixed-source.py")
          /usr/bin/python3 -I -c 'import json,sys
          value=json.loads(sys.stdin.buffer.read()); assert value["revision"] == sys.argv[1]
          ' "$EXACT_IMPLEMENTATION_HEAD" <<<"$result"
          printf 'acquired=true\n' >>"$GITHUB_OUTPUT"

      - name: Authenticate exact trusted rootfs control input
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_RUN_ID: ${{ inputs.rootfs_control_run_id }}
          CONTROL_ARTIFACT_ID: ${{ inputs.rootfs_control_artifact_id }}
          CONTROL_ARTIFACT_DIGEST: ${{ inputs.rootfs_control_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/nenb/cogs/actions/runs/$CONTROL_RUN_ID" > /tmp/rootfs-control-run.json
          jq -e --arg h "$GITHUB_SHA" --arg title "Trusted prebuilt rootfs publication H=${{ inputs.exact_implementation_head }} artifact=" \
            '.path == ".github/workflows/stage2-prebuilt-rootfs-publisher.yml" and .head_sha == $h and
             .head_branch == "main" and .event == "workflow_dispatch" and (.display_title | startswith($title)) and
             .run_attempt == 1 and .status == "completed" and .conclusion == "success"' \
            /tmp/rootfs-control-run.json >/dev/null
          gh api "repos/nenb/cogs/actions/artifacts/$CONTROL_ARTIFACT_ID" > /tmp/rootfs-control-artifact.json
          jq -e --arg digest "$CONTROL_ARTIFACT_DIGEST" --argjson run "$CONTROL_RUN_ID" \
            --arg name "stage2-prebuilt-rootfs-control-input-${{ inputs.exact_implementation_head }}" \
            '.expired == false and .digest == $digest and .workflow_run.id == $run and .name == $name' \
            /tmp/rootfs-control-artifact.json >/dev/null

      - name: Download exact trusted rootfs descriptor
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.rootfs_control_artifact_id }}
          path: ${{ runner.temp }}/rootfs-control
          run-id: ${{ inputs.rootfs_control_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Stage only the descriptor for immutable acquisition
        timeout-minutes: 1
        env: { EXACT_H: "${{ inputs.exact_implementation_head }}" }
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/rootfs-control" -type f | wc -l)" = 6
          for name in descriptor.json publication-receipt.json rootfs.provenance.json rootfs.package.json producer-receipt.json cosign-verification.json; do
            test -f "$RUNNER_TEMP/rootfs-control/$name"
          done
          /usr/bin/python3 -I -B scripts/stage2-revision-retirement.py custody "$RUNNER_TEMP/rootfs-control" "$EXACT_H" "$GITHUB_SHA"
          sudo -n install -d -m 0700 /var/lib/cogs/stage2-prebuilt-rootfs-descriptor-v1
          sudo -n install -o root -g root -m 0400 "$RUNNER_TEMP/rootfs-control/descriptor.json" \
            /var/lib/cogs/stage2-prebuilt-rootfs-descriptor-v1/descriptor.json
          test "$(sudo -n find /var/lib/cogs/stage2-prebuilt-rootfs-descriptor-v1 -type f | wc -l)" = 1

      - name: Acquire verify and install immutable fixtures without runtime launch
        id: immutable_acquisition
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if test -e "$RUNNER_TEMP/cogs-stage2-immutable-preparation.json" || \
             test -L "$RUNNER_TEMP/cogs-stage2-immutable-preparation.json"; then exit 2; fi
          printf 'intent=true\n' >>"$GITHUB_OUTPUT"
          result=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=10s 1770s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_kata_immutable_preparation.py)
          printf '%s\n' "$result" >"$RUNNER_TEMP/cogs-stage2-immutable-preparation.json"
          printf 'acquired=true\n' >>"$GITHUB_OUTPUT"
          test ! -e /run/vc
          test ! -e /run/netns/cogs-stage2-ssh

      - name: Stage authenticated publication adjuncts after immutable acquisition
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for name in publication-receipt.json rootfs.provenance.json rootfs.package.json producer-receipt.json cosign-verification.json; do
            sudo -n install -o root -g root -m 0400 "$RUNNER_TEMP/rootfs-control/$name" \
              "/var/lib/cogs/stage2-prebuilt-rootfs-descriptor-v1/$name"
          done
          test "$(sudo -n find /var/lib/cogs/stage2-prebuilt-rootfs-descriptor-v1 -type f | wc -l)" = 6

      - name: Produce deterministic non-authoritative control candidate
        id: candidate_production
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if test -e "$RUNNER_TEMP/cogs-stage2-static-candidate.json" || \
             test -L "$RUNNER_TEMP/cogs-stage2-static-candidate.json"; then exit 2; fi
          printf 'intent=true\n' >>"$GITHUB_OUTPUT"
          result=$(sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 150s \
            env -i HOME=/nonexistent LANG=C LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            COGS_STAGE2_CONTROL_REVISION="$GITHUB_SHA" \
            /usr/bin/python3 -I -B \
            /var/lib/cogs/stage2-completion-v1/source/deploy/aws-feasibility/remote/completion_kata_preparation.py)
          printf '%s\n' "$result" >"$RUNNER_TEMP/cogs-stage2-static-candidate.json"
          printf 'acquired=true\n' >>"$GITHUB_OUTPUT"
          test ! -e /run/vc

      - name: Expose only immutable candidate traversal to the artifact reader
        timeout-minutes: 1
        run: |
          set -euo pipefail
          root=/var/lib/cogs
          stage=$root/stage2-completion-v1
          observation=$stage/control-observation-v1
          candidate=$observation/candidate
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' "$candidate")" = root:root:555
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' "$stage/source")" = root:root:700
          sudo -n /bin/chmod 0711 "$root" "$stage" "$observation"
          for parent in "$root" "$stage" "$observation"; do
            test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' "$parent")" = root:root:711
          done
          test "$(sudo -n /usr/bin/stat -c '%U:%G:%a' "$stage/source")" = root:root:700
          test -r "$candidate/stage2-local-static-control-v2.json"

      - id: candidate_upload
        name: Upload non-authoritative candidate package only
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: non-authoritative-stage2-static-control-${{ inputs.exact_implementation_head }}-${{ github.run_id }}-1
          path: /var/lib/cogs/stage2-completion-v1/control-observation-v1/candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download candidate by exact numeric ID and archive digest
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-readback
          merge-multiple: true
          digest-mismatch: error

      - name: Validate exact candidate readback before cleanup
        timeout-minutes: 2
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - \
            /var/lib/cogs/stage2-completion-v1/control-observation-v1/candidate \
            "$RUNNER_TEMP/candidate-readback" <<'PY'
          import hashlib,pathlib,stat,sys
          roots=[pathlib.Path(item) for item in sys.argv[1:]]
          values=[]
          for root in roots:
              rows={}
              for path in root.rglob("*"):
                  mode=path.lstat().st_mode
                  assert stat.S_ISDIR(mode) or (stat.S_ISREG(mode) and path.stat().st_nlink==1)
                  if stat.S_ISREG(mode): rows[path.relative_to(root).as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
              values.append(rows)
          assert values[0] and values[0] == values[1]
          PY

      - name: Remove only acquired fixtures and verify the established static boundary
        if: always() && steps.boundary.outcome != 'skipped'
        timeout-minutes: 1
        env:
          BOUNDARY_ESTABLISHED: ${{ steps.boundary.outputs.established }}
          SOURCE_INTENT: ${{ steps.source_acquisition.outputs.intent }}
          SOURCE_ACQUIRED: ${{ steps.source_acquisition.outputs.acquired }}
          IMMUTABLE_INTENT: ${{ steps.immutable_acquisition.outputs.intent }}
          IMMUTABLE_ACQUIRED: ${{ steps.immutable_acquisition.outputs.acquired }}
          CANDIDATE_INTENT: ${{ steps.candidate_production.outputs.intent }}
          CANDIDATE_ACQUIRED: ${{ steps.candidate_production.outputs.acquired }}
        run: |
          set -uo pipefail
          status=0
          if test "$IMMUTABLE_ACQUIRED" = true; then
            sudo -n /bin/rm -rf --one-file-system -- /var/lib/cogs /opt/kata || status=1
          elif test "$IMMUTABLE_INTENT" = true; then
            test -z "$IMMUTABLE_ACQUIRED" || status=1
            sudo -n /usr/bin/test ! -e /var/lib/cogs && sudo -n /usr/bin/test ! -L /var/lib/cogs || status=1
            sudo -n /usr/bin/test ! -e /opt/kata && sudo -n /usr/bin/test ! -L /opt/kata || status=1
          elif test "$SOURCE_ACQUIRED" = true; then
            sudo -n /bin/rm -rf --one-file-system -- /var/lib/cogs || status=1
            sudo -n /usr/bin/test ! -e /opt/kata && sudo -n /usr/bin/test ! -L /opt/kata || status=1
          elif test "$SOURCE_INTENT" = true; then
            test -z "$SOURCE_ACQUIRED" || status=1
            sudo -n /usr/bin/test ! -e /var/lib/cogs && sudo -n /usr/bin/test ! -L /var/lib/cogs || status=1
            sudo -n /usr/bin/test ! -e /opt/kata && sudo -n /usr/bin/test ! -L /opt/kata || status=1
          else
            test -z "$SOURCE_INTENT$SOURCE_ACQUIRED$IMMUTABLE_INTENT$IMMUTABLE_ACQUIRED" || status=1
            sudo -n /usr/bin/test ! -e /var/lib/cogs && sudo -n /usr/bin/test ! -L /var/lib/cogs || status=1
            sudo -n /usr/bin/test ! -e /opt/kata && sudo -n /usr/bin/test ! -L /opt/kata || status=1
          fi
          if test "$IMMUTABLE_INTENT" = true; then
            /bin/rm -f -- "$RUNNER_TEMP/cogs-stage2-immutable-preparation.json" || status=1
          fi
          if test "$CANDIDATE_INTENT" = true; then
            /bin/rm -f -- "$RUNNER_TEMP/cogs-stage2-static-candidate.json" || status=1
          else
            test -z "$CANDIDATE_INTENT$CANDIDATE_ACQUIRED" || status=1
          fi
          if test "$BOUNDARY_ESTABLISHED" = true; then
            test -f /tmp/cogs-stage2-static-runtime-boundary-v1.json || status=1
            test -f "$GITHUB_WORKSPACE/scripts/stage2-prebuilt-static-control-runtime-boundary.py" \
              && sudo -n /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 45s \
                env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B \
                "$GITHUB_WORKSPACE/scripts/stage2-prebuilt-static-control-runtime-boundary.py" post \
              || status=1
            sudo -n /bin/rm -f -- /tmp/cogs-stage2-static-runtime-boundary-v1.json || status=1
          else
            test -z "$BOUNDARY_ESTABLISHED" || status=1
            test ! -e /tmp/cogs-stage2-static-runtime-boundary-v1.json \
              && test ! -L /tmp/cogs-stage2-static-runtime-boundary-v1.json || status=1
          fi
          test ! -e /var/lib/cogs || status=1
          test ! -e /opt/kata || status=1
          exit "$status"
