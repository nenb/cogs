{{- if .Values.stage4Preparation.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cogs.componentName" (dict "root" . "component" "trusted") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cogs.stage4Labels" . | nindent 4 }}
    dev.cogs/role: "trusted"
  annotations:
    dev.cogs/notice: "inert-static-preparation-only"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cogs.componentName" (dict "root" . "component" "sandbox") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cogs.stage4Labels" . | nindent 4 }}
    dev.cogs/role: "sandbox"
  annotations:
    dev.cogs/notice: "inert-static-preparation-only"
automountServiceAccountToken: false
{{- end -}}
