# Default-disabled static render-only source shapes. Even intentionally rendered YAML is
# unsafe to apply and remains unproven; this chart makes no security or production claim.
stage4Preparation:
  enabled: false
  nonProductionAcknowledgement: false
  sessionIdentity: ""
  runtimeClassName: ""

  images:
    worker: ""
    proxy: ""
    sandbox: ""

  placement:
    trusted:
      nodeSelector: {}
      tolerations: []
    sandbox:
      nodeSelector: {}
      tolerations: []

  storage:
    workspaceStorageClass: ""
    workspaceSize: 20Gi
    workspaceAccessMode: ReadWriteOncePod
    sessionStateStorageClass: ""
    sessionStateSize: 5Gi
    sessionStateAccessMode: ReadWriteOncePod

  openBao:
    endpoint: ""
    kubernetesAuthMount: ""
    kubernetesAuthRole: ""
    pkiPath: ""
    tokenAudience: ""
    peer:
      namespaceLabels: {}
      podLabels: {}
      port: 0

  otlp:
    endpoint: ""
    protocol: ""
    peer:
      namespaceLabels: {}
      podLabels: {}
      port: 0

  proxyIdentity:
    capabilityAudience: ""
    sourceBindingRequired: false

  resourceProfile: stage4-fixed-bounded-v1
  lifecycle:
    idleSeconds: 1800
    hardSeconds: 28800
    terminationGraceSeconds: 30
  auditWalMaxBytes: 268435456

  publicEgressCa: ""
