# Notes-only static source-shape test data. The NOTES payload is unsafe to apply and unqualified.
stage4Preparation:
  enabled: true
  nonProductionAcknowledgement: true
  sessionIdentity: static-test-session
  runtimeClassName: kata-qemu-cogs

  images:
    worker: registry.example.invalid/cogs/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    proxy: envoyproxy/envoy:v1.38.3@sha256:5f7c43e1147412fdb3af578c651c67478a3df818eae89d2261e707e06c209cdb
    sandbox: registry.example.invalid/cogs/sandbox@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

  placement:
    trusted:
      nodeSelector:
        cogs.dev/node-domain: trusted
      tolerations: []
    sandbox:
      nodeSelector:
        cogs.dev/node-domain: sandbox-kata
        cogs.dev/nested-virtualization: enabled
        cogs.dev/sandbox-runtime: kata-qemu-kvm
      tolerations:
        - key: cogs.dev/sandbox
          operator: Equal
          value: kata
          effect: NoSchedule

  storage:
    workspaceStorageClass: synthetic-workspace-csi
    workspaceSize: 20Gi
    workspaceAccessMode: ReadWriteOncePod
    sessionStateStorageClass: synthetic-session-state-csi
    sessionStateSize: 5Gi
    sessionStateAccessMode: ReadWriteOncePod

  openBao:
    endpoint: https://openbao.static-test.invalid:8200
    kubernetesAuthMount: auth/cogs-static-test
    kubernetesAuthRole: cogs-static-test-role
    pkiPath: pki/cogs-static-test
    tokenAudience: openbao.cogs.static-test
    peer:
      namespaceLabels:
        kubernetes.io/metadata.name: synthetic-openbao
      podLabels:
        app.kubernetes.io/name: synthetic-openbao
      port: 8200

  otlp:
    endpoint: https://otlp.static-test.invalid:4317
    protocol: grpc
    peer:
      namespaceLabels:
        kubernetes.io/metadata.name: synthetic-observability
      podLabels:
        app.kubernetes.io/name: synthetic-otel-collector
      port: 4317

  proxyIdentity:
    capabilityAudience: cogs-egress-proxy.static-test
    sourceBindingRequired: true

  resourceProfile: stage4-fixed-bounded-v1
  lifecycle:
    idleSeconds: 1800
    hardSeconds: 28800
    terminationGraceSeconds: 30
  auditWalMaxBytes: 1048576

  publicEgressCaConfigMap: synthetic-public-egress-ca
